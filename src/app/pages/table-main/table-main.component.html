<bmb-table
  [truncate]="true"
  [wrap]="true"
  [data]="data"
  [columns]="columns"
  [config]="config"
  (select)="onSelect($event)"
  [actionTemplate]="actionTemplate"
  [detailTemplate]="detailTemplate"
  [pageSize]="5"
  [showSearch]="true"
  [showFilters]="true"
>
</bmb-table>

<!-- Templates -->

<ng-template #lastNameTemplate let-row="row">
  <div style="display: flex; align-items: center; gap: 4px">
    <bmb-icon icon="face" [size]="20"></bmb-icon>
    <span> {{ row.lastName }}</span>
    <button (click)="clickButton($event)" size="small">
      <bmb-icon icon="edit" [size]="20" color="white" />
    </button>
  </div>
</ng-template>

<ng-template #infoTemplate let-row="row">
  <div style="display: flex; align-items: center; gap: 4px">
    <bmb-badge
      [appearance]="'info'"
      [text]="row.info"
      [container]="false"
    ></bmb-badge>
  </div>
</ng-template>

<ng-template #actionTemplate>
  <div class="action-container">
    <button (click)="clickButton($event)" size="small">
      <bmb-icon [icon]="'apps'" />
    </button>
    <button (click)="clickButton($event)" size="small">
      <bmb-icon [icon]="'add'" />
    </button>
  </div>
</ng-template>

<ng-template #headerNameTemplate let-column="column" let-i="index">
  <div style="display: flex; align-items: center; gap: 4px">
    <span>{{ column.label }} Title {{ i }}</span>
    <bmb-icon icon="face" class="bmb_table-data-icon" /> {{ i }}
  </div>
</ng-template>

<ng-template #detailTemplate let-row="row">
  <!-- Caso 1: solo texto -->
  <div *ngIf="isString(row.detail)">
    {{ row.detail }}
  </div>

  <!-- Caso 2: es un objeto con tabla -->
  <bmb-table
    *ngIf="isObject(row.detail)"
    [data]="row.detail.data"
    [columns]="row.detail.columns"
    [config]="row.detail.config"
    [truncate]="false"
    [wrap]="false"
  ></bmb-table>
</ng-template>
