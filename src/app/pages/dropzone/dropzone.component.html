<form
  [formGroup]="userForm"
  (ngSubmit)="onSubmit()"
  style="
    display: flex;
    flex-direction: column;
    margin: var(--bmb-spacing-xxl);
    padding: var(--bmb-spacing-xxl);
    gap: var(--bmb-spacing-xxl);
  "
>
  <bmb-dropzone
    [acceptedExtensions]="['image/*']"
    [fileSize]="1"
    [multiple]="true"
    (newFile)="onNewFile($event)"
    [progress]="progressFiles()"
    linkLabel="Ver más información de formatos de archivo aceptados."
    linkFilesSupported="https://www.youtube.com/"
  />
  <button bmbButton type="submit" appearance="primary">Submit</button>
</form>
<div style="margin: 0 120px">
  <bmb-filter-card
    [modalTitle]="'Opciones Filtrado'"
    [primaryBtnLabel]="'Aplicar Filtros'"
    [secondaryBtnLabel]="'Limpiar Filtros'"
    [icon]="'tune'"
    [controlTypes]="filterControls"
    [inLine]="true"
    [showGlobalSearch]="true"
    [showDropdown]="false"
    [dropdownOptions]="['Apple', 'Banana', 'Orange', 'Pear', 'Grape']"
    [placeholderSearch]="'Search'"
    (applyFilters)="handleFilters($event)"
    (resetFilters)="handleResetFilters()"
  />
</div>
