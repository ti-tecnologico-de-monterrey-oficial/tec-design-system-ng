<main>
  <h1>Informative</h1>

  <section>
    <bmb-card type="normal" borderRadius="l" margin="none">
      <bmb-card-content padding="l">
        <div
          bmbLayout
          margin="none"
          gapSize="xl"
          alignItems="stretch"
          [flow]="{ m: 'row', l: 'reverse', xl: 'reverse' }"
        >
          <bmb-image
            bmbLayoutItem
            [colSm]="4"
            [colLg]="5"
            [colXl]="5"
            [src]="informativeImage"
            alt="Edificio de Rectoría del Tecnológico de Monterrey"
            ratio="16 / 9"
            borderRadius="m"
            objectFit="cover"
            [minHeight]="{ s: '14rem', l: '18rem' }"
          />

          <div bmbLayoutItem [colSm]="4" [colLg]="7" [colXl]="7">
            <div
              bmbVerticalLayout
              margin="none"
              gapSize="m"
              justify="spaceBetween"
              alignItems="stretch"
              layoutHeight="100%"
            >
              <div bmbVerticalLayoutItem>
                <div
                  bmbLayout
                  margin="none"
                  gapSize="s"
                  alignItems="center"
                  [avoidRowWrap]="true"
                >
                  <bmb-tooltip
                    bmbLayoutItem
                    icon="info"
                    text="Additional information"
                    componentTitle="Information"
                    [size]="20"
                  />
                  <bmb-badge
                    bmbLayoutItem
                    text="Badge"
                    appearance="creative-violet"
                  />
                </div>
              </div>

              <bmb-title
                bmbVerticalLayoutItem
                componentTitle="Title"
                titleSize="10"
                titleFontWeight="700"
                subtitle="Complementary text"
                subtitleSize="6"
                subtitleFontWeight="400"
              />

              <hr bmbVerticalLayoutItem />

              <p bmbVerticalLayoutItem>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit, Lorem
                ipsum dolor sit amet, consectetur adipiscing elit. Fusce
                volutpat rhoncus leo vel pharetra. Donec feugiat enim pharetra
                ipsum euismod, sed maximus justo pharetra.
              </p>

              <div bmbVerticalLayoutItem>
                <div
                  bmbLayout
                  margin="none"
                  gapSize="l"
                  alignItems="center"
                >
                  <div
                    bmbLayoutItem
                    [colSm]="4"
                    [colLg]="2"
                    [colXl]="2"
                  >
                    <button
                      bmbButton
                      appearance="secondary-outlined"
                      size="large"
                      (click)="handleButtonClick($event)"
                    >
                      Button
                    </button>
                  </div>
                  <div
                    bmbLayoutItem
                    [colSm]="4"
                    [colLg]="4"
                    [colXl]="4"
                  >
                    <button
                      bmbButton
                      appearance="secondary-outlined"
                      size="large"
                      (click)="handleButtonClick($event)"
                    >
                      Secondary button
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </bmb-card-content>
    </bmb-card>
  </section>
</main>
