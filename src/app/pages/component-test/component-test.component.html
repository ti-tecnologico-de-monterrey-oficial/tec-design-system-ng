<bmb-theme initialTheme="light" />
<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <bmb-datepicker
    inputId="date_picker_id"
    name="date_picker"
    label="Date"
    [isRequired]="true"
    [control]="getFormControl('date_picker')"
  />
  <bmb-checkbox
    inputId="checkbox_id"
    name="checkbox"
    label="Checkbox"
    [control]="getFormControl('checkbox')"
    [required]="true"
    (change)="handleCheckboxChange($event)"
  />
  <bmb-date-range
    inputId="date_range_id"
    name="date_range"
    label="Date range"
    labelStartDate="Date range start"
    labelEndDate="Date range end"
    [isRequired]="true"
    [controlStart]="getFormControl('date_range_start')"
    [controlEnd]="getFormControl('date_range_end')"
  />
  <bmb-radial
    inputId="radial_id1"
    name="radial_group"
    label="Radial A"
    value="A"
    [control]="getFormControl('radial_group')"
    (change)="handleRadial($event)"
  />
  <bmb-radial
    inputId="radial_id2"
    name="radial_group"
    label="Radial B"
    value="B"
    [required]="true"
    [control]="getFormControl('radial_group')"
    (change)="handleRadial($event)"
  />
  <bmb-input
    inputId="input_field_id"
    name="input_field"
    label="Input"
    tooltip="Tooltip example"
    tooltipTitle="Tooltip title example"
    icon="apps"
    placeholder="Placeholder"
    helperMessage="Helper Message"
    [isRequired]="true"
    [maxlength]="20"
    [minlength]="4"
    pattern="[A-Za-z]+"
    [control]="getFormControl('input_field')"
  />
  <bmb-switch
    [leftText]="'Light'"
    [leftIcon]="''"
    [rightText]="'Dark'"
    [rightIcon]="''"
    [isChecked]="false"
    [ariaLabel]="'Describe the button function here'"
    [id]="'test'"
    [disabled]="false"
    [name]="'name'"
  ></bmb-switch>
  <button bmbButton appearance="primary" type="submit">Submit</button>
</form>
FormGroup state: {{ userForm.status }}

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <bmb-dropzone
    name="dropzone"
    [acceptedExtensions]="['png', 'jpeg', 'jpg']"
    [dropInstruction]="'Arrastra tus archivos aquí o'"
    [dropLabel]="'selecciona tus archivos'"
    [errorMessage]="'Archivo no compatible'"
    [fileSize]="2"
    [formatFilesLabel]="'Ver más información de formatos de archivo aceptados.'"
    [linkFilesSupported]="''"
    [linkLabel]="'Ver más información de formatos de archivo aceptados.'"
    [mainIcon]="'image'"
    [multiple]="true"
    [name]="'bmbFileInput'"
    [progress]="progress()"
    (fileRemoved)="removeFileFromForm($event)"
    (newFile)="onFileReceived($event)"
  ></bmb-dropzone>

  <button type="submit" bmbButton [disabled]="form.invalid">
    Enviar archivo
  </button>
</form>
{{ printLog() }}
