<header class="bmb_template-header">
  <h3>Home</h3>
  <h5>Welcome to BambooPress</h5>
</header>
<div
  class="bmb_template-margin-for-sidebar"
  style="height: calc(100dvh - 212px); overflow: auto"
>
  <bmb-calendar
    [calendarTimezone]="'America/Mexico_City'"
    [clientTimezone]="'America/Mexico_City'"
    [(filters)]="calendarFilters"
    dateFormat="iso"
    [showFilterButton]="true"
  ></bmb-calendar>
</div>
