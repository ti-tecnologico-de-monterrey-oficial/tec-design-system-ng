<div bmbLayout>
  <section bmbLayoutItem [colSm]="2">
    <bmb-dropdown [options]="options()" [isFilterable]="true" />
  </section>
  <ul bmbLayoutItem [colSm]="4">
    @for (item of options(); track $index) {
      <li>{{ item }}</li>
    }
  </ul>
</div>
