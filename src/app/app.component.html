<bmb-table
  [data]="newData()"
  [columns]="newColumns()"
  [config]="{ isSelectable: true, isPaginable: true, showActions: true }"
  [pageSize]="5"
  [initialTableSelection]="selectedRows"
  (select)="onRowSelect($event)"
></bmb-table>

<button bmbButton appearance="primary" size="small" (click)="changeColumns()">
  Cambiar columnas
</button>
