<bmb-table
  [data]="tableData"
  [columns]="columnDefinition"
  [config]="{ isSelectable: true }"
  [initialTableSelection]="selectedRows"
></bmb-table>
<form bmbLayout (ngSubmit)="handleSubmitForm($event)" [formGroup]="testForm">
  <section bmbLayoutItem [colLg]="4">
    <bmb-input
      [label]="'Input Label'"
      [placeholder]="'Placeholder'"
      [icon]="'apps'"
      [appearance]="'normal'"
      [errorMessage]="{
        required: 'This field is required.',
        jsonFormat: 'El contenido no es un JSON válido.',
        minLength: 'Minimum 4 characters.',
        pattern: 'Only accepts letters.',
      }"
      [helperMessage]="'Helper Message'"
      [disabled]="false"
      [isRequired]="true"
      [spellcheck]="false"
      [maxlength]="20"
      [minlength]="4"
      [pattern]="'[A-Za-z]+'"
      [tooltip]="'Tooltip example for the input'"
      [tooltipPosition]="{ align: 'above', justify: 'before' }"
      [isClearable]="false"
      [showError]="false"
      [control]="getFormControl('simpleInput')"
    ></bmb-input>
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-input
      [label]="'Input Label'"
      [type]="'password'"
      [placeholder]="'Placeholder'"
      [icon]="'apps'"
      [appearance]="'normal'"
      [helperMessage]="'Helper Message'"
      [disabled]="false"
      [isRequired]="true"
      [spellcheck]="false"
      [pattern]="'[A-Za-z]+'"
      [tooltip]="'Tooltip example for the input'"
      [isClearable]="false"
      [showError]="false"
      [control]="getFormControl('passwordInput')"
    ></bmb-input>
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-input
      [label]="'Input Label'"
      [type]="'number'"
      [placeholder]="'Placeholder'"
      [icon]="'apps'"
      [appearance]="'normal'"
      [helperMessage]="'Helper Message'"
      [disabled]="false"
      [isRequired]="true"
      [spellcheck]="false"
      [tooltip]="'Tooltip example for the input'"
      [isClearable]="false"
      [showError]="false"
      [control]="getFormControl('numberInput')"
    ></bmb-input>
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-input
      [label]="'Input Label'"
      [type]="'text-area'"
      [placeholder]="'Placeholder'"
      [icon]="'apps'"
      [appearance]="'normal'"
      [helperMessage]="'Helper Message'"
      [disabled]="false"
      [isRequired]="true"
      [spellcheck]="false"
      [tooltip]="'Tooltip example for the input'"
      [isClearable]="false"
      [showError]="false"
      [maxlength]="20"
      [control]="getFormControl('textAreaInput')"
    ></bmb-input>
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-dropdown
      [isMultiSelect]="false"
      icon="bolt"
      placeholder="Set Fruit"
      [required]="false"
      label="Fruit"
      [showIcon]="true"
      [options]="options"
      [disabled]="false"
      helperText="Select a fruit"
      [control]="getFormControl('dropdown')"
    />
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-datepicker
      placeholder="Selecciona la fecha de cumpleaños"
      name="datePicker"
      dateFormat="MM/dd/yyyy"
      label="Fecha de tu cumpleaños"
      [disabled]="false"
      icon="cake"
      [isRequired]="true"
      [isClearable]="true"
      invalidFormaterrorMessage="El formato debe ser el siguiente: dd/mm/yyyy"
      requiredFieldErrorMessage="Este campo es requerido"
      [control]="getFormControl('datepicker')"
    />
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-date-range
      placeholder="Selecciona la fecha de cumpleaños"
      name="datePicker"
      dateFormat="MM/dd/yyyy"
      label="Fecha de tu cumpleaños"
      [disabled]="false"
      icon="cake"
      [isRequired]="true"
      [isClearable]="true"
      invalidFormaterrorMessage="El formato debe ser el siguiente: dd/mm/yyyy"
      requiredFieldErrorMessage="Este campo es requerido"
      [controlStart]="getFormControl('controlStart')"
      [controlEnd]="getFormControl('controlEnd')"
    />
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-dropdown
      [isMultiSelect]="true"
      icon="bolt"
      placeholder="Set Fruit"
      [required]="false"
      label="Fruit"
      [showIcon]="true"
      [options]="options"
      [disabled]="false"
      helperText="Select a fruit"
      [control]="getFormControl('multiSelectDropdown')"
    />
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-input-phone-number
      [control]="getFormControl('phoneNumberInput')"
      [isRequired]="true"
      [showError]="showErrors['phone']"
      [errorMessage]="'Error Phone'"
      [preferredCountries]="['mx', 'us']"
      [onlyCountries]="['mx', 'us', 'ca']"
      [useOnlyCountries]="true"
      label="Phone Number"
    />
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-input-tags
      errorMessage="Error Message"
      helperMessage="Helper Message"
      [isRequired]="false"
      placeholder="Placeholder"
      [disabled]="false"
      label="Input Label"
      [showError]="false"
      [tagOptions]="tagsOptions"
      tooltip="tooltip del input tag"
      [control]="getFormControl('inputTags')"
    />
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-checkbox
      [id]="'checkbox1'"
      [disabled]="false"
      [required]="false"
      [value]="''"
      [name]="''"
      [label]="'Contrato profesor cátedra Biología marina CCM.pdf'"
      [labelPosition]="'before'"
      [ariaDescribedby]="''"
      [ariaLabel]="''"
      [ariaLabelledby]="''"
      [checked]="false"
      [indeterminate]="false"
      [control]="getFormControl('checkbox1')"
    />
  </section>
  <section bmbLayoutItem [colLg]="4">
    <bmb-radial
      [value]="'1'"
      [label]="'Contract for teacher CCM 1.pdf'"
      [control]="getFormControl('radio')"
      [errorMessage]="'errr'"
    ></bmb-radial>
    <bmb-radial
      [value]="'2'"
      [label]="'Contract for teacher CCM 2.pdf'"
      [control]="getFormControl('radio')"
      [errorMessage]="'errr'"
    ></bmb-radial>
    <bmb-radial
      [value]="'3'"
      [label]="'Contract for teacher CCM 3.pdf'"
      [control]="getFormControl('radio')"
      [errorMessage]="'errr'"
    ></bmb-radial>
  </section>
  <section bmbLayoutItem [colLg]="4">
    <button type="button" (click)="clearButton()">Clear</button>
    <button type="submit">submit</button>
  </section>
</form>
{{ testForm.getRawValue() | json }}
{{ testForm.status | json }}
{{ testForm.errors | json }}
