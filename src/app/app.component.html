  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <bmb-input
      id="text1"
      name="name"
      placeholder="Placeholder"
      icon="apps"
      errorMessage="Error message"
      helperMessage="Helper Message"
      [disabled]="false"
      [isRequired]="true"
      appearance="normal"
      [control]="getFormControl('name')"
    />
    <bmb-input
      id="text2"
      name="named"
      label="Input Label"
      placeholder="Placeholder"
      icon="apps"
      errorMessage="Error message"
      helperMessage="Helper Message"
      [disabled]="true"
      [isRequired]="false"
      appearance="normal"
      value="abc"
      [control]="getFormControl('named')"
    />
    <bmb-input
      id="text3"
      name="otherName"
      label="Input Label"
      placeholder="Placeholder"
      icon="apps"
      errorMessage="Error message"
      helperMessage="Helper Message"
      [disabled]="false"
      [isRequired]="true"
      appearance="simple"
      [control]="getFormControl('otherName')"
    />
