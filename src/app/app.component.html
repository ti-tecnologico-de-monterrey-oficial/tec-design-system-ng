<section style="margin: 1rem">
  <bmb-form-validation (formGroupState)="handleFormGroupState($event)">
    <bmb-input
      id="textarea1"
      name="textarea1"
      type="text-area"
      [placeholder]="'Placeholder'"
      [errorMessage]="{
        required: 'This field is required.',
        minLength: 'Minimum 4 characters.',
        pattern: 'Only accepts letters.',
      }"
      [helperMessage]="'Helper Message'"
      [disabled]="false"
      [isRequired]="true"
      [maxlength]="20"
      [minlength]="4"
      [pattern]="'[A-Za-z]+'"
      [showMaxTextLength]="false"
    />
    <bmb-input
      id="textarea1"
      name="textarea1"
      type="text-area"
      tooltip="Tooltip textarea"
      [placeholder]="'Placeholder'"
      [errorMessage]="{
        required: 'This field is required.',
        minLength: 'Minimum 4 characters.',
        pattern: 'Only accepts letters.',
      }"
      [helperMessage]="'Helper Message'"
      [disabled]="false"
      [isRequired]="true"
      [maxlength]="20"
      [minlength]="4"
      [pattern]="'[A-Za-z]+'"
      [showMaxTextLength]="false"
    />
    <bmb-input
      id="textarea1"
      name="textarea1"
      type="text-area"
      label="Label textarea"
      [placeholder]="'Placeholder'"
      [errorMessage]="{
        required: 'This field is required.',
        minLength: 'Minimum 4 characters.',
        pattern: 'Only accepts letters.',
      }"

      [isRequired]="true"
      [maxlength]="20"
      [minlength]="4"
      [pattern]="'[A-Za-z]+'"

      [isRequired]="true"
      [maxlength]="100"
      [minlength]="4"
      [pattern]="'[A-Za-z]+'"
      [isClearable]="true"

      [placeholder]="'Placeholder'"
      [icon]="'apps'"
      [appearance]="'normal'"

      [additionalAction]="'showHide'"

        minLength: 'Minimum 4 characters.',
        pattern: 'Only accepts letters.',
      }"
      [helperMessage]="'Helper Message'"
      [disabled]="false"

      [minlength]="5"

      [label]="'inputn1'"

      [icon]="'apps'"

        pattern: 'Only accepts numbers.',
      }"
      [helperMessage]="'Helper Message'"
      [disabled]="false"
      [isRequired]="true"
      [pattern]="'[0-9]+'"

    <bmb-input
      id="inputn2"
      name="inputn2"
      type="number"
      [label]="'inputn2'"
      [placeholder]="'Placeholder - simple'"
      [appearance]="'simple'"
      [errorMessage]="{
        required: 'This field -simple- is required.',
        pattern: 'Only accepts numbers -simple-.',
      }"
      [helperMessage]="'Helper Message'"
      [disabled]="false"
      [isRequired]="true"
      [pattern]="'[0-9]+'"
    />

      [id]="'checkbox1'"
      [checked]="false"
      [disabled]="false"
      [indeterminate]="false"
      [required]="true"
      name="checkboxCCM"
      [label]="'checkboxCCM'"

      [ariaLabel]="''"
      [ariaLabelledby]="''"

      [disabled]="false"
      [indeterminate]="true"
      [required]="true"
      name="checkboxCCB"

      [ariaLabelledby]="''"

      [ariaLabel]="''"
      [ariaLabelledby]="''"
      errorMessage="Error message Disable"
      helperMessage="Helper message Disable"
      (change)="handleCheckboxChange($event)"
    />
    <bmb-checkbox
      [id]="'checkbox4'"
      [checked]="true"
      [disabled]="false"
      [indeterminate]="false"
      [required]="false"
      name="checkbox4"

      [ariaDescribedby]="''"
      [ariaLabel]="''"
      [ariaLabelledby]="''"
      helperMessage="Helper message Disable"
      (change)="handleCheckboxChange($event)"
    />
    <bmb-radial
      id="radio1"
      value="CCM"
      name="contract"
      label="Contract for teacher CCM.pdf"
      [checked]="false"
      [required]="true"
      [disabled]="false"
      errorMessage="Error message CCM"
      helperMessage="Helper message CCM"
      labelPosition="before"
      (change)="handleRadial($event)"
    />
    <bmb-radial
      id="radio2"
      value="CCB"
      name="contract"
      label="Contrato profesor cátedra Biología CCB.pdf"
      [checked]="false"
      [required]="true"
      [disabled]="false"
      errorMessage="Error message CCB"
      helperMessage="Helper message CCB"
      (change)="handleRadial($event)"
    />
    <bmb-radial
      id="radio3"
      value="CCM2"
      name="contract2"
      label="Contract for teacher CCM2.pdf"
      [checked]="true"
      [required]="true"
      [disabled]="false"
      errorMessage="Error message CCM2"
      helperMessage="Helper message CCM2"
      labelPosition="before"
      (change)="handleRadial($event)"
    />
    <bmb-radial
      id="radio4"
      value="CCB2"
      name="contract2"
      label="Contrato profesor cátedra Biología CCB2.pdf"
      [checked]="false"
      [required]="true"
      [disabled]="false"
      errorMessage="Error message CCB2"
      helperMessage="Helper message CCB2"
      (change)="handleRadial($event)"
    />
    <button bmbButton appearance="primary" type="submit">
      Submit form - validation
    </button>
  </bmb-form-validation>
</section>
