<section style="margin: 1rem">
  <bmb-theme name="theme" />
  <bmb-divider />
  <bmb-form-validation (formGroupState)="onSubmitVal($event)">
    <bmb-date-range
      placeholder="Selecciona la fecha de cumpleaños"
      name="datePicker"
      dateFormat="MM/dd/yyyy"
      label="Fecha de tu cumpleaños"
      [disabled]="false"
      icon="cake"
      [isRequired]="true"
      [isClearable]="true"
      invalidFormaterrorMessage="El formato debe ser el siguiente: dd/mm/yyyy"
      requiredFieldErrorMessage="Este campo es requerido"
    />
    <bmb-datepicker
      placeholder="Selecciona la fecha de cumpleaños"
      name="datePicker"
      dateFormat="MM/dd/yyyy"
      label="Fecha de tu cumpleaños"
      [disabled]="false"
      icon="cake"
      [isRequired]="true"
      [isClearable]="true"
      invalidFormaterrorMessage="El formato debe ser el siguiente: dd/mm/yyyy"
      requiredFieldErrorMessage="Este campo es requerido"
    />
    <bmb-dropdown
      [required]="true"
      [showIcon]="true"
      [placeholder]="'Set Fruit'"
      [icon]="'bolt'"
      [options]="['Apple', 'Banana', 'Orange', 'Pear', 'Grape']"
      [label]="'Fruit'"
      [type]="'default'"
      (onValueChange)="onValueChange($event)"
    />
    <bmb-totp
      instanceId="first"
      [maxCode]="6"
      (handleSubmit)="verifyCode($event, 'first')"
      [codeError]="errors['first'] ? errors['first'].codeError : false"
      [errorMessage]="errors['first'] ? errors['first'].errorMessage : ''"
      [showButton]="true"
      buttonText="Verify"
      helperText="Helper text"
    />
    <bmb-totp
      instanceId="second"
      [maxCode]="4"
      (handleSubmit)="verifyCode($event, 'second')"
      [codeError]="errors['second'] ? errors['second'].codeError : false"
      [errorMessage]="errors['second'] ? errors['second'].errorMessage : ''"
    />
    <bmb-input-phone-number
      appearance="normal"
      [name]="'phone'"
      label="Phone"
      [disabled]="false"
      [isRequired]="true"
      [errorMessage]="'Error phone'"
      [helperMessage]="'Helper message phone'"
    />
    <bmb-input-phone-number
      appearance="normal"
      [name]="'phone2'"
      label="Phone 2"
      [disabled]="true"
      [isRequired]="false"
      [errorMessage]="'Error phone'"
      [helperMessage]="'Helper message phone'"
    />
    <bmb-input-phone-number
      appearance="simple"
      [name]="'phone3'"
      label="Phone 3"
      [disabled]="false"
      [isRequired]="true"
      [errorMessage]="'Error phone'"
      [helperMessage]="'Helper message phone'"
    />
    <bmb-input-validation
      type="number"
      name="amount"
      [max]="8"
      [min]="0"
      pattern="\d*"
      errorMessage="Error message for number"
      [isRequired]="true"
    />
    <bmb-input-validation
      name="name"
      label="Input Label"
      placeholder="Placeholder"
      icon="apps"
      errorMessage="Error message"
      helperMessage="Helper Message"
      [disabled]="false"
      [isRequired]="true"
      appearance="normal"
    />
    <bmb-input-validation
      name="named"
      label="Input Label"
      placeholder="Placeholder"
      icon="apps"
      errorMessage="Error message"
      helperMessage="Helper Message"
      [disabled]="true"
      [isRequired]="false"
      appearance="normal"
      value="abc"
    />
    <bmb-input-validation
      name="otherName"
      label="Input Label"
      placeholder="Placeholder"
      icon="apps"
      errorMessage="Error message"
      helperMessage="Helper Message"
      [disabled]="false"
      [isRequired]="true"
      appearance="simple"
    />
    <bmb-input-validation
      name="comments"
      label="Label textarea"
      type="text-area"
      tooltip="Tooltip text"
      placeholder="Place holder text"
      icon="apps"
      errorMessage="Error message textarea"
      helperMessage="Helper message textarea"
      appearance="normal"
      [disabled]="false"
      [isRequired]="true"
      [showMaxTextLength]="true"
      [maxlength]="20"
    />
    <bmb-radial
      id="radio1"
      value="CCM"
      name="contract"
      label="Contract for teacher CCM.pdf"
      [checked]="false"
      [required]="true"
      [disabled]="false"
      errorMessage="Error message"
      helperMessage="Helper message"
      labelPosition="before"
      (change)="handleRadial($event)"
    />
    <bmb-radial
      id="radio2"
      value="CCB"
      name="contract"
      label="Contrato profesor cátedra Biología CCB.pdf"
      [checked]="false"
      [required]="true"
      [disabled]="false"
      errorMessage="Error message"
      helperMessage="Helper message"
      (change)="handleRadial($event)"
    />
    <bmb-checkbox
      id="checkbox1"
      name="checkbox1"
      [checked]="true"
      [disabled]="false"
      [indeterminate]="false"
      [required]="true"
      label="Contrato profesor cátedra Biología marina CCM.pdf"
      labelPosition="before"
      ariaDescribedby=""
      ariaLabel=""
      ariaLabelledby=""
      errorMessage="Error message"
      helperMessage="Helper Message"
      (change)="handleCheckboxChange($event)"
    />
    <button bmbButton size="large" appearance="primary" type="submit">
      Submit
    </button>
  </bmb-form-validation>
  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <bmb-input
      id="text1"
      name="name"
      placeholder="Placeholder"
      icon="apps"
      errorMessage="Error message"
      helperMessage="Helper Message"
      [disabled]="false"
      [isRequired]="true"
      appearance="normal"
      [control]="getFormControl('name')"
    />
    <bmb-radial
      id="radio1"
      value="CCM"
      name="contract"
      label="Contract for teacher CCM.pdf"
      [checked]="false"
      [required]="true"
      [disabled]="false"
      errorMessage="Error message"
      helperMessage="Helper message"
      labelPosition="before"
      (change)="handleRadial($event)"
      [control]="getFormControl('contract')"
    />
    <bmb-radial
      id="radio2"
      value="CCB"
      name="contract"
      label="Contrato profesor cátedra Biología CCB.pdf"
      [checked]="false"
      [required]="true"
      [disabled]="false"
      errorMessage="Error message"
      helperMessage="Helper message"
      labelPosition="after"
      (change)="handleRadial($event)"
      [control]="getFormControl('contract')"
    />
    <bmb-input
      id="text2"
      name="named"
      label="Input Label"
      placeholder="Placeholder"
      icon="apps"
      errorMessage="Error message"
      helperMessage="Helper Message"
      [disabled]="true"
      [isRequired]="false"
      appearance="normal"
      value="abc"
      [control]="getFormControl('named')"
    />
    <bmb-input
      id="text3"
      name="otherName"
      label="Input Label"
      placeholder="Placeholder"
      icon="apps"
      errorMessage="Error message"
      helperMessage="Helper Message"
      [disabled]="false"
      [isRequired]="true"
      appearance="simple"
      [control]="getFormControl('otherName')"
    />
    <bmb-input
      id="textarea4"
      name="comments"
      label="Label textarea"
      type="text-area"
      tooltip="Tooltip text"
      placeholder="Place holder text"
      icon="apps"
      errorMessage="Error message textarea"
      helperMessage="Helper message textarea"
      appearance="normal"
      [disabled]="false"
      [isRequired]="true"
      [showMaxTextLength]="true"
      [maxlength]="20"
      [control]="getFormControl('comments')"
    />
    <bmb-input
      type="number"
      label="Number"
      name="amount"
      [max]="8"
      [min]="0"
      pattern="\d*"
      errorMessage="Error message for number"
      [helperMessage]="'Helper message for number'"
      [isRequired]="true"
      [control]="getFormControl('amount')"
    />
    <bmb-input-phone-number
      appearance="normal"
      [name]="'phone'"
      label="Phone"
      [disabled]="false"
      [isRequired]="true"
      [errorMessage]="'Error phone'"
      [helperMessage]="'Helper message phone'"
      [control]="getFormControl('phone')"
    />
    <bmb-input-phone-number
      appearance="normal"
      [name]="'phone2'"
      label="Phone 2"
      value="+525555555555"
      [disabled]="true"
      [isRequired]="false"
      [errorMessage]="'Error phone'"
      [helperMessage]="'Helper message phone'"
      [control]="getFormControl('phone2')"
    />
    <bmb-input-phone-number
      appearance="Simple"
      [name]="'phone3'"
      label="Phone 3"
      [disabled]="false"
      [isRequired]="true"
      [errorMessage]="'Error phone'"
      [helperMessage]="'Helper message phone'"
      [control]="getFormControl('phone3')"
    />
    <bmb-checkbox
      [id]="'checkbox1'"
      name="checkbox1"
      [checked]="true"
      [disabled]="false"
      [indeterminate]="false"
      [required]="true"
      [label]="'Contrato profesor cátedra Biología marina CCM.pdf'"
      [labelPosition]="'after'"
      [ariaDescribedby]="''"
      [ariaLabel]="''"
      [ariaLabelledby]="''"
      errorMessage="Error message"
      helperMessage="Helper Message"
      (change)="handleCheckboxChange($event)"
      [control]="getFormControl('checkbox1')"
    />
    <bmb-checkbox
      [id]="'checkbox2'"
      name="checkbox2"
      [checked]="false"
      [disabled]="false"
      [indeterminate]="true"
      [required]="true"
      [label]="'Contrato profesor cátedra Biología marina CCM.pdf'"
      [labelPosition]="'before'"
      [ariaDescribedby]="''"
      [ariaLabel]="''"
      [ariaLabelledby]="''"
      errorMessage="Error message"
      helperMessage="Helper Message"
      (change)="handleCheckboxChange($event)"
      [control]="getFormControl('checkbox2')"
    />
    <bmb-switch
      name="switch1"
      [leftText]="'Light'"
      [rightText]="'Dark'"
      [isChecked]="false"
      [ariaLabel]="'Describe the button function here'"
      [id]="'1'"
      [disabled]="false"
      [control]="getFormControl('switch1')"
    />
    <bmb-switch
      name="switch2"
      [isChecked]="false"
      leftIcon="light_mode"
      rightIcon="dark_mode"
      [ariaLabel]="'Describe the button function here'"
      [id]="'2'"
      [disabled]="false"
      [control]="getFormControl('switch2')"
    />
    <button bmbButton appearance="primary" type="submit">Submit</button>
  </form>
  <bmb-input-validation name="test" />
  <bmb-checkbox
    [id]="'checkbox1'"
    name="checkbox1"
    [checked]="true"
    [disabled]="false"
    [indeterminate]="false"
    [required]="true"
    [label]="'Contrato profesor cátedra Biología marina CCM.pdf'"
    [labelPosition]="'after'"
    [ariaDescribedby]="''"
    [ariaLabel]="''"
    [ariaLabelledby]="''"
    errorMessage="Error message"
    helperMessage="Helper Message"
    (change)="handleCheckboxChange($event)"
    [control]="getFormControl('checkbox1')"
  />
</section>
