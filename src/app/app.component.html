<bmb-theme />
<bmb-input
  id="text1"
  type="text"
  name="text1"
  label="Input Label"
  placeholder="Placeholder"
  icon="apps"
  errorMessage="Error message"
  helperMessage="Helper Message"
  [disabled]="false"
  [isRequired]="true"
  appearance="normal"
  additionalAction="copy"
/>
<bmb-input
  id="text2"
  type="password"
  name="text2"
  label="Input Label"
  placeholder="Placeholder"
  icon="apps"
  errorMessage="Error message"
  helperMessage="Helper Message"
  [disabled]="false"
  [isRequired]="true"
  appearance="normal"
  additionalAction="showHide"
/>
<bmb-input
  id="text3"
  type="text"
  name="text3"
  label="Input Label - val"
  placeholder="Placeholder"
  icon="apps"
  [errorMessage]="{
    required: 'Is required.',
    minLength: 'Min is 4 characters.',
    pattern: 'Just letters.',

  [disabled]="false"
  [isRequired]="true"
  appearance="normal"

  [minlength]="4"
  [maxlength]="20"

/>
<bmb-input
  id="number1"

/>
<bmb-input
  id="number1"
  type="number"
  name="number1"
  label="Number"
  placeholder="Placeholder"
  icon="apps"

    required: 'Is required.',
    min: 'Min is 2.',
