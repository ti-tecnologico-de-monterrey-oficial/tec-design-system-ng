@for (action of visibleActions(); track action.action) {
  <bmb-action-icon
    role="button"
    [attr.tabindex]="
      action.action === 'copy' && copyState() !== 'idle' ? -1 : 0
    "
    class="bmb_ai-chat-bubble-icon"
    [icon]="getActionIcon(action)"
    [iconSize]="24"
    [tooltipText]="action.label | translate"
    [attr.aria-label]="action.label | translate"
    [attr.aria-disabled]="action.action === 'copy' && copyState() !== 'idle'"
    [ngClass]="{
      'bmb_ai-chat-bubble-icon-active': action.active,
      'is-disabled': action.action === 'copy' && copyState() !== 'idle',
      'is-copy-result':
        action.action === 'copy' &&
        (copyState() === 'success' || copyState() === 'error'),
    }"
    (buttonClick)="triggerAction(action.action, $event)"
    (keydown.enter)="triggerAction(action.action, $event)"
    (keydown.space)="triggerAction(action.action, $event)"
  />
}
