<section
  class="bmb_item-informative-text"
  bmbLayout
  margin="none"
  alignItems="center"
  gapSize="s"
>
  @if (icon()) {
    <bmb-icon
      [icon]="icon()"
      [size]="24"
      alt="Item icon"
      bmbLayoutItem
      [isDynamicItem]="true"
    />
  }
  <section bmbLayoutItem [isDynamicItem]="true" [colGrow]="1">
    <section bmbVerticalLayout gapSize="xs">
      @if (itemTitle()) {
        <span bmbVerticalLayoutItem>
          {{ itemTitle() }}
        </span>
      }
      @if (supportText() || (supportTextLinkLabel() && supportTextLink())) {
        <span bmbVerticalLayoutItem>
          {{ supportText() }}
          <bmb-text-link
            [textLink]="supportTextLinkLabel()!"
            icon=""
            [link]="supportTextLink()!"
            [target]="supportTextTarget()"
          />
        </span>
      }
    </section>
  </section>
</section>
