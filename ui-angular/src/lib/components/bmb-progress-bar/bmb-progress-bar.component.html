<ng-template #progressBar>
  <section
    class="bmb_progress-bar-wrapper"
    bmbLayoutItem
    bmbVerticalLayout
    gapSize="s"
  >
    @if (type() === 'container') {
      <bmb-value-counter
        [ngClass]="
          appearance() !== 'info' ? 'bmb_progress-bar-' + appearance() : ''
        "
        [label]="componentTitle() || title()"
        [value]="totalCount().toString()"
        [progress]="counter().toString()"
        [textFormat]="textFormat()"
        [textFormatSeparator]="textFormatSeparator()"
        bmbVerticalLayoutItem
      />
    }
    @if (appearance() !== 'error') {
      <section
        class="bmb_progress-bar-wrapper-bar"
        bmbVerticalLayoutItem
        bmbLayout
        [dynamicCols]="true"
        margin="none"
        gapSize="s"
        alignItems="center"
        justify="spaceBetween"
      >
        <div class="bmb_progress-bar-track" bmbLayoutItem>
          <div
            class="bmb_progress-bar-active"
            [ngClass]="progressBarColorClass()"
            [style.width.%]="progressValue()"
          ></div>
        </div>
        @if (type() !== 'simple') {
          @if (type() === 'counter') {
            <bmb-value-counter
              class="bmb_progress-bar-counter-text"
              [value]="totalCount().toString()"
              [progress]="counter().toString()"
              [textFormat]="textFormat()"
              [textFormatSeparator]="textFormatSeparator()"
              bmbLayoutItem
              [isDynamicItem]="true"
              [colGrow]="1"
            />
          } @else {
            @if (!isContainer()) {
              <span class="bmb_progress-bar-counter-text" bmbLayoutItem>
                {{ progressValue() + '%' }}
              </span>
            }
          }
        }
      </section>
    }
    @if (type() === 'container' && appearance() === 'info' && textLink()) {
      <bmb-text-link
        class="bmb_progress-bar-info"
        [textLink]="textLink()"
        [target]="target()"
        [link]="href()"
        bmbVerticalLayoutItem
      />
    }
  </section>
</ng-template>
@if (isContainer()) {
  <bmb-action-container
    [avatarIcon]="type() !== 'simple' ? avatarIcon() : ''"
    [actionIcon]="actionIcon()"
    actionIdElement="progress_bar_action"
    [showStatusIcon]="showStatusIcon()"
    [isError]="appearance() === 'error'"
    (actionClick)="actionClick.emit($event)"
  >
    <ng-container [ngTemplateOutlet]="progressBar" />
  </bmb-action-container>
} @else {
  <ng-container [ngTemplateOutlet]="progressBar" />
}
