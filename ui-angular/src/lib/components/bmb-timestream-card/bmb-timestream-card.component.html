<section class="bmb-timestream-card">
  <bmb-home-card
    [icon]="icon()"
    [bgIconAppearance]="bgIconAppearance()"
    [componentTitle]="componentTitle() || title()"
    [subtitle]="subtitle()"
    [dataLocalNav]="dataLocalNav()"
    [isMobile]="isMobile"
    [actionHeaders]="actionHeaders"
    contentPadding="none"
  >
    <bmb-timestream
      [events]="filteredEvents()"
      [dateFormat]="dateFormat()"
      [clamp]="clamp"
      [lang]="lang()"
    />
  </bmb-home-card>
  <section [ngClass]="getClassList()">
    <bmb-card>
      <bmb-card-content>
        <header class="bmb-timestream-card-filters-header">
          <h2 class="bmb-timestream-card-filters-header-title">
            {{ 'timestream_card.filter_options' | translate }}
          </h2>
          <button (click)="handleCloseFilters()">
            <bmb-icon
              icon="close"
              [size]="20"
              [alt]="subtitle() || ('timestream_card.close_filters_alt' | translate)"
            />
          </button>
        </header>
        <bmb-filter-card
          [inLine]="true"
          [primaryBtnLabel]="'timestream_card.apply_filters' | translate"
          [secondaryBtnLabel]="'timestream_card.clear_filters' | translate"
          [controlTypes]="filters"
          (applyFilters)="handleFiltersChange($event)"
        />
      </bmb-card-content>
    </bmb-card>
  </section>
</section>
