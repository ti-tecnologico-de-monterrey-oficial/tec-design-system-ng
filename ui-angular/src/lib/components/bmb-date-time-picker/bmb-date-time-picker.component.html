<section class="bmb_date-time-picker">
  <div class="bmb_date-time-picker-fields">
    <bmb-datepicker
      [inputId]="inputId() + '_date'"
      [name]="name() + '_date'"
      [label]="labelDate()"
      [dateFormat]="dateFormat()"
      [placeholder]="dateFormat()"
      [(control)]="dateControl"
      [disabled]="disabled()"
      [isRequired]="isRequired()"
      [disableDatesBefore]="disableDatesBefore()"
      [disableDatesAfter]="disableDatesAfter()"
      [errorMessage]="errorMessage()"
      helperMessage=""
      (onChange)="timePicker.openList()"
      [isClearable]="isClearable()"
    />
    <bmb-timepicker
      #timePicker
      [inputId]="inputId() + '_time'"
      [name]="name() + '_time'"
      [label]="labelTime()"
      [format]="timeFormat()"
      [minuteStep]="minuteStep()"
      [(control)]="timeControl"
      [disabled]="disabled()"
      [isRequired]="isRequired()"
      [errorMessage]="errorMessage()"
      [isClearable]="isClearable()"
      (getChange)="handleTimeChange()"
    />
  </div>
</section>
