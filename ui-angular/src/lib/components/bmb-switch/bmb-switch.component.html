<bmb-input-validator
  type="checkbox"
  [inputId]="inputId()"
  [name]="name()"
  [checked]="isChecked()"
  [isDisabled]="disabled()"
  [control]="control()"
>
  <label class="bmb_switch">
    <input
      bmbControl
      class="bmb_switch-input"
      type="checkbox"
      [id]="inputId()"
      [formControl]="control()"
      [name]="name()"
      [checked]="isChecked()"
      [attr.aria-checked]="isChecked()"
      [attr.aria-label]="ariaLabel() || ('switch.aria_label' | translate)"
      [attr.aria-disabled]="disabled().toString()"
      [tabindex]="disabled() ? -1 : 0"
      (change)="handleChange($event)"
      (keydown)="handleKeyDown($event)"
    />
    <span class="bmb_switch-pill">
      <span class="bmb_switch-bullet"></span>
    </span>
  </label>
</bmb-input-validator>
