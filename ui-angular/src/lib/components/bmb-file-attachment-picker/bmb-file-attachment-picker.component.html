<div
  class="bmb_file-attachment-picker"
  [class.bmb_file-attachment-picker-active]="files().length > 0"
>
  @for (file of files(); track $index) {
    <bmb-action-container
      class="bmb_file-attachment-picker-option"
      avatarIcon="attach_file"
      actionIcon="close"
      [actionIdElement]="'file_attachment_picker_delete_' + $index"
      [actionTooltipText]="'chat_bar.close' | translate"
      (actionClick)="deleteFile($index)"
    >
      <span
        class="bmb_file-attachment-picker-option-text"
        bmbLayoutItem
        [isDynamicItem]="true"
        [colGrow]="1"
      >
        {{ file.name }}
      </span>
    </bmb-action-container>
  }
</div>
<input
  #fileInput
  multiple
  type="file"
  [attr.id]="inputId()"
  [accept]="getAcceptAttribute()"
  [attr.aria-label]="'chat_bar.add' | translate"
  (change)="onFileSelect($event)"
  hidden
/>
<ng-content />
