<div
  class="bmb_file-attachment-picker"
  [class.bmb_file-attachment-picker-active]="files().length > 0"
>
  @for (file of files(); track $index) {
    <div class="bmb_file-attachment-picker-option">
      <bmb-icon
        class="bmb_file-attachment-picker-option-icon"
        icon="attach_file"
        [size]="24"
      />
      <span class="bmb_file-attachment-picker-option-text">{{ file.name }}</span>
      <bmb-action-icon
        class="bmb_file-attachment-picker-option-delete"
        icon="close"
        [iconSize]="24"
        (buttonClick)="deleteFile($index)"
        [tooltipText]="'chat_bar.close' | translate"
      />
    </div>
  }
</div>
<input
  #fileInput
  multiple
  type="file"
  [attr.id]="inputId()"
  [accept]="getAcceptAttribute()"
  [attr.aria-label]="'chat_bar.add' | translate"
  (change)="onFileSelect($event)"
  hidden
/>
<ng-content />
