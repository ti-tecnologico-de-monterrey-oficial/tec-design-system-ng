<section
  #inputValidation
  class="bmb_input-validator"
  [ngClass]="{ disabled: control()?.disabled }"
>
  <span
    class="bmb_input-validator-wrapper"
    [ngClass]="getClasses('bmb_input-validator')"
  >
    @if (
      !!label() ||
      isRequired() ||
      !!tooltip() ||
      (type() === 'text-area' && showMaxTextLength())
    ) {
      <label class="bmb_input-validator-label" [htmlFor]="inputId()">
        {{ label() }}
        @if (isFieldRequired()) {
          <small class="bmb_input-validator-label-required">*</small>
        }
        @if (!!tooltip()) {
          <bmb-tooltip
            class="bmb_input-validator-label-tooltip"
            [text]="tooltip()"
            [icon]="'help'"
            [size]="20"
          />
        }
        @if (type() === 'text-area' && showMaxTextLength()) {
          <span class="bmb_input-validator-label-max">
            {{ control()?.value?.toString().length }}/{{ maxLength() || '-' }}
          </span>
        }
      </label>
    }
    <ng-content />
  </span>
  <bmb-input-error-message
    [inputId]="inputId()"
    [control]="control()"
    [showError]="showError()"
    [errorMessage]="errorMessage()"
    [pattern]="pattern()"
    [min]="min()"
    [max]="max()"
    [minLength]="minLength()"
    [maxLength]="maxLength()"
    [label]="label()"
    [helperMessage]="helperMessage()"
    [appearance]="appearance()"
  />
</section>
