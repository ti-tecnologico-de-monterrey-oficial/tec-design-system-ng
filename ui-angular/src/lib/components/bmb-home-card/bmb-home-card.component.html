<section class="bmb_home-card">
  <div class="bmb_home-card-wrapper">
    <bmb-home-card-header
      [componentTitle]="componentTitle() || title()"
      [subtitle]="subtitle()"
      [dataLocalNav]="dataLocalNav()"
      [leftIcon]="leftIcon()"
      [icon]="icon()"
      [iconSize]="iconSize()"
      [bgIconAppearance]="bgIconAppearance()"
      [actionHeaders]="actionHeaders()"
      [showRightButton]="showRightButton()"
      [isMobile]="isMobile()"
      [(currentBot)]="currentBot"
      [(isExpanded)]="isExpanded"
      [showOneHeaderAction]="showOneHeaderAction()"
      (onClose)="handleClose()"
      (onBack)="handleBack()"
      (onExpandClick)="handleExpand()"
    />
    <section
      class="bmb_home-card-wrapper-container"
      [ngClass]="getContentClass()"
    >
      <ng-content />
    </section>
  </div>
</section>
