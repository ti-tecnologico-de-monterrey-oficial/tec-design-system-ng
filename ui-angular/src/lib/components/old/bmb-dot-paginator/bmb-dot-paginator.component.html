<ol [ngClass]="getClasses()">
  @if (numberOfDots()) {
    <li class="bmb_dot_paginator-item">
      <bmb-action-icon
        [disabled]="activeDotIndex() === 0"
        [icon]="'chevron_left'"
        [iconSize]="24"
        (buttonClick)="prevItem()"
        [alt]="'dot_paginator.prev' | translate"
      ></bmb-action-icon>
    </li>
  }
  @for (target of targets(); track $index) {
    <li class="bmb_dot_paginator-item">
      <button
        class="dot"
        (click)="dotClick($index)"
        [ngClass]="{ active: activeDotIndex() === $index }"
        [title]="$index"
      >
        <span hidden="true"
          >{{ 'dot_paginator.go_to_slide' | translate }} {{ $index + 1 }}</span
        >
      </button>
    </li>
  }
  @if (numberOfDots()) {
    <li class="bmb_dot_paginator-item">
      <bmb-action-icon
        [disabled]="activeDotIndex() === numberOfDots() - 1"
        [icon]="'chevron_right'"
        [iconSize]="24"
        (buttonClick)="nextItem()"
        [alt]="'dot_paginator.next' | translate"
      ></bmb-action-icon>
    </li>
  }
</ol>
