<header class="bmb_home-card-header">
  <bmb-container
    class="bmb_home-card-header-wrapper"
    [ngClass]="{ left: !!leftIcon() }"
  >
    <span class="bmb_home-card-header-container">
      <bmb-three-cols [expandMainColumn]="true">
        <ng-template #bmbLeftContent>
          @if (!!leftIcon()) {
            <bmb-action-icon
              [icon]="leftIcon()!"
              [iconSize]="24"
              (buttonClick)="handleBack()"
              [tooltipText]="'home_card.back' | translate"
            />
          }
        </ng-template>
        <ng-template #bmbMainContent>
          <bmb-title-content
            [componentTitle]="componentTitle() || title()"
            [subtitle]="subtitle()"
            [icon]="getIconName()"
            [iconSize]="iconSize()!"
            [bgIconAppearance]="bgIconAppearance()"
            [dataLocalNav]="getDataLocalNav()"
            [(currentBot)]="currentBot"
          />
        </ng-template>
        <ng-template #bmbRightContent>
          <span
            class="bmb_navigation-bar"
            bmbLayout
            margin="none"
            justify="spaceBetween"
            gapSize="m"
            alignItems="center"
            [dynamicCols]="true"
          >
            @for (headerAction of headerActionsList(); track $index) {
              <bmb-action-icon
                class="bmb_navigation-bar-icon"
                bmbLayoutItem
                [isDynamicItem]="true"
                [idElement]="$index.toString()"
                [icon]="headerAction.icon"
                [alt]="headerAction.alt || headerAction.icon"
                [tooltipText]="
                  headerAction.tooltipText ||
                  headerAction.alt ||
                  headerAction.icon
                "
                [iconSize]="24"
                [toggleIconActive]="headerAction.iconActiveToggle"
                [(isToggleActive)]="headerAction.isToggleActive"
                [link]="headerAction.link"
                [target]="headerAction.target"
                (buttonClick)="handleHeaderActionClick($event, headerAction)"
              />
            }
          </span>
        </ng-template>
      </bmb-three-cols>
    </span>
  </bmb-container>
</header>
