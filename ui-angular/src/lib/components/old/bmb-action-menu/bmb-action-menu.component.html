<section class="bmb_action-menu">
  @if (showHeader()) {
    <header class="bmb_action-menu-header">
      <bmb-container class="bmb_action-menu-header-wrapper">
        <bmb-title-content
          [componentTitle]="componentTitle() || title() || ''"
          [icon]="icon()"
          [iconSize]="iconSize()!"
          [bgIconAppearance]="bgIconAppearance()"
        />
      </bmb-container>
    </header>
  }
  <section class="bmb_action-menu-list" [ngClass]="{ action: !showHeader() }">
    @for (element of menuContentList; track $index) {
      <ng-container [ngTemplateOutlet]="element" />
      @if (showHeader() && $index + 1 < menuContentList.length) {
        <bmb-divider class="bmb_item-divider" />
      }
    }
  </section>
</section>
