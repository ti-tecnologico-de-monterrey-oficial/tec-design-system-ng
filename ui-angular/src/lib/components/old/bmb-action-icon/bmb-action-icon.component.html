<bmb-tooltip-base
  [text]="tooltipText() || (isImage(getIcon()) && alt()) || getIcon()"
>
  <span class="bmb_action_icon">
    <bmb-check-external-link-button
      class="bmb_action_icon-button-link"
      [idElement]="idElement()"
      [link]="link()!"
      [target]="target()!"
      (buttonPress)="handlePress({ event: $event, name: getIcon() })"
      (buttonClick)="handleClick({ event: $event, name: getIcon() })"
      [disabled]="disabled()"
      [buttonName]="getIcon()"
    >
      <span
        class="bmb_action_icon-icon"
        [ngClass]="{
          'bmb_action_icon-icon-toggle_icon':
            toggleIconActive() && isAccentColor(),
        }"
      >
        @if (isSVGTemplate() && safeSVG) {
          <bmb-icon
            [size]="iconSize()"
            [isSVGTemplate]="true"
            [alt]="alt() || getIcon()"
          >
            <ng-template #customIcon>
              <ng-container [ngTemplateOutlet]="customActionIcon() ?? null" />
            </ng-template>
          </bmb-icon>
        } @else {
          <bmb-icon
            [icon]="getIcon()"
            [size]="iconSize()"
            [isFill]="true"
            [dotNotification]="dotNotification()"
            [alt]="alt()"
            (imageNotFoundError)="handleImageNotFoundError()"
          />
        }
      </span>
    </bmb-check-external-link-button>
  </span>
</bmb-tooltip-base>
