<section [ngClass]="getClassList()">
  <bmb-datepicker
    [label]="labelStartDate()"
    [placeholder]="placeholderStartDate()"
    [name]="name() + '_start'"
    [control]="controlStart()"
    [dateFormat]="dateFormat()"
    [disabled]="disabled()"
    [icon]="icon()"
    [isRequired]="isRequired()"
    [isClearable]="isClearable()"
    [invalidFormatErrorMessage]="invalidFormatErrorMessage()"
    [requiredFieldErrorMessage]="requiredFieldErrorMessage()"
    [disableDatesAfter]="disableDatesAfterCurrent"
    [disableDatesBefore]="disableDatesBefore()"
    helperMessage=""
    [customValidation]="customValidation()"
    [errorMessage]="errorMessage()"
  />
  @if (!multipleRow()) {
    <div class="bmb_date-range-middle-dash"></div>
  }
  <bmb-datepicker
    [label]="labelEndDate()"
    [placeholder]="placeholderEndDate()"
    [name]="name() + '_end'"
    [control]="controlEnd()"
    [dateFormat]="dateFormat()"
    [disabled]="disabled()"
    [icon]="icon()"
    [isRequired]="isRequired()"
    [isClearable]="isClearable()"
    [invalidFormatErrorMessage]="invalidFormatErrorMessage()"
    [requiredFieldErrorMessage]="requiredFieldErrorMessage()"
    [disableDatesBefore]="disableDatesBeforeCurrent"
    [disableDatesAfter]="disableDatesAfter()"
    helperMessage=""
    [customValidation]="customValidation()"
    [errorMessage]="errorMessage()"
  />
</section>
