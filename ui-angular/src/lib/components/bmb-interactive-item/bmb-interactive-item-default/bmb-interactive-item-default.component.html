<button
  type="button"
  class="bmb_interactive-item-default"
  (click)="handleActionClick($event)"
  bmbLayout
  margin="none"
  alignItems="center"
  gapSize="s"
  [dynamicCols]="true"
>
  <bmb-icon
    [icon]="icon()"
    [isFill]="true"
    [size]="24"
    alt="Profile switch menu"
    bmbLayoutItem
  />
  <bmb-title
    class="bmb_interactive-item-default-title"
    [ngClass]="{ active: isActive() }"
    [componentTitle]="itemTitle()"
    [subtitle]="subtitleKey() | translate"
    bmbLayoutItem
    [isDynamicItem]="true"
    [colGrow]="1"
  />
  <bmb-icon [icon]="trailingIcon()" [size]="24" bmbLayoutItem />
</button>
