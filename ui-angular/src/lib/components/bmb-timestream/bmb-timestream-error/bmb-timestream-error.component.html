<div class="bmb_timestream-error">
  <bmb-card type="error">
    <bmb-card-content>
      <h2 class="bmb_timestream-error-title">
        <span class="bmb_timestream-error-title-icon"
          ><bmb-icon icon="error"
        /></span>
        <span>{{ 'timestream.error' | translate }}</span>
      </h2>
      <p class="bmb_timestream-error-content">
        {{ 'timestream.invalid_date_error' | translate }}<br />
        <a
          href="https://moment.github.io/luxon/api-docs/index.html#datetimefromformat"
          target="_blank"
          >{{ 'timestream.valid_date_formats' | translate }}</a
        >
      </p>
    </bmb-card-content>
  </bmb-card>
</div>
