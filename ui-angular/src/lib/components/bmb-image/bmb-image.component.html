<section
  class="bmb_image"
  [ngClass]="['bmb_image-carousel', carouselClass()]"
  [ngStyle]="{
    width: width(),
    'aspect-ratio': ratio(),
    ...imageBackdropStyle,
  }"
>
  @if (!isCarousel()) {
    <ng-container
      *ngTemplateOutlet="
        imageTemplate;
        context: {
          img: { src: src(), mobileSrc: mobileSrc(), alt: alt() },
          index: 0,
          isCarousel: false,
        }
      "
    ></ng-container>
  } @else {
    @if (images() && images()!.length > 1) {
      <div class="bmb_image-arrow bmb_image-arrow--left">
        <bmb-button-icon
          icon="chevron_left"
          [showContainer]="true"
          (onButtonClick)="prev()"
          appearanceContrast="solid"
          [alt]="'image.previous' | translate"
        />
      </div>
      <div class="bmb_image-arrow bmb_image-arrow--right">
        <bmb-button-icon
          icon="chevron_right"
          [showContainer]="true"
          (onButtonClick)="next()"
          appearanceContrast="solid"
          [alt]="'image.next' | translate"
        />
      </div>
    }
    @for (img of images(); track $index) {
      <ng-container
        *ngTemplateOutlet="imageTemplate; context: { img: img, index: $index, isCarousel: true }"
      ></ng-container>
    }
  }
</section>

<ng-template
  #imageTemplate
  let-img="img"
  let-index="index"
  let-isCarousel="isCarousel"
>
  <figure
    [class]="
      isCarousel
        ? 'bmb_image-figure bmb_image-figure-images'
        : 'bmb_image-figure'
    "
    [ngClass]="getClasses()"
    [ngStyle]="isCarousel ? getImageStyle(index) : { 'aspect-ratio': ratio() }"
  >
    <picture>
      <source media="(min-width: 1000px)" [srcset]="encodedURL(img.src)" />
      @if (img.mobileSrc) {
        <source [srcset]="encodedURL(img.mobileSrc)" />
      }
      <img
        [src]="encodedURL(img.src)"
        [srcset]="encodedURL(img.src)"
        [alt]="img.alt || alt()"
        [loading]="loading()"
        class="bmb_image-figure-image"
        role="button"
        tabindex="0"
        (click)="handleImageClick(img, index)"
        (keydown.enter)="handleImageClick(img, index)"
        (keydown.space)="handleImageClick(img, index)"
        [style]="{
          'object-fit': objectFit(),
          cursor: enableCursorPointer() ? 'pointer' : 'default',
        }"
        (error)="handleImageNotFoundError(img.src, $event)"
      />
    </picture>
  </figure>
</ng-template>
