<section class="bmb_totp">
  <form class="bmb_totp-form" [formGroup]="codeForm" (ngSubmit)="onSubmit()">
    <bmb-container
      class="bmb_totp-container"
      [appearance]="'contrast-box-container'"
    >
      <bmb-icon class="bmb_totp-icon" icon="lock" [size]="48" />
      <h2 class="bmb_totp-title">
        {{ componentTitle() || title() || ('totp.title' | translate) }}
      </h2>
      <h3 class="bmb_totp-subtitle">
        {{ subtitle() || ('totp.subtitle' | translate) }}
      </h3>
      <section class="bmb_totp-code">
        @for (field of codesArray(); track $index) {
          <bmb-input-content
            type="number"
            class="bmb_totp-input"
            [inputId]="'code_' + instanceId() + '_' + $index"
            [name]="'name_' + instanceId() + '_' + $index"
            [maxLength]="1"
            [isError]="codeError()"
            [control]="getFormControl('name_' + instanceId() + '_' + $index)"
            (onKeyUp)="handleKeyUp($event, $index)"
          />
          <span class="bmb_totp-circle"></span>
        }
      </section>
      @if (codeError()) {
        <p class="bmb_totp-error">{{ errorMessage() }}</p>
      }
      @if (showButton()) {
        <button
          class="bmb_totp-button"
          bmbButton
          type="submit"
          [disabled]="disableButton()"
        >
          {{ buttonText() }}
        </button>
      }
      @if (showButton() && helperText()) {
        <p class="bmb_totp-helper">
          {{ helperText() }}
        </p>
      }
    </bmb-container>
  </form>
</section>
