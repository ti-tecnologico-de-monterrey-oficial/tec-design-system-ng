<section class="bmb_login-onboarding-logout">
  <section class="bmb_login-onboarding-logout-content">
    <h1 class="bmb_login-onboarding-logout-content-title">
      {{ 'login_onboarding.registration_complete_title' | translate }}
    </h1>
    <img
      class="bmb_login-onboarding-logout-content-img"
      [alt]="'login_onboarding.check_circle_alt' | translate"
      [src]="checkCircleImage"
    />
  </section>
  <section>
    <button
      type="button"
      bmbButton
      size="large"
      (click)="_handleContinuePage()"
    >
      {{ 'login_onboarding.finish' | translate }}
    </button>
  </section>
</section>
