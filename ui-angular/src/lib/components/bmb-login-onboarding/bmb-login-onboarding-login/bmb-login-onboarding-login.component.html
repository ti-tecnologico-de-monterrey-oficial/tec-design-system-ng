<section class="bmb_login-onboarding-login">
  <section class="bmb_login-onboarding-login-tec_logo">
    <img [alt]="'login_onboarding.logo_alt' | translate" [src]="tecLogoImage" />
  </section>
  <section class="bmb_login-onboarding-login-mitec_logo">
    <bmb-mitec-logo-animation label="" />
  </section>
  <section class="bmb_login-onboarding-login-content">
    <button
      class="bmb_login-onboarding-login-content-button"
      bmbButton
      size="large"
      (click)="_handleContinuePage()"
      type="button"
    >
      {{ 'login_onboarding.start_registration' | translate }}
    </button>
    <p>
      {{ 'login_onboarding.registration_notice' | translate }}
      <br />
      {{ 'login_onboarding.biometric_notice' | translate }}
    </p>
  </section>
</section>
