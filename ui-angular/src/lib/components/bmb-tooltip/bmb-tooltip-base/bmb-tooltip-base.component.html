<span
  #tooltipContainer
  class="bmb_tooltip-container"
  (mouseenter)="!manual() && showTooltip()"
  (mouseleave)="!manual() && hideTooltip()"
  (focusin)="!manual() && showTooltip($event)"
  (focusout)="!manual() && hideTooltip()"
  (mousedown)="!manual() && showTooltip()"
  (mouseup)="!manual() && hideTooltip()"
  (touchstart)="!manual() && showTooltip()"
  (touchend)="!manual() && hideTooltip()"
>
  <ng-content />
</span>
