<section
  class="bmb_generic_card_button"
  [class.bmb_generic_card_button-disabled]="disabled()"
  [class.bmb_generic_card_button-selected]="selected()"
  [class.bmb_generic_card_button-alternative]="appearance() === 'alternative'"
  role="button"
  [attr.tabindex]="disabled() ? -1 : 0"
  [attr.aria-disabled]="disabled() || null"
  [attr.aria-pressed]="selected() ? true : null"
  (click)="handleClick($event)"
  (keydown.enter)="handleKeydown($event)"
  (keydown.space)="handleKeydown($event)"
>
  <!-- medium/large are optional per-size overrides; default is the fallback -->
  <div class="bmb_generic_card_button-slot bmb_generic_card_button-slot-medium">
    <ng-content select="[bmbCardButtonMedium]" />
  </div>
  <div class="bmb_generic_card_button-slot bmb_generic_card_button-slot-large">
    <ng-content select="[bmbCardButtonLarge]" />
  </div>
  <div class="bmb_generic_card_button-slot bmb_generic_card_button-slot-default">
    <ng-content />
  </div>
</section>
