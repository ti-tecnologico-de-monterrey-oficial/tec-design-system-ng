<section
  class="bmb_generic-card-button"
  [class.bmb_generic-card-button-disabled]="disabled()"
  [class.bmb_generic-card-button-alternative]="appearance() === 'alternative'"
  role="button"
  [attr.tabindex]="disabled() ? -1 : 0"
  [attr.aria-disabled]="disabled() || null"
  (click)="handleClick($event)"
  (keydown.enter)="handleKeydown($any($event))"
  (keydown.space)="handleKeydown($any($event))"
>
  <!-- medium/large are optional per-size overrides; default is the fallback -->
  <div class="bmb_generic-card-button-slot bmb_generic-card-button-slot-medium">
    <ng-content select="[bmbCardButtonMedium]" />
  </div>
  <div class="bmb_generic-card-button-slot bmb_generic-card-button-slot-large">
    <ng-content select="[bmbCardButtonLarge]" />
  </div>
  <div
    class="bmb_generic-card-button-slot bmb_generic-card-button-slot-default"
  >
    <ng-content />
  </div>
</section>
