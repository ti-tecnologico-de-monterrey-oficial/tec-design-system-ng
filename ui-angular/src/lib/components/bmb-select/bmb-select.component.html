<section
  class="bmb_select"
  role="combobox"
  aria-autocomplete="none"
  aria-haspopup="listbox"
  tabindex="0"
  [attr.aria-expanded]="isExpanded"
>
  <span class="bmb_select-input">
    <button class="bmb_select-input-button" type="button">
      <ng-content select="[selectTemplate]"></ng-content>
    </button>
    <bmb-icon icon="zoom_out_map" />
  </span>
  <ul class="bmb_select-list" role="listbox" [ngClass]="getClassName()">
    <ng-content></ng-content>
  </ul>
</section>
