<ng-template #aiChatContent>
  <section class="bmb_ai-chat-card">
    <bmb-home-card
      [bgIconAppearance]="bgIconAppearance()"
      [componentTitle]="
        componentTitle() || ('home_card_chat.title' | translate)
      "
      [subtitle]="subtitle() || ('home_card_chat.subtitle' | translate)"
      [actionHeaders]="headerActionList()"
      [isExpanded]="true"
      [showOneHeaderAction]="true"
      [(currentBot)]="currentBot"
      (onExpandClick)="handleExpandOrContract()"
    >
      <section class="bmb_ai-chat-card-wrapper">
        @if (isOneChatBar()) {
          <section #aiChatBubblesContainer class="bmb_ai-chat-card-bubbles">
            <ng-content select="bmb-ai-chat-bubble"></ng-content>
          </section>

          <div #aiChatBarContainer class="bmb_ai-chat-card-bar">
            <ng-content select="bmb-chat-bar"></ng-content>
          </div>
        }
      </section>
    </bmb-home-card>
  </section>
</ng-template>

@if (mode() === 'expanded') {
  <ng-container *ngTemplateOutlet="aiChatContent" />
}

@if (currentBot() && mode() === 'compact') {
  <bmb-action-icon
    class="bmb_ai-chat-card-bot"
    [icon]="currentBot().icon"
    [tooltipText]="currentBot().name"
    [iconSize]="40"
    [isSVGTemplate]="true"
    (buttonClick)="openChat()"
  >
    <ng-template #customActionIcon>
      <bmb-bot-icon [iconName]="currentBot().icon" />
    </ng-template>
  </bmb-action-icon>
}
