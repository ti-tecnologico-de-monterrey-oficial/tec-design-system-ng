<ng-template #chatContent>
  <section class="bmb_chat-card">
    <bmb-home-card
      [leftIcon]="mode() === 'chat' ? undefined : 'chevron_left'"
      [componentTitle]="
        componentTitle() || ('home_card_chat.title' | translate)
      "
      [subtitle]="subtitle() || ('home_card_chat.subtitle' | translate)"
      [isMobile]="isMobile()"
      [actionHeaders]="headerActions()"
      [bgIconAppearance]="bgIconAppearance()"
      contentPadding="xs"
      [isExpanded]="isChatCardOpen()"
      [(currentBot)]="currentBot"
      (onExpandClick)="handleChat()"
      (onClose)="handleClose()"
      (onBack)="handleBack()"
    >
      <div class="bmb_chat-card-container">
        <ng-content select="bmb-ai-chat-bubble" />
      </div>
      <div class="bmb_chat-card-chatBar">
        <bmb-chat-bar
          [placeholder]="placeholder()"
          [botList]="botList"
          [enableMicInput]="enableMicInput()"
          [(currentBot)]="currentBot"
          [(isLoading)]="isLoading"
          (onSendMessage)="handleSend($event)"
        />
      </div>
    </bmb-home-card>
  </section>
</ng-template>

@if (mode() === 'expanded') {
  <ng-container *ngTemplateOutlet="chatContent" />
}

@if (mode() === 'chat') {
  <ng-container *ngTemplateOutlet="chatContent" />
}

<ng-template #contentTemplate>
  <div class="bmb_chat-card-chat-content">
    <ng-container *ngTemplateOutlet="chatContent" />
  </div>
</ng-template>

@if (currentBot() && mode() === 'compact') {
  <bmb-action-icon
    class="bmb_chat-card-bot"
    [icon]="currentBot().icon"
    [tooltipText]="currentBot().name"
    [iconSize]="40"
    [isSVGTemplate]="true"
    (buttonClick)="openChatFromCompact()"
  >
    <ng-template #customActionIcon>
      <bmb-bot-icon [iconName]="currentBot().icon" />
    </ng-template>
  </bmb-action-icon>
}
