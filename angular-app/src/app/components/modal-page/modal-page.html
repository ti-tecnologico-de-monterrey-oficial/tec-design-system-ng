<header class="page-header">
  <p class="eyebrow">Componente migrado</p>
  <h1>BmbModal</h1>
  <p>
    Abre la variante warning para comparar el icono y el espaciado del header
    contra el diseño de Figma.
  </p>
</header>

<section class="playground" aria-labelledby="modal-demo-heading">
  <div class="controls">
    <h2 id="modal-demo-heading">Prueba DS01-3722</h2>
    <button type="button" (click)="openWarningModal()">
      Abrir modal warning
    </button>
    <p><strong>Estado:</strong> {{ status() }}</p>
  </div>
  <div class="preview">
    <h2>Referencia esperada</h2>
    <ul>
      <li>Icono: 48 px</li>
      <li>Separacion entre header y contenido: 32 px</li>
      <li>Icono de cierre: 24 px</li>
    </ul>
  </div>
</section>
