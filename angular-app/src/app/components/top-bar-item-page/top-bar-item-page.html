<header class="page-header">
  <p class="eyebrow">Componente migrado</p>
  <h1>BmbTopBarItem</h1>
  <p>Prueba el estado activo y el contenido proyectado del elemento.</p>
</header>

<section class="playground" aria-labelledby="top-bar-item-properties-heading">
  <aside class="controls">
    <h2 id="top-bar-item-properties-heading">Propiedades</h2>

    <label class="toggle">
      <input
        type="checkbox"
        [checked]="isActive()"
        (change)="isActive.set($any($event.target).checked)"
      />
      isActive
    </label>

    <label for="top-bar-item-text">Contenido proyectado</label>
    <input
      id="top-bar-item-text"
      type="text"
      [value]="projectedText()"
      (input)="setProjectedText($any($event.target).value)"
    />
  </aside>

  <div class="preview">
    <ul class="top-bar-list">
      <bmb-top-bar-item [isActive]="isActive()">
        <a href="#top-bar-item-preview">{{ projectedText() }}</a>
      </bmb-top-bar-item>
    </ul>
  </div>
</section>
