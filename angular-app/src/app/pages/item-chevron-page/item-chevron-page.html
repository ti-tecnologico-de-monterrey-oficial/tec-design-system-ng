<section bmbVerticalLayout gapSize="m" margin="m" alignItems="stretch">
  <h1>Item chevron</h1>
  <div bmbLayout margin="none" gapSize="m" alignItems="start">
    <section
      bmbLayoutItem
      [colSm]="4"
      [colLg]="4"
      aria-labelledby="item-chevron-properties"
    >
      <bmb-container appearance="primary-home">
        <div bmbVerticalLayout gapSize="m">
          <h2 id="item-chevron-properties">Propiedades</h2>
          <label
            >itemTitle
            <input
              [value]="itemTitle()"
              (input)="itemTitle.set($any($event.target).value)"
          /></label>
          <label
            >itemSubtitle
            <input
              [value]="itemSubtitle()"
              (input)="itemSubtitle.set($any($event.target).value)"
          /></label>
          <label
            >isDisabled
            <input
              type="checkbox"
              [checked]="isDisabled()"
              (change)="isDisabled.set($any($event.target).checked)"
          /></label>

          <p aria-live="polite">Último evento: {{ lastEvent() }}</p>
        </div>
      </bmb-container>
    </section>
    <section bmbLayoutItem [colSm]="4" [colLg]="8" aria-label="Vista previa">
      <bmb-container appearance="contrast-box-container">
        <div
          bmbVerticalLayout
          layoutHeight="320px"
          justify="center"
          alignItems="center"
        >
          <bmb-interactive-item-chevron
            [itemTitle]="itemTitle()"
            [itemSubtitle]="itemSubtitle()"
            [isDisabled]="isDisabled()"
            (getActionClick)="handleActionClick($event)"
          />
        </div>
      </bmb-container>
    </section>
  </div>
</section>
