<header class="page-header">
  <p class="eyebrow">Componente Bamboo</p>
  <h1>BmbInputTags</h1>
  <p>Valida las opciones, los tags personalizados y el evento de cambio.</p>
</header>

<section class="playground" aria-labelledby="input-tags-properties">
  <aside class="controls">
    <h2 id="input-tags-properties">Propiedades</h2>

    <label for="it-label">label</label>
    <input
      id="it-label"
      [value]="label()"
      (input)="label.set($any($event.target).value)"
    />

    <label for="it-placeholder">placeholder</label>
    <input
      id="it-placeholder"
      [value]="placeholder()"
      (input)="placeholder.set($any($event.target).value)"
    />

    <label class="toggle"
      ><input
        type="checkbox"
        [checked]="enableCustomTags()"
        (change)="enableCustomTags.set($any($event.target).checked)"
      />enableCustomTags</label
    >
    <label class="toggle"
      ><input
        type="checkbox"
        [checked]="disabled()"
        (change)="disabled.set($any($event.target).checked)"
      />disabled</label
    >

    <p>Último evento: {{ lastEvent() }}</p>
  </aside>

  <div class="preview">
    <bmb-input-tags
      [label]="label()"
      [placeholder]="placeholder()"
      [enableCustomTags]="enableCustomTags()"
      [disabled]="disabled()"
      [tagOptions]="tagOptions()"
      (tagOptionsChange)="tagOptions.set($event)"
      (onChange)="handleChange($event)"
    />
  </div>
</section>
