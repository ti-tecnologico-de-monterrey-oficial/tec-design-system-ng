<header class="page-header">
  <p class="eyebrow">Componente migrado</p>
  <h1>BmbBookmark</h1>
  <p>Prueba el estado inicial y la interacción del marcador.</p>
</header>

<section class="playground" aria-labelledby="bookmark-properties-heading">
  <aside class="controls">
    <h2 id="bookmark-properties-heading">Propiedades</h2>
    <label class="toggle">
      <input
        type="checkbox"
        [checked]="isActive()"
        (change)="setActive($any($event.target).checked)"
      />
      isActive
    </label>
    <p><strong>Estado:</strong> {{ isActive() ? 'Activo' : 'Inactivo' }}</p>
    <p><strong>Último evento:</strong> {{ lastEvent() }}</p>
  </aside>

  <div class="preview">
    <div class="bookmark-example">
      <p>Selecciona el marcador para cambiar su estado.</p>
      <bmb-bookmark
        [isActive]="isActive()"
        (isActiveChange)="setActive($event)"
      />
    </div>
  </div>
</section>
