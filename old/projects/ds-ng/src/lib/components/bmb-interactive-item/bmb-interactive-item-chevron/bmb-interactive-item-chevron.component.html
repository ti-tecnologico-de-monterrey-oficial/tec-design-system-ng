<button
  type="button"
  class="bmb_interactive-item-default"
  [disabled]="isDisabled()"
  (click)="handleActionClick($event)"
  bmbLayout
  margin="none"
  alignItems="center"
  [dynamicCols]="true"
>
  <bmb-title
    class="bmb_interactive-item-default-title"
    [componentTitle]="itemTitle()"
    [subtitle]="itemSubtitle()"
    bmbLayoutItem
    [isDynamicItem]="true"
    [colGrow]="1"
  />
  <bmb-icon [icon]="'chevron_right'" [size]="24" bmbLayoutItem />
</button>
