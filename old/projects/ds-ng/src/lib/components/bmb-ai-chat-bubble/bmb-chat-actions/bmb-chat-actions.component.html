@for (action of visibleActions(); track action.action) {
  <bmb-icon
    role="button"
    tabindex="0"
    class="bmb-ai-chat-bubble-icon"
    [icon]="action.icon"
    [size]="24"
    [isFill]="true"
    [attr.aria-label]="action.label"
    [ngClass]="{
      'bmb-ai-chat-bubble-icon-active': action.active
    }"
    (click)="triggerAction(action.action, $event)"
    (keydown.enter)="triggerAction(action.action, $event)"
    (keydown.space)="triggerAction(action.action, $event)"
  />
}
