<bmb-container class="bmb_academic-progress-summary">
  <section
    class="bmb_academic-progress-summary-container"
    bmbLayout
    margin="none"
    justify="spaceAround"
    [dynamicCols]="true"
  >
    @for (metric of metrics(); track $index) {
      <bmb-focus-element
        bmbLayoutItem
        [componentTitle]="metric.name"
        [number]="metric.value"
        [isNormal]="true"
        [isNonFocused]="true"
      />
    }
  </section>
</bmb-container>
