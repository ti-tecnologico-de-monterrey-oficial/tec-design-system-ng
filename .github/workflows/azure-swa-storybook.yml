name: Deploy Storybook to Azure Static Web Apps

on:
  push:
    branches:
      - develop
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: azure-swa-storybook
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STORYBOOK_OUTPUT_DIR: dist/storybook/ui-angular
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Sync Angular shared files
        run: node scripts/sync-angular-shared.mjs

      - name: Build Angular Storybook
        run: npm run storybook:build:angular

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.WEB_APP_DEPLOYMENT }}
          action: upload
          skip_app_build: true
          skip_api_build: true
          app_location: ${{ env.STORYBOOK_OUTPUT_DIR }}
