<section
  bmbLayout
  margin="none"
  class="bmb_three-cols"
  [justify]="justify()"
  [alignItems]="alignItems()"
  [gapSize]="gapSize()"
  [dynamicCols]="true"
>
  @if (leftContent().length) {
    @for (leftItem of leftContent(); track $index) {
      <div
        [id]="'leftContentID'.concat($index.toString())"
        bmbLayoutItem
        [isDynamicItem]="true"
        class="bmb_three-cols-child"
      >
        <ng-container [ngTemplateOutlet]="leftItem" />
      </div>
    }
  }
  <div
    id="mainContentID"
    bmbLayoutItem
    [isDynamicItem]="true"
    class="bmb_three-cols-child"
    [colGrow]="(expandMainColumn() && 1) || 0"
  >
    <ng-container [ngTemplateOutlet]="mainContent() ?? null" />
  </div>
  @if (rightContent().length) {
    @for (rightItem of rightContent(); track $index) {
      <div
        [id]="'rightContentID'.concat($index.toString())"
        bmbLayoutItem
        [isDynamicItem]="true"
        class="bmb_three-cols-child"
      >
        <ng-container [ngTemplateOutlet]="rightItem" />
      </div>
    }
  }
</section>
