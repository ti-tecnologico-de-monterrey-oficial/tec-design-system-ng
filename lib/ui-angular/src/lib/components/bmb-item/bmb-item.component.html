<section class="bmb_item">
  @if (isButton()) {
    <button
      (click)="handleClick($event)"
      type="button"
      size="large"
      type="button"
      appearance="transparent"
      class="bmb_item bmb_item-button"
    >
      <ng-container [ngTemplateOutlet]="itemContent" />
    </button>
  } @else {
    <ng-container [ngTemplateOutlet]="itemContent" />
  }
</section>

<ng-template #itemContent>
  <section
    class="bmb_item-wrapper"
    [ngClass]="{ action: isButton() }"
    bmbLayout
    margin="none"
    alignItems="center"
  >
    @if (icon()) {
      <bmb-icon
        class="bmb_item-icon"
        [icon]="icon()"
        [size]="iconSize()"
        alt="Item icon"
        bmbLayoutItem
        [isDynamicItem]="true"
      />
    }
    <section bmbLayoutItem [isDynamicItem]="true" [colGrow]="1">
      <section
        class="bmb_item-content"
        bmbLayout
        margin="none"
        [alignItems]="rightIcon() ? 'center' : 'start'"
        [gapSize]="!rightIcon() ? 'xs' : 'none'"
        [isContainerQuery]="true"
      >
        <section bmbLayoutItem [isDynamicItem]="true" [colGrow]="1">
          <section bmbVerticalLayout gapSize="xs">
            <span class="bmb_item-label" bmbVerticalLayoutItem>
              {{ label() }}
            </span>
            @if (rightIcon() && subLabel()) {
              <span class="bmb_item-sublabel" bmbVerticalLayoutItem>
                {{ subLabel() }}
              </span>
            }
          </section>
        </section>
        @if (isButton()) {
          <ng-container [ngTemplateOutlet]="rightItemContent" />
        } @else {
          @if (valueLink()) {
            <bmb-text-link
              class="bmb_item-link"
              [textLink]="value()"
              [link]="valueLink()"
              [target]="valueTarget()"
              icon=""
              bmbLayoutItem
            />
          } @else if (supportText()) {
            <div
              class="bmb_item-support"
              [innerHTML]="safeValue"
              bmbLayoutItem
            ></div>
          } @else {
            <ng-container [ngTemplateOutlet]="rightItemContent" />
          }
        }
      </section>
    </section>
  </section>
</ng-template>

<ng-template #rightItemContent>
  @if (rightIcon()) {
    <bmb-icon
      class="bmb_item-icon-right"
      [icon]="rightIcon()"
      [size]="iconSize()"
      alt="Item icon"
      bmbLayoutItem
    />
  } @else if (value()) {
    <span class="bmb_item-value" bmbLayoutItem>
      {{ value() }}
    </span>
  }
</ng-template>
