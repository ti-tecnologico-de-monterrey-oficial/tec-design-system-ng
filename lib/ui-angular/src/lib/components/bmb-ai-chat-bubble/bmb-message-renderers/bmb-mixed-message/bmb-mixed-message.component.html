<div class="bmb-ai-chat-bubble-mixed">
  <p class="bmb-ai-chat-bubble-mixed-text">
    {{ message().content.text }}
  </p>

  <img
    class="bmb-ai-chat-bubble-mixed-image"
    [src]="message().content.imageUrl"
    [attr.alt]="message().content.text || 'Message image'"
    loading="lazy"
  />
</div>
