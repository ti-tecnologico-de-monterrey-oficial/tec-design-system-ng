<section class="bmb_balance-overview-container">
  <div class="bmb_balance-overview-circle-container">
    <bmb-progress-circle
      [percent]="progressCirclePercent()"
      [emptyState]="emptyState()"
      [icon]="icon()"
      [valueLabel]="
        progressCircleValue() ||
        ('balance_overview.progress_circle_value' | translate)
      "
      [showOperationState]="showProgressCircleOperationState()"
      [showValueLabel]="showProgressCircleValue()"
      [fillPathStatus]="progressCircleFillPathStatus()"
      [fullFillPathStatus]="progressCircleFullFillPathStatus()"
      [componentTitle]="
        progressCircleTitle() ||
        ('balance_overview.progress_circle_title' | translate)
      "
      [showTitle]="showProgressCircleTitle()"
      [showBackground]="showProgressCircleBackground()"
    />
  </div>
  <div class="bmb_balance-overview-legend-main-container">
    <div class="bmb_balance-overview-legend-success">
      <bmb-legend
        [isOperationState]="showProgressCircleOperationState()"
        class="bmb_balance-overview-legend-text"
        [indicatorAppearance]="indicatorAppearance() || 'success'"
        [label]="
          labelPrimary() || ('balance_overview.label_primary' | translate)
        "
        [value]="
          valuePrimary() || ('balance_overview.value_primary' | translate)
        "
      />
    </div>
    <div class="bmb_balance-overview-legend-strong">
      <bmb-legend
        class="bmb_balance-overview-legend-text"
        [isOperationState]="showProgressCircleOperationState()"
        [indicatorAppearance]="indicatorAppearance() || 'strong'"
        [label]="
          labelSecondary() || ('balance_overview.label_secondary' | translate)
        "
        [value]="
          valueSecondary() || ('balance_overview.value_secondary' | translate)
        "
      />
    </div>
  </div>
</section>
