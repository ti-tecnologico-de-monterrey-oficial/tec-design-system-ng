<bmb-container-button-base
  [isDisabled]="isDisabled()"
  [isError]="isError()"
  (getClickButton)="handleClick($event)"
>
  <ng-template #bmbContainerLeft>
    <bmb-user-image
      size="desktop-small"
      [image]="avatarURL()"
      [altImage]="avatarAlt() || 'User image'"
    />
  </ng-template>

  <ng-template #bmbContainerMain>
    <bmb-title [componentTitle]="fullName()" [subtitle]="email()" />
  </ng-template>
  <ng-template #bmbContainerRight>
    <bmb-icon
      [icon]="rightIconName()"
      [size]="24"
      [alt]="iconImageAlt() || rightIconName()"
    />
  </ng-template>
</bmb-container-button-base>
