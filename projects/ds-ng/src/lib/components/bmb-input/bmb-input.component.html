<bmb-input-validation
  [type]="type()"
  [name]="name()"
  [label]="label()"
  [checked]="checked()"
  [value]="value()"
  [errorMessage]="errorMessage()"
  [helperMessage]="helperMessage()"
  [isRequired]="isRequired()"
  [disabled]="disabled()"
  [control]="control()"
  [showError]="showError()"
  [pattern]="pattern()"
  [jsonFormat]="jsonFormat()"
  [tooltip]="tooltip()"
  [tooltipPosition]="tooltipPosition()"
  [appearance]="appearance()"
>
  <section class="bmb_field-wrapper">
    @if (!!icon() && type() !== "text-area") {
      <bmb-icon
        class="bmb_field-icon"
        [ngClass]="{
          'bmb_field-icon-simple': appearance() === 'simple',
        }"
        [icon]="icon()"
        [size]="24"
      />
    }
    @if (type() === "text-area") {
      <textarea
        class="bmb_field-text-area"
        [ngClass]="inputClasses"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        [required]="isRequired()"
        [formControl]="getFormControl()"
        [maxlength]="maxlength()!"
        [style.height.px]="heightTextArea()!"
        [minlength]="minlength()!"
        [spellcheck]="spellcheck()"
        (focus)="onFocus()"
        (blur)="onBlur()"
        [rows]="rows()"
        [name]="name()"
        [id]="id()"
        [pattern]="pattern()!"
        [tabindex]="disabled() ? -1 : 0"
      ></textarea>
      @if (this.shouldShowError) {
        <bmb-icon class="bmb_field-text-area-error-icon" [icon]="'error'" />
      }
    } @else {
      <input
        [type]="getType()"
        class="bmb_field-input"
        [ngClass]="inputClasses"
        [required]="isRequired()"
        [disabled]="disabled()"
        [placeholder]="placeholder()"
        [formControl]="getFormControl()"
        (focus)="onFocus()"
        (blur)="onBlur()"
        [name]="name()"
        [id]="id()"
        [spellcheck]="spellcheck()"
        [maxlength]="maxlength()!"
        [minlength]="minlength()!"
        [pattern]="pattern()!"
        [max]="max()"
        [min]="min()"
        [tabindex]="disabled() ? -1 : 0"
      />
      @if (this.isClearable()) {
        <bmb-action-icon
          class="bmb_field-clear"
          icon="close"
          [iconSize]="24"
          (buttonClick)="clearValue()"
        />
      }
      @if (showAdditionalAction()) {
        <bmb-action-icon
          class="bmb_field-additional_action"
          [icon]="getAdditionalActionIcon()"
          [iconSize]="24"
          (buttonClick)="actionToExecute()"
        />
      }
    }
  </section>
</bmb-input-validation>
