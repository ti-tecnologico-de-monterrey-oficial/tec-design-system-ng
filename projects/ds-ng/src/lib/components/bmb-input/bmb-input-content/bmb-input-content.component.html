<section class="bmb_field">
  <section class="bmb_field-wrapper">
    @if (!!icon() && type() !== "text-area") {
      <bmb-icon
        class="bmb_field-icon"
        [ngClass]="{
          'bmb_field-icon-simple': appearance() === 'simple',
          'bmb_field-icon-simple-focused': appearance() === 'simple' && isFocus,
          'bmb_field-icon-simple-error': appearance() === 'simple' && isError(),
        }"
        [icon]="icon()"
        [size]="24"
      />
    }
    @if (type() === "text-area") {
      <textarea
        class="bmb_field-text-area"
        [ngClass]="inputClasses"
        [autocomplete]="autocomplete()"
        [placeholder]="placeholder()"
        [disabled]="isDisabled()"
        [required]="isRequired()"
        [formControl]="control()"
        [maxlength]="maxlength()!"
        [style.height.px]="heightTextArea()!"
        [minlength]="minlength()!"
        [spellcheck]="spellcheck()"
        [rows]="rows()"
        [name]="name()"
        [id]="inputId()"
        [pattern]="pattern()!"
        [tabindex]="isDisabled() ? -1 : 0"
        (keydown)="handleKeyPress($event)"
        (change)="handleChange($event)"
        (focus)="handleFocus()"
        (blur)="handleBlur()"
      ></textarea>
      @if (isError()) {
        <bmb-icon class="bmb_field-text-area-error-icon" [icon]="'error'" />
      }
    } @else {
      <input
        class="bmb_field-input"
        [type]="getType()"
        [ngClass]="inputClasses"
        [autocomplete]="autocomplete()"
        [required]="isRequired()"
        [disabled]="isDisabled()"
        [readOnly]="isReadOnly()"
        [placeholder]="placeholder()"
        [formControl]="control()"
        [name]="name()"
        [id]="inputId()"
        [spellcheck]="spellcheck()"
        [maxlength]="maxlength()!"
        [minlength]="minlength()!"
        [pattern]="pattern()!"
        [max]="max()"
        [min]="min()"
        [tabindex]="isDisabled() ? -1 : 0"
        (keydown)="handleKeyPress($event)"
        (change)="handleChange($event)"
        (focus)="handleFocus()"
        (blur)="handleBlur()"
      />
      @if (
        (showAdditionalAction() && !!getAdditionalActionIcon()) || isClearable()
      ) {
        <span class="bmb_field-actions">
          @if (showAdditionalAction() && !!getAdditionalActionIcon()) {
            <bmb-action-icon
              class="bmb_field-additional_action"
              [icon]="getAdditionalActionIcon()"
              [iconSize]="24"
              [disabled]="isDisabled()"
              (buttonClick)="actionToExecute()"
            />
          }
          @if (isClearable()) {
            <bmb-action-icon
              class="bmb_field-clear"
              icon="close"
              [iconSize]="24"
              [disabled]="isDisabled()"
              (buttonClick)="handleClearValue()"
            />
          }
        </span>
      }
    }
    <ng-container [ngTemplateOutlet]="customContent" />
  </section>
</section>
