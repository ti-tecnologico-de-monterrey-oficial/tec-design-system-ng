<section
  #inputValidation
  class="bmb_input-validation"
  [ngClass]="{ disabled: idDisabled() }"
>
  <span
    class="bmb_input-validation-wrapper"
    [ngClass]="getClasses('bmb_input-validation')"
  >
    @if (
      !!label() ||
      isRequired() ||
      !!tooltip() ||
      (type() === "text-area" && showMaxTextLength())
    ) {
      <label class="bmb_input-validation-label" [htmlFor]="inputId()">
        {{ label() }}
        @if (isFieldRequired()) {
          <small class="bmb_input-validation-label-required">*</small>
        }
        @if (!!tooltip()) {
          <bmb-tooltip
            class="bmb_input-validation-label-tooltip"
            [text]="tooltip()"
            [align]="tooltipPosition().align"
            [justify]="tooltipPosition().justify"
            [icon]="'help'"
            [size]="20"
          />
        }
        @if (type() === "text-area" && showMaxTextLength()) {
          <span class="bmb_input-validation-label-max">
            {{ control()?.value?.toString().length }}/{{ maxLength() || "-" }}
          </span>
        }
      </label>
    }
    <ng-content />
  </span>
  @if (!!helperMessage() || showError()) {
    <div class="bmb_input-validation-support">
      @if (showError()) {
        <p class="bmb_input-validation-support-error">
          {{ getErrorMessage() }}
        </p>
      } @else if (!!helperMessage()) {
        <p [class]="'bmb_input-validation-support-helper-' + appearance()">
          {{ helperMessage() }}
        </p>
      }
    </div>
  }
</section>
