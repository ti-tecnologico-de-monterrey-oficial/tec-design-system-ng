<section class="bmb_input-validation" [ngClass]="{ disabled: disabled() }">
  <label [ngClass]="getClasses('bmb_input-validation')">
    @if (
      !!label() ||
      isRequired() ||
      !!tooltip() ||
      (type() === "text-area" && showMaxTextLength())
    ) {
      <span
        class="bmb_input-validation-label"
        [ngClass]="getLabelClass('bmb_input-validation-label')"
      >
        {{ label() }}
        @if (isRequired()) {
          <small class="bmb_input-validation-label-required">*</small>
        }
        @if (!!tooltip()) {
          <bmb-tooltip
            class="bmb_input-validation-label-tooltip"
            [text]="tooltip()"
            [align]="tooltipPosition().align"
            [justify]="tooltipPosition().justify"
            [icon]="'help'"
            [size]="20"
          />
        }
        @if (type() === "text-area" && showMaxTextLength()) {
          <span class="bmb_input-validation-label-max">
            {{ getFormControl().value?.toString().length }}/{{
              maxlength() || "-"
            }}
          </span>
        }
      </span>
    }
    <ng-content />
  </label>
  @if (helperMessage() && !shouldShowError) {}
  @if (!!errorMessage() && shouldShowError) {
    <p class="bmb_input-validation-error">
      {{ getErrorMessage() }}
    </p>
  } @else if (!!helperMessage()) {
    <p
      class="bmb_input-validation-helper"
      [ngClass]="{
        'bmb_input-validation-helper-simple': appearance() === 'simple',
      }"
    >
      {{ helperMessage() }}
    </p>
  }
</section>
