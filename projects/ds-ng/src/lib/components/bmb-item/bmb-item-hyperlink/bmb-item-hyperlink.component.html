<section class="bmb_item-hyperlink" bmbLayout margin="none" alignItems="center">
  @if (icon()) {
    <bmb-icon [icon]="icon()" [size]="24" alt="Item icon" bmbLayoutItem />
  }
  <section bmbLayoutItem [isDynamicItem]="true" [colGrow]="1">
    <section bmbLayout margin="none" justify="spaceBetween">
      <span bmbLayoutItem>
        {{ label() }}
      </span>
      <bmb-text-link
        class="bmb_item-link"
        [textLink]="value()"
        [link]="valueLink()"
        [target]="valueTarget()"
        icon=""
        bmbLayoutItem
      />
    </section>
  </section>
</section>
