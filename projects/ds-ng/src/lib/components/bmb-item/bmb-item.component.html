<section
  class="bmb_item"
  [ngClass]="{
    'bmb_item-default': !isButton(),
  }"
>
  @if (isButton()) {
    <button
      (click)="handleClick()"
      type="button"
      size="large"
      type="button"
      appearance="transparent"
      class="bmb_item-button"
    >
      @if (icon()) {
        <bmb-icon [icon]="icon()" [size]="iconSize()" class="bmb_item-icon" />
      }
      <span class="bmb_item-label">{{ label() }}</span>
    </button>
  } @else {
    <div class="bmb_item-wrapper">
      @if (icon()) {
        <bmb-icon [icon]="icon()" [size]="iconSize()" class="bmb_item-icon" />
      }
      <div class="bmb_item-text">
        <span class="bmb_item-label">{{ label() }}</span>
        <span class="bmb_item-support" [innerHTML]="supportText()"></span>
      </div>
    </div>

    @if (valueLink()) {
      <a class="bmb_item-link" [href]="valueLink()" [target]="valueTarget">
        {{ value() }}
      </a>
    } @else {
      <span class="bmb_item-value">
        {{ value() }}
      </span>
    }
  }
</section>
