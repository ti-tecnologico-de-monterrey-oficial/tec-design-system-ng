<section
  class="bmb_item-default"
  bmbLayout
  margin="none"
  alignItems="center"
  [dynamicCols]="true"
>
  @if (icon()) {
    <bmb-icon [icon]="icon()" [size]="24" alt="Item icon" bmbLayoutItem />
  }
  <section bmbLayoutItem [isDynamicItem]="true" [colGrow]="1">
    <section bmbLayout margin="none">
      <span bmbLayoutItem [isDynamicItem]="true" [colGrow]="1">
        {{ label() }}
      </span>
      <span bmbLayoutItem [isDynamicItem]="true" [colGrow]="1">
        {{ value() }}
      </span>
    </section>
  </section>
</section>
