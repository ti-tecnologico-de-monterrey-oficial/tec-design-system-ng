<section
  class="bmb_dropdown_menu"
  clickOutside
  (clickOutside)="closeDropdown()"
>
  <bmb-action-icon
    class="bmb_dropdown_menu-button"
    icon="more_vert"
    [iconSize]="24"
    (buttonClick)="openDropdown()"
  />
  <bmb-dropdown-content
    class="bmb_dropdown_menu-list"
    [items]="items()"
    [(isOpen)]="isOpen"
  />
</section>
