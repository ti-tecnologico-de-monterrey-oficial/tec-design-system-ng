<section bmbLayout margin="none" gapSize="m">
  @if (icon()) {
    <section bmbLayoutItem [isDynamicItem]="true">
      <bmb-icon [icon]="icon()" [size]="iconSize()" [alt]="label()" />
    </section>
  }
  <section bmbLayoutItem [isDynamicItem]="true" [colGrow]="1">
    <span class="bmb_icon-item-label"> {{ label() }} </span>
  </section>
  <section bmbLayoutItem [isDynamicItem]="true" [colGrow]="1">
    <div class="bmb_icon-item-value" [innerHTML]="safeValue"></div>
  </section>
</section>
@if (showDivider()) {
  <bmb-divider />
}
