<section
  bmbLayout
  margin="none"
  class="bmb_three-cols"
  [justify]="justify()"
  [alignItems]="alignItems()"
  [gapSize]="gapSize()"
  [dynamicCols]="true"
>
  <div bmbLayoutItem [isDynamicItem]="true" class="bmb_three-cols-child">
    <ng-container [ngTemplateOutlet]="leftContent" />
  </div>
  <div
    bmbLayoutItem
    [isDynamicItem]="true"
    class="bmb_three-cols-child"
    [colGrow]="(expandMainColumn() && 1) || 0"
  >
    <ng-container [ngTemplateOutlet]="mainContent" />
  </div>
  <div bmbLayoutItem [isDynamicItem]="true" class="bmb_three-cols-child">
    <ng-container [ngTemplateOutlet]="rightContent" />
  </div>
</section>
