<span [ngClass]="getClasses()">
  <bmb-check-external-link-button
    [idElement]="buttonName()"
    [link]="link()"
    [target]="target()"
    [disabled]="false"
    (buttonPress)="handlePress($event)"
    (buttonClick)="handleClick($event)"
    (buttonKeyPress)="handleKeyPress($event)"
    [buttonName]="buttonName()"
    class="bmb_logo-button"
  >
    <img [src]="image()" [alt]="altImage()" class="bmb_logo-img" />
  </bmb-check-external-link-button>
</span>
