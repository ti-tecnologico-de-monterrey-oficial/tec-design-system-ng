<bmb-input-validation
  type="checkbox"
  [inputId]="id()"
  [name]="name()"
  [label]="label()"
  [labelPosition]="labelPosition()"
  [checked]="checked()!"
  [errorMessage]="errorMessage()"
  [showError]="showError()"
  [helperMessage]="helperMessage()"
  [isRequired]="required()"
  [disabled]="disabled()"
  [control]="control()"
>
  <span class="bmb_checkbox" [ngClass]="getPositionClass('bmb_checkbox')">
    <input
      class="bmb_checkbox-input"
      [ngClass]="{
        'bmb_checkbox-input-indeterminate': indeterminate(),
      }"
      type="checkbox"
      [id]="id()"
      [formControl]="getFormControl()"
      [name]="name()"
      [attr.aria-describedby]="ariaDescribedby()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-labelledby]="ariaLabelledby()"
      [attr.value]="value()"
      [checked]="checked()"
      [disabled]="disabled()"
      [required]="required()"
      [indeterminate]="indeterminate()"
      (change)="handleChange($event)"
      (keydown)="handleKeyDown($event)"
      [tabindex]="disabled() ? -1 : 0"
    />
    <span
      class="bmb_checkbox-mark"
      [ngClass]="{ 'bmb_checkbox-mark-error': shouldShowError }"
    ></span>
  </span>
</bmb-input-validation>
