<li [ngClass]="getClasses()" (click)="handleItemSelection()">
  <section class="bmb_list-group-item-content">
    <ng-content></ng-content>
  </section>
  @if (showControls()) {
    <section>
      @if (getConfig().isMultipleSelection) {
        <bmb-checkbox
          [id]="id()"
          [disabled]="isDisabled()"
          [value]="id()"
          name="listGroupStatus"
          (change)="handleSelection()"
          [checked]="isActive()"
        />
      } @else {
        <bmb-radial
          [id]="id()"
          [value]="id()"
          name="listGroupStatus"
          [disabled]="isDisabled()"
          labelPosition="after"
          label="item"
          (change)="handleSelection()"
          [checked]="isActive()"
        />
      }
    </section>
  }
</li>
