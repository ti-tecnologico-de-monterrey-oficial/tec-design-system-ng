<ng-template #tag>
  <span class="bmb_tag-text">{{ text() }}</span>
  @if (dismissible()) {
    <bmb-action-icon
      [iconSize]="16"
      class="bmb_tag-btn"
      (buttonClick)="closeTag(text())"
      [icon]="'close'"
    />
  }
</ng-template>

@if (dismissible() || enableClick()) {
  <button
    type="button"
    [disabled]="isDisabled()"
    [ngClass]="getClasses()"
    (click)="clickTag(text())"
  >
    <ng-container [ngTemplateOutlet]="tag" />
  </button>
} @else {
  <div [ngClass]="getClasses()">
    <ng-container [ngTemplateOutlet]="tag" />
  </div>
}
