<ng-template #tag>
  <span class="bmb_tag-text">{{ text() }}</span>
  @if (dismissible() && !activityTag()) {
    <bmb-icon
      [size]="16"
      class="bmb_tag-btn"
      (click)="closeTag(text())"
      [icon]="'close'"
    />
  }
</ng-template>

@if (activityTag()) {
  <div [ngClass]="getClasses()">
    <ng-container [ngTemplateOutlet]="tag" />
  </div>
} @else {
  <button
    type="button"
    [disabled]="idDisabled()"
    [tabindex]="idDisabled() ? -1 : 0"
    [ngClass]="getClasses()"
    (click)="clickTag(text())"
  >
    <ng-container [ngTemplateOutlet]="tag" />
  </button>
}
