<ng-template #tag>
  <span class="bmb_tag-text">{{ text() }}</span>
  @if (dismissible() && !activityTag()) {
    <bmb-icon
      [size]="16"
      class="bmb_tag-btn"
      (click)="closeTag(text())"
      [icon]="'close'"
      [tabindex]="dismissible() && !activityTag() && !isDisabled() ? 0 : -1"
    />
  }
</ng-template>

@if (activityTag()) {
  <div [ngClass]="getClasses()">
    <ng-container [ngTemplateOutlet]="tag" />
  </div>
} @else {
  <button
    [tabindex]="dismissible() && !activityTag() && !isDisabled() ? -1: 0"
    type="button"
    [disabled]="isDisabled()"
    [ngClass]="getClasses()"
    (click)="clickTag(text())"
  >
    <ng-container [ngTemplateOutlet]="tag" />
  </button>
}
