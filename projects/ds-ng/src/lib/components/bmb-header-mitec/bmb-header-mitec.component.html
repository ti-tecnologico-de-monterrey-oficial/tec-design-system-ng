<section class="bmb_header-mitec">
  <section class="bmb_header-mitec-top">
    <section class="bmb_header-mitec-top-tec_logo">
      <img alt="Tecnológico de Monterrey" [src]="tecLogoImage" />
    </section>
    <section class="bmb_header-mitec-top-social">
        <a href="" target="_blank">
            <img class="bmb_login-header-social-icon" [src]="appleIcon" alt="Apple">
        </a>
        <a href="" target="_blank">
            <img class="bmb_login-header-social-icon" [src]="androidIcon" alt="Android">
        </a>
        <a href="" target="_blank">
            <img class="bmb_login-header-social-icon" [src]="twitterIcon" alt="X">
        </a>
        <a href="" target="_blank">
            <img class="bmb_login-header-social-icon" [src]="facebookIcon" alt="Facebook">
        </a>
        <a href="" target="_blank">
            <img class="bmb_login-header-social-icon" [src]="instagramIcon" alt="Instagram">
        </a>
        <a href="" target="_blank">
            <img class="bmb_login-header-social-icon" [src]="youTubeIcon" alt="Youtube">
        </a>
    </section>
  </section>

  <section class="bmb_header-mitec-mitec_logo">
    <img
      class="bmb_header-mitec-mitec_logo-animation_img"
      alt="mitec"
      [src]="mitecImage"
    />
    @if (!!headerLabel()) {
      <h2 class="bmb_header-mitec-mitec_logo-animation_text">
        {{ headerLabel() }}
      </h2>
    }
  </section>
  <section class="bmb_header-mitec-content">
    <section class="bmb_header-mitec-content-container">
      <ng-content />
    </section>
  </section>
</section>
