<section class="bmb_header-mitec">
  <section class="bmb_header-mitec-top">
    <section class="bmb_header-mitec-top-tec_logo">
      <img alt="Tecnológico de Monterrey" [src]="tecLogoImage" />
    </section>
    <section class="bmb_header-mitec-top-social">
      <bmb-navigation-bar
        [actionHeaders]="actionHeaders()"
        [iconSize]="24"
        justify="stretch"
        gapSize="m"
        alignItems="stretch"
      />
    </section>
  </section>

  <section class="bmb_header-mitec-mitec_logo">
    <bmb-mitec-logo-animation />
  </section>
  <section class="bmb_header-mitec-content">
    <section class="bmb_header-mitec-content-container">
      <ng-content />
    </section>
  </section>
</section>
