<bmb-input-validator
  type="checkbox"
  [inputId]="inputId()"
  [name]="name()"
  [checked]="isChecked()"
  [isDisabled]="disabled()"
  [control]="control()"
>
  <section class="bmb_switch-direction">
    @if (showSwitchLabel('left')) {
      <label [htmlFor]="inputId()" class="bmb_switch-label">{{
        leftText()
      }}</label>
    }
    <span class="bmb_switch">
      <input
        bmbControl
        class="bmb_switch-input"
        type="checkbox"
        [id]="inputId()"
        [formControl]="control()"
        [name]="name()"
        [checked]="isChecked()"
        [attr.aria-checked]="isChecked()"
        [attr.aria-label]="ariaLabel() || ('switch.aria_label' | translate)"
        [attr.aria-disabled]="disabled().toString()"
        [tabindex]="disabled() ? -1 : 0"
        (change)="handleChange($event)"
        (keydown)="handleKeyDown($event)"
      />
      <label [htmlFor]="inputId()" class="bmb_switch-slider">
        @if (!!getSwitchIcon()) {
          <bmb-icon
            class="bmb_switch-slider-icon"
            [icon]="getSwitchIcon()"
            [size]="20"
          />
        }
      </label>
    </span>
    @if (showSwitchLabel('right')) {
      <label [htmlFor]="inputId()" class="bmb_switch-label">{{
        rightText()
      }}</label>
    }
  </section>
</bmb-input-validator>
