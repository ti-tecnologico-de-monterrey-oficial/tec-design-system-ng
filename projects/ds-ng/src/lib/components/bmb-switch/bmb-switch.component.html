<button
  [ngClass]="{ bmb_switch: true, 'bmb_switch-checked': isChecked() }"
  (click)="toggleSwitch()"
  role="switch"
  [attr.aria-checked]="isChecked().toString()"
  [attr.id]="id()"
  [attr.aria-disabled]="disabled().toString()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
>
  @if (!!leftText() || !!leftIcon()) {
    <div class="bmb_switch-left">
      @if (!!leftText() && !leftIcon()) {
        <span class="bmb_switch-text">
          {{ leftText() }}
        </span>
      }
      @if (!!leftIcon() && !leftText()) {
        <bmb-icon [icon]="leftIcon()" />
      }
    </div>
  }
  <label class="bmb_switch-label" for="bmbSwitch">
    <span class="bmb_switch-inner"></span>
    <span class="bmb_switch-switch"></span>
  </label>
  @if (!!rightText() || !!rightIcon()) {
    <div class="bmb_switch-right">
      @if (!!rightText() && !rightIcon()) {
        <span class="bmb_switch-text">
          {{ rightText() }}
        </span>
      }
      @if (!!rightIcon() && !rightText()) {
        <bmb-icon [icon]="rightIcon()" />
      }
    </div>
  }
</button>
