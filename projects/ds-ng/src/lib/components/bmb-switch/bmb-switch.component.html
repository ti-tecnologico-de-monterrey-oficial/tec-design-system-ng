<bmb-input-validation
  type="checkbox"
  [inputId]="id()"
  [name]="name()"
  [checked]="isChecked()"
  [idDisabled]="disabled()"
  [control]="control()"
>
  <section class="bmb_switch-direction">
    @if (showSwitchLabel("left")) {
      <label class="bmb_switch-label">{{ leftText() }}</label>
    }
    <span class="bmb_switch">
      <input
        bmbControl
        class="bmb_switch-input"
        type="checkbox"
        [id]="id()"
        [formControl]="control()"
        [name]="name()"
        [checked]="isChecked()"
        [attr.aria-checked]="isChecked()"
        [attr.id]="id()"
        [attr.aria-label]="ariaLabel()"
        [attr.aria-disabled]="disabled().toString()"
        [tabindex]="disabled() ? -1 : 0"
        (change)="handleChange($event)"
        (keydown)="handleKeyDown($event)"
      />
      <span class="bmb_switch-slider">
        @if (!!getSwitchIcon()) {
          <bmb-icon
            class="bmb_switch-slider-icon"
            [icon]="getSwitchIcon()"
            [size]="20"
          />
        }
      </span>
    </span>
    @if (showSwitchLabel("right")) {
      <label class="bmb_switch-label">{{ rightText() }}</label>
    }
  </section>
</bmb-input-validation>
