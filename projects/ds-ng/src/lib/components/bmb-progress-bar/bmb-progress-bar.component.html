<section
  class="bmb_progress-bar"
  bmbLayout
  [dynamicCols]="true"
  margin="none"
  alignItems="center"
>
  @if (icon() && type() !== 'simple') {
    <bmb-icon
      class="bmb_progress-bar-icon"
      [ngClass]="
        appearance() !== 'info' ? 'bmb_progress-bar-' + appearance() : ''
      "
      icon="home"
      [size]="24"
    />
  }
  <section class="bmb_progress-bar-container" bmbVerticalLayout gapSize="s">
    @if (type() === 'container') {
      <bmb-value-counter
        [ngClass]="
          appearance() !== 'info' ? 'bmb_progress-bar-' + appearance() : ''
        "
        [label]="title()"
        [value]="totalCount().toString()"
        [progress]="counter().toString()"
        [textFormat]="textFormat()"
        bmbVerticalLayoutItem
      />
    }
    <section
      class="bmb_progress-bar-container-bar"
      bmbVerticalLayoutItem
      bmbLayout
      [dynamicCols]="true"
      margin="none"
      gapSize="s"
      alignItems="center"
      justify="spaceBetween"
    >
      <div class="bmb_progress-bar-track" bmbLayoutItem>
        <div
          class="bmb_progress-bar-active"
          [style.width.%]="progressValue()"
        ></div>
      </div>
      @if (type() !== 'simple') {
        @if (type() === 'counter') {
          <bmb-value-counter
            class="bmb_progress-bar-counter-text"
            [value]="totalCount().toString()"
            [progress]="counter().toString()"
            [textFormat]="textFormat()"
            bmbLayoutItem
          />
        } @else {
          <span class="bmb_progress-bar-counter-text" bmbLayoutItem>
            {{ progressValue() + '%' }}
          </span>
        }
      }
    </section>
    @if (type() === 'container' && appearance() === 'info' && textLink()) {
      <bmb-text-link
        [textLink]="textLink()"
        [target]="target()"
        [link]="href()"
        bmbVerticalLayoutItem
      />
    }
  </section>
</section>
