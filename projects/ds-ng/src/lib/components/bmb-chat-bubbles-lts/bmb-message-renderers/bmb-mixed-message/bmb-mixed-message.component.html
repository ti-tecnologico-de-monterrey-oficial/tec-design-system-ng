<div class="bmb-chat-bubbles-lts-mixed">
  <p class="bmb-chat-bubbles-lts-mixed-text">
    {{ message().content.text }}
  </p>

  <img
    class="bmb-chat-bubbles-lts-mixed-image"
    [src]="message().content.imageUrl"
    [attr.alt]="message().content.text || 'Message image'"
    loading="lazy"
  />
</div>
