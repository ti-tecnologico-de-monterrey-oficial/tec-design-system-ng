<section bmbLayout margin="none" gapSize="s" alignItems="center">
  <bmb-datepicker
    [label]="labelStartDate()"
    [placeholder]="placeholderStartDate()"
    [name]="name() + '_start'"
    [control]="controlStart()"
    [dateFormat]="dateFormat()"
    [disabled]="disabled()"
    [icon]="icon()"
    [isRequired]="isRequired()"
    [isClearable]="isClearable()"
    [invalidFormatErrorMessage]="invalidFormatErrorMessage()"
    [requiredFieldErrorMessage]="requiredFieldErrorMessage()"
    [disableDatesAfter]="disableDatesAfter"
    helperMessage=""
    [customValidation]="customValidation()"
    [errorMessage]="errorMessage()"
    bmbLayoutItem
    [isDynamicItem]="!multipleRow()"
    [colGrow]="1"
  />
  @if (!multipleRow()) {
    <div class="bmb_date-range-middle-dash" bmbLayoutItem></div>
  }
  <bmb-datepicker
    [label]="labelEndDate()"
    [placeholder]="placeholderEndDate()"
    [name]="name() + '_end'"
    [control]="controlEnd()"
    [dateFormat]="dateFormat()"
    [disabled]="disabled()"
    [icon]="icon()"
    [isRequired]="isRequired()"
    [isClearable]="isClearable()"
    [invalidFormatErrorMessage]="invalidFormatErrorMessage()"
    [requiredFieldErrorMessage]="requiredFieldErrorMessage()"
    [disableDatesBefore]="disableDatesBefore"
    helperMessage=""
    [customValidation]="customValidation()"
    [errorMessage]="errorMessage()"
    bmbLayoutItem
    [isDynamicItem]="!multipleRow()"
    [colGrow]="1"
  />
</section>
