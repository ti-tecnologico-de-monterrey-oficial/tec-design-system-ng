<section class="bmb_input-tags" (clickOutside)="closeDialog()">
  @if (!!label()) {
    <label class="bmb_input-tags-label" [for]="name()">
      {{ label() }}
      @if (isRequired()) {
        <small class="bmb_input-tags-label-required">*</small>
      }
      @if (!!tooltip()) {
        <bmb-tooltip
          class="bmb_input-tags-label-tooltip"
          [text]="tooltip()"
          [icon]="'help'"
          [size]="15"
        />
      }
    </label>
  }
  <div class="bmb_input-tags-wrapper">
    <bmb-input
      name="selector"
      [control]="filterControl"
      [disabled]="disabled()"
      (isFocus)="handleFocus()"
    />
    <bmb-input
      hidden
      [control]="control()"
      [name]="name()"
      [disabled]="disabled()"
      [isRequired]="isRequired()"
      (onKeyDown)="handleKeyDown($event)"
    />
    <dialog class="bmb_input-tags-dialog" [open]="showDropdown" tabindex="-1">
      <ul class="bmb_input-tags-dialog-list">
        @for (item of filteredOptions; track $index) {
          @if (checkIfIsSelected(item)) {
            <li class="bmb_input-tags-dialog-list-item">
              <button
                class="bmb_input-tags-dialog-list-item-button"
                type="button"
                (click)="handleItemClick(item)"
                (keydown)="handleItemKeyDown($event, item)"
              >
                {{ item.name }}
              </button>
            </li>
          }
        }
      </ul>
    </dialog>
  </div>
  <div class="bmb_input-tags-selected-list">
    @for (item of selectedTags; track $index) {
      <bmb-tag
        [text]="item.name"
        [dismissible]="true"
        (click)="removeTag(item)"
      />
    }
  </div>
  @if (helperMessage() && !shouldShowError) {
    <p class="bmb_input-validation-helper">
      {{ helperMessage() }}
    </p>
  }
  @if (errorMessage() && shouldShowError) {
    <p class="bmb_input-validation-error">
      {{ getErrorMessage() }}
    </p>
  }
</section>
