<bmb-input-validation
  class="bmb_input-tags"
  type="text"
  [name]="name()"
  [value]="getValidInitialValues()"
  [label]="label()!"
  [errorMessage]="errorMessage()"
  [helperMessage]="helperMessage()"
  [isRequired]="isRequired()"
  [disabled]="disabled()"
  [control]="control()"
  [showError]="shouldShowError"
  [tooltip]="tooltip()"
  [tooltipPosition]="tooltipPosition()"
  clickOutside
  (clickOutside)="closeList()"
>
  <section
    class="bmb_input-tags-container"
    [ngClass]="{
      'bmb_input-tags-container-error': shouldShowError,
      'bmb_input-tags-container-focus': isFocused(),
    }"
  >
    <input
      class="bmb_input-tags-filter"
      type="text"
      [id]="'filter' + getUUID()"
      name="filterControl"
      [formControl]="filterControl"
      [placeholder]="placeholder()"
      (click)="openList()"
      (blur)="handleValidity()"
      (keydown)="handleKeyDown($event)"
      (focus)="handleFocus($event)"
    />
    @if (!!selectedTags && selectedTags.length >= 1) {
      <div class="bmb_input-tags-selected-list" [tabIndex]="-1">
        @for (item of selectedTags; track $index) {
          <bmb-tag
            [text]="item.selectedText!"
            [dismissible]="true"
            (click)="removeTag(item)"
          />
        }
      </div>
    }
  </section>
  <input
    hidden
    type="text"
    [id]="name() + getUUID()"
    [name]="name()"
    [formControl]="getFormControl()"
  />
  <bmb-dropdown-content
    class="bmb_input-tags-dialog"
    name="list"
    [selectedOption]="getFormControl().value"
    [(items)]="filteredOptions"
    [(isOpen)]="showDropdown"
  />
</bmb-input-validation>
