<section class="bmb_field" [ngClass]="{ disabled: disabled() }">
  <label [ngClass]="getClasses('bmb_field', true)">
    @if (type() === "radio") {
      <span class="bmb_field-radio">
        <input
          type="radio"
          class="bmb_field-radio-input"
          [formControl]="getFormControl()"
          [id]="id()"
          [name]="name()"
          [attr.aria-describedby]="ariaDescribedBy()"
          [attr.aria-label]="ariaLabel()"
          [attr.aria-labelledby]="ariaLabelledBy()"
          [attr.value]="value()"
          [value]="value()"
          [checked]="checked()"
          [disabled]="disabled()"
          [required]="isRequired()"
          (change)="handleRadioChange($event)"
          (keydown)="handleRadioKeyDown($event)"
        />
        <span class="bmb_field-radio-mark"></span>
      </span>
    } @else if (type() === "checkbox") {
      <span class="bmb_field-checkbox">
        <input
          bmbControl
          class="bmb_field-checkbox-input"
          [ngClass]="{
            'bmb_field-checkbox-input-indeterminate': indeterminate(),
          }"
          type="checkbox"
          [formControl]="getFormControl()"
          [id]="id()"
          [name]="name()"
          [value]="value()"
          [attr.aria-describedby]="ariaDescribedBy()"
          [attr.aria-label]="ariaLabel()"
          [attr.aria-labelledby]="ariaLabelledBy()"
          [attr.name]="name()"
          [attr.value]="value()"
          [checked]="checked()"
          [disabled]="disabled()"
          [required]="isRequired()"
          [indeterminate]="indeterminate()"
          (onCheckedChange)="handleCheckChange($event)"
        />
        <span class="bmb_field-checkbox-mark"></span>
      </span>
    } @else if (type() === "switch") {
      <section [ngClass]="getClasses('bmb_field')">
        @if (showSwitchLabel("left")) {
          <label class="bmb_field-label bmb_field-label-switch">{{
            leftText()
          }}</label>
        }
        <span class="bmb_field-switch">
          <input
            bmbControl
            class="bmb_field-switch-input"
            type="checkbox"
            [formControl]="getFormControl()"
            [name]="name()"
            [checked]="checked()"
            [attr.aria-checked]="checked()"
            [attr.id]="id()"
            [attr.aria-disabled]="disabled()"
            [disabled]="disabled()"
            [attr.aria-label]="ariaLabel()"
            [attr.name]="name()"
            (onCheckedChange)="handleCheckChange($event)"
          />
          <span class="bmb_field-switch-slider bmb_field-switch-slider-round">
            @if (!!getSwitchIcon()) {
              <bmb-icon
                class="bmb_field-switch-slider-round-icon"
                [icon]="getSwitchIcon()"
              />
            }
          </span>
        </span>
        @if (showSwitchLabel("right")) {
          <label class="bmb_field-label bmb_field-label-switch">{{
            rightText()
          }}</label>
        }
      </section>
    }
    <span class="bmb_field-label" [ngClass]="getLabelClass('bmb_field-label')">
      {{ label() }}
      @if (isRequired() && !!label()) {
        <small class="bmb_field-label-required">*</small>
      }
      @if (!!tooltip()) {
        <bmb-tooltip
          class="bmb_field-label-tooltip"
          [text]="tooltip()"
          [align]="'below'"
          [justify]="'before'"
          [icon]="'help'"
          [size]="15"
        />
      }
      @if (type() === "text-area" && showMaxTextLength()) {
        <span class="bmb_field-label-max">
          {{ getTextLength() }}/{{ maxlength() || "-" }}
        </span>
      }
    </span>
    @if (type() !== "radio" && type() !== "checkbox" && type() !== "switch") {
      <section class="bmb_field-wrapper">
        @if (!!icon() && type() !== "text-area") {
          <bmb-icon
            [icon]="icon()"
            class="bmb_field-icon"
            [ngClass]="'bmb_field-icon-' + appearance()"
          />
        }
        @if (type() === "text-area") {
          <textarea
            bmbControl
            class="bmb_field-text-area"
            [ngClass]="inputClasses"
            [placeholder]="placeholder()"
            [disabled]="disabled()"
            [required]="isRequired()"
            [formControl]="getFormControl()"
            [maxlength]="maxlength()!"
            [minlength]="minlength()!"
            [spellcheck]="spellcheck()"
            (focus)="handleFocus()"
            (blur)="handleBlur()"
            [rows]="rows()"
            [name]="name()"
            [id]="name()"
            [value]="value()"
          ></textarea>
          @if (shouldShowError) {
            <bmb-icon class="bmb_field-text-area-error-icon" [icon]="'error'" />
          }
        } @else if (type() === "phone") {
          <mat-form-field
            class="bmb_field-input bmb_field_input_tel"
            [ngClass]="inputClasses"
            appearance="outline"
          >
            <ngx-mat-intl-tel-input
              [name]="name()"
              [required]="isRequired()"
              [disabled]="disabled()"
              [formControl]="getFormControl()"
              [preferredCountries]="['mx']"
              [enableSearch]="true"
            />
          </mat-form-field>
        } @else if (type() === "password") {
          <input
            bmbControl
            type="password"
            class="bmb_field-input"
            [ngClass]="inputClasses"
            [required]="isRequired()"
            [disabled]="disabled()"
            [placeholder]="placeholder()"
            [formControl]="getFormControl()"
            (focus)="handleFocus()"
            (blur)="handleBlur()"
            [name]="name()"
            [id]="name()"
            [maxlength]="maxlength()!"
            [minlength]="minlength()!"
            [pattern]="pattern()!"
            [value]="value()"
          />
        } @else {
          <input
            bmbControl
            [type]="type()"
            class="bmb_field-input"
            [ngClass]="inputClasses"
            [required]="isRequired()"
            [disabled]="disabled()"
            [placeholder]="placeholder()"
            [formControl]="getFormControl()"
            (focus)="handleFocus()"
            (blur)="handleBlur()"
            [name]="name()"
            [id]="name()"
            [spellcheck]="spellcheck()"
            [maxlength]="maxlength()!"
            [minlength]="minlength()!"
            [pattern]="pattern()!"
            [max]="max()"
            [min]="min()"
            [value]="value()"
          />
        }
      </section>
    }
  </label>
  @if (helperMessage() && !shouldShowError) {
    <p class="bmb_field-helper">
      {{ helperMessage() }}
    </p>
  }
  @if (errorMessage() && shouldShowError) {
    <p class="bmb_field-error">
      {{ errorMessage() }}
    </p>
  }
</section>
