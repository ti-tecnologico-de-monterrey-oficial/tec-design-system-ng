<section class="bmb_text-editor">
  <header class="bmb_text-editor-header">
    <span class="bmb_text-editor-header-group">
      <select
        id="BmbTextEditorSelect"
        class="bmb_text-editor-header-select"
        (change)="handleChange($event, 'formatBlock')"
        [title]="'text_editor.format_block' | translate"
      >
        <option value="p">{{ 'text_editor.paragraph' | translate }}</option>
        <option value="h1">{{ 'text_editor.title1' | translate }}</option>
        <option value="h2">{{ 'text_editor.title2' | translate }}</option>
        <option value="h3">{{ 'text_editor.title3' | translate }}</option>
        <option value="blockquote">
          {{ 'text_editor.appointment' | translate }}
        </option>
      </select>
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="execCommand('bold')"
        [title]="'text_editor.bold' | translate"
      >
        <bmb-icon icon="format_bold" [size]="24" />
      </button>
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="execCommand('italic')"
        [title]="'text_editor.italic' | translate"
      >
        <bmb-icon icon="format_italic" [size]="24" />
      </button>
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="execCommand('underline')"
        [title]="'text_editor.underline' | translate"
      >
        <bmb-icon icon="format_underlined" [size]="24" />
      </button>
      <input
        id="BmbTextEditorColor"
        type="color"
        (change)="handleChange($event, 'foreColor')"
        [title]="'text_editor.fore_color' | translate"
      />
    </span>

    <span class="bmb_text-editor-header-group hide-on-mobile">
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="applyAlignment('left')"
        [class.active]="currentAlignment === 'left'"
        [title]="'text_editor.left' | translate"
      >
        <bmb-icon icon="format_align_left" [size]="24" />
      </button>
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="applyAlignment('center')"
        [title]="'text_editor.center' | translate"
        [class.active]="currentAlignment === 'center'"
      >
        <bmb-icon icon="format_align_center" [size]="24" />
      </button>
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="applyAlignment('right')"
        [title]="'text_editor.right' | translate"
        [class.active]="currentAlignment === 'right'"
      >
        <bmb-icon icon="format_align_right" [size]="24" />
      </button>
    </span>

    <span class="bmb_text-editor-header-group hide-on-mobile">
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="execCommand('insertOrderedList')"
        [title]="'text_editor.insert_ordered_list' | translate"
      >
        <bmb-icon icon="format_list_numbered" [size]="24" />
      </button>
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="execCommand('insertUnorderedList')"
        [title]="'text_editor.insert_unordered_list' | translate"
      >
        <bmb-icon icon="format_list_bulleted" [size]="24" />
      </button>
    </span>

    <span class="bmb_text-editor-header-group hide-on-mobile">
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="execCommand('indent')"
        [title]="'text_editor.indent' | translate"
      >
        <bmb-icon icon="format_indent_increase" [size]="24" />
      </button>
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="execCommand('outdent')"
        [title]="'text_editor.outdent' | translate"
      >
        <bmb-icon icon="format_indent_decrease" [size]="24" />
      </button>
    </span>

    <span class="bmb_text-editor-header-group hide-on-mobile">
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="insertLink()"
        [title]="'text_editor.insert_link' | translate"
      >
        <bmb-icon icon="link" [size]="24" />
      </button>
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="insertImage()"
        [title]="'text_editor.insert_image' | translate"
      >
        <bmb-icon icon="image" [size]="24" />
      </button>
      <!-- <button bmbButton appearance="transparent" size="micro" type="button" (click)="openTableDialog()" title="Insertar tabla">
        <bmb-icon icon="table_chart" [size]="24"/>
      </button> -->
    </span>

    <span class="bmb_text-editor-header-group">
      <button
        bmbButton
        appearance="transparent"
        size="micro"
        type="button"
        (click)="clearFormatting()"
        [title]="'text_editor.clear_formatting' | translate"
      >
        <bmb-icon icon="format_clear" [size]="24" />
      </button>
    </span>

    <span class="bmb_text-editor-header-actions">
      <bmb-action-icon
        icon="more_horiz"
        [iconSize]="24"
        (buttonClick)="handleMoreDialog($event)"
      />

      <bmb-action-icon
        icon="add_circle"
        [iconSize]="24"
        (buttonClick)="handleInsertDialog($event)"
      />
    </span>
  </header>

  <div
    class="bmb_text-editor-content"
    #editor
    contenteditable="true"
    (input)="updateContent()"
    [innerHTML]="sanitizedContent"
  ></div>
</section>

<!-- Diálogo para definir filas y columnas -->
<dialog class="dialog-overlay" [open]="showTableDialog">
  <div class="dialog">
    <h3>Insertar tabla</h3>
    <label for="rows">Filas:</label>
    <input type="number" id="rows" min="1" max="10" />

    <label for="columns">Columnas:</label>
    <input type="number" id="columns" min="1" max="10" />

    <div class="dialog-buttons">
      <button type="button" (click)="insertTable()">Insertar</button>
      <button type="button" (click)="closeTableDialog()">Cancelar</button>
    </div>
  </div>
</dialog>

<ng-template #moreTemplate>
  <section>
    <bmb-action-menu
      [showHeader]="false"
      [title]="'text_editor.select_option' | translate"
    >
      @for (bot of settingsItems(); track $index) {
        <ng-template>
          <bmb-item
            [icon]="bot.icon"
            [label]="bot.name"
            [isButton]="true"
            (action)="bot.action()"
          />
        </ng-template>
      }
    </bmb-action-menu>
  </section>
</ng-template>

<ng-template #insertTemplate>
  <section>
    <bmb-action-menu
      [showHeader]="false"
      [title]="'text_editor.select_option' | translate"
    >
      @for (bot of insertItems(); track $index) {
        <ng-template>
          <bmb-item
            [icon]="bot.icon"
            [label]="bot.name"
            [isButton]="true"
            (action)="bot.action()"
          />
        </ng-template>
      }
    </bmb-action-menu>
  </section>
</ng-template>
