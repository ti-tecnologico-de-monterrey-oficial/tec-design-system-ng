<bmb-container-button-base [isDisable]="isDisable()" [isError]="isError()">
  <ng-template #bmbContainerLeft>
    <bmb-grade-value [score]="score()" />
  </ng-template>
  <ng-template #bmbContainerMain>
    <bmb-title [componentTitle]="componentTitle()" [subtitle]="subtitle()" />
  </ng-template>
  <ng-template #bmbContainerRight>
    <bmb-icon icon="chevron_forward" [size]="24" />
  </ng-template>
</bmb-container-button-base>
