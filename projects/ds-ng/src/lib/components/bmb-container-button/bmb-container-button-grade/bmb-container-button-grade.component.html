<bmb-container-button-base
  class="bmb_container-button-grade"
  [isDisabled]="isDisabled()"
  [isError]="isError()"
  (getClickButton)="handleClick($event)"
>
  <ng-template #bmbContainerLeft>
    <bmb-grade-value
      class="bmb_container-button-grade-score"
      [score]="score()"
    />
  </ng-template>
  <ng-template #bmbContainerMain>
    <bmb-title [componentTitle]="componentTitle()" [subtitle]="subtitle()" />
  </ng-template>
  <ng-template #bmbContainerRight>
    <bmb-icon
      [icon]="rightIconName()"
      [size]="24"
      [alt]="iconImageAlt() || rightIconName()"
    />
  </ng-template>
</bmb-container-button-base>
