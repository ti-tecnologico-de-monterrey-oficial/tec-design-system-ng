<bmb-check-external-link-button
  class="bmb_container-button"
  [ngClass]="getClassList()"
  [link]="link()"
  [target]="target()"
  (buttonClick)="handleClick($event)"
>
  <section
    bmbLayout
    [dynamicCols]="true"
    margin="none"
    alignItems="center"
    justify="spaceBetween"
    class="bmb_container-button-content"
  >
    <section class="bmb_container-button-left">
      @if ((iconLeft() && !score()) || square() || small()) {
        <bmb-icon
          bmbLayoutItem
          class="bmb_container-button-left-icon"
          [icon]="iconLeft()"
        />
      }
      @if (score() && !square() && !small()) {
        <bmb-grade-value bmbLayoutItem type="main-grade" [score]="getScore()" />
      }
      <div class="bmb_container-button-header">
        <h2 class="bmb_container-button-title">{{ title() }}</h2>
        @if (subtitle() && !square() && !small()) {
          <h4 class="bmb_container-button-subtitle">
            {{ subtitle() }}
          </h4>
        }
      </div>
    </section>
    <section class="bmb_container-button-right">
      @if (badgeText() && !square() && !small()) {
        <bmb-badge
          [text]="badgeText()"
          [appearance]="badgeAppearance()"
          class="bmb_container-button-badge"
        />
      }
      @if (iconRight() && !square() && !small()) {
        <bmb-icon
          class="bmb_container-button-right-icon"
          [icon]="iconRight()"
        />
      }
    </section>
  </section>
</bmb-check-external-link-button>
