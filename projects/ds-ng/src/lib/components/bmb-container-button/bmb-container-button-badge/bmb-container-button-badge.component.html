<bmb-container-button-base
  [isDisabled]="isDisabled()"
  [isError]="isError()"
  (getClickButton)="handleClick($event)"
>
  <ng-template #bmbContainerLeft>
    <bmb-icon
      [icon]="leftIconName()"
      [isFill]="true"
      [size]="24"
      [alt]="iconImageAlt() || leftIconName()"
    />
  </ng-template>

  <ng-template #bmbContainerMain>
    <bmb-title [componentTitle]="componentTitle()" [subtitle]="subtitle()" />
  </ng-template>

  <ng-template #bmbContainerRight>
    <bmb-badge
      [appearance]="badge().appearance"
      [text]="badge().text"
      [container]="badge().container!"
    />
  </ng-template>
  <ng-template #bmbContainerRight>
    <bmb-icon
      [icon]="rightIconName()"
      [size]="24"
      [alt]="rightIconImageAlt() || rightIconName()"
    />
  </ng-template>
</bmb-container-button-base>
