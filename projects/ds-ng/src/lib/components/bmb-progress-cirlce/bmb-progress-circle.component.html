<section class="bmb_progress-circle-container">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    onkeypress=""
    class="bmb_progress-circle"
    [attr.viewBox]="svg?.viewBox"
    preserveAspectRatio="xMidYMid meet"
    [attr.height]="svg?.height"
    [attr.width]="svg?.width"
  >
    <circle
      class="bmb_progress-circle-fill"
      [ngClass]="getFillPathStatus()"
      [attr.cx]="svg?.circle?.cx"
      [attr.cy]="svg?.circle?.cy"
      [attr.r]="svg?.circle?.r"
      [attr.stroke-width]="svg?.circle?.strokeWidth"
    />
    @if (shouldShowProgressPath()) {
      @if (percent() === 100) {
        <circle
          class="bmb_progress-circle-track-fill"
          [ngClass]="getFillPathStatus()"
          [attr.cx]="svg?.circle?.cx"
          [attr.cy]="svg?.circle?.cy"
          [attr.r]="svg?.circle?.r"
          [attr.stroke-width]="svg?.circle?.strokeWidth"
        />
      } @else {
        <path
          class="bmb_progress-circle-track"
          [attr.d]="svg?.path?.d"
          [attr.stroke-width]="svg?.path?.strokeWidth"
          [attr.fill]="svg?.path?.fill"
        />
      }
    }
  </svg>
  @if (options().showTitle || options().showValueLabel) {
    <div class="bmb_progress-circle-text-container">
      <p class="bmb_progress-circle-text-content bmb_progress-circle-background">
        @if (options().showTitle) {
          <h2 class="bmb_progress-circle-title-container">
            @if (isTitleString()) {
              <span class="bmb_progress-circle-title">
                {{ title() }}
              </span>
            } @else {
              @for (segment of title(); track $index) {
                <span
                  class="bmb_progress-circle-title"
                >
                  {{ segment }}
                </span>
              }
            }
          </h2>
        }

        @if (shouldShowValueLabel()) {
          <p class="bmb_progress-circle-value-label">
            <span class="bmb_progress-circle-value-label-text">
              {{ valueLabel() }}
            </span>
          </p>
        }
      </p>
    </div>
  }
</section>
