<span
  #tooltipContainer
  class="bmb_tooltip-container"
  (mouseenter)="showTooltip()"
  (mouseleave)="hideTooltip()"
  (focusin)="showTooltip()"
  (focusout)="hideTooltip()"
  (mousedown)="showTooltip()"
  (mouseup)="hideTooltip()"
  (touchstart)="showTooltip()"
  (touchend)="hideTooltip()"
>
  @if (icon() && size()) {
    <bmb-action-icon
      idElement="tooltip_element"
      [iconSize]="size()"
      [icon]="icon()"
      [isFill]="isFill()"
      [alt]="componentTitle() || title() || 'Tooltip icon'"
      aria-describedby="tooltip-icon"
    />
  } @else {
    <ng-content />
  }

  <dialog
    [open]="isTooltipVisible()"
    class="bmb_tooltip-dialog"
    aria-hidden="true"
    [ngStyle]="dialogStyles()"
  >
    <section
      id="tooltip-content"
      class="bmb_tooltip"
      aria-describedby="tooltip-content"
      bmbVerticalLayout
      gapSize="s"
    >
      @if (componentTitle() || title()) {
        <span bmbVerticalLayoutItem margin="none" [rowGrow]="1">
          {{ componentTitle() || title() }}
        </span>
      }
      <span bmbVerticalLayoutItem margin="none" [rowGrow]="1">
        {{
          text()
        }}
      </span>
    </section>
  </dialog>
</span>
