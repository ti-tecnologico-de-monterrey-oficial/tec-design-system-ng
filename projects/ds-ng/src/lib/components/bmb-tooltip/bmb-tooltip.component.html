@if (icon() && size()) {
  <bmb-action-icon
    idElement="tooltip_element"
    [iconSize]="size()"
    [icon]="icon()"
    [isFill]="isFill()"
    [alt]="componentTitle() || title() || 'Tooltip icon'"
    aria-describedby="tooltip-icon"
    (buttonClick)="showTooltip($event)"
  />
} @else {
  <ng-content />
}

<ng-template #contentTooltip>
  <div>
    <section
      id="tooltip-content"
      class="bmb_tooltip"
      aria-describedby="tooltip-content"
      bmbVerticalLayout
      gapSize="s"
    >
      @if (componentTitle() || title()) {
        <span bmbVerticalLayoutItem margin="none" [rowGrow]="1">
          {{ componentTitle() || title() }}
        </span>
      }
      <span bmbVerticalLayoutItem margin="none" [rowGrow]="1">
        {{
          'Lorem ipsum dolor sit amet consectetur adipisicing elit. Rerum nihil modi repellendus ad aspernatur corporis.'
        }}
      </span>
    </section>
  </div>
</ng-template>
