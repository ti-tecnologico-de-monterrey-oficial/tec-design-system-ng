<section class="bmb_tooltip">
  @if (icon() && size()) {
    <bmb-icon
      class="bmb_tooltip-icon"
      [size]="size()"
      [icon]="icon()"
      [isFill]="isFill()"
      [alt]="title() || 'Tooltip icon'"
      [tabIndex]="0"
      role="button"
      aria-haspopup="true"
      [attr.aria-expanded]="isTooltipVisible()"
      aria-describedby="tooltip-content"
      (focus)="handleFocus($event)"
      (blur)="handleFocus($event)"
      (keydown)="handleFocus($event)"
    />
  } @else {
    <ng-content></ng-content>
  }

  @if (isTooltipVisible()) {
    <section
      id="tooltip-content"
      role="tooltip"
      class="bmb_tooltip-container"
      [ngClass]="getClasses()"
      [attr.aria-hidden]="!isTooltipVisible()"
    >
      @if (title()) {
        <section class="bmb_tooltip-container-title">
          <span class="bmb_tooltip-container-title-text">{{ title() }}</span>
        </section>
      }
      <section class="bmb_tooltip-container-description">
        <span class="bmb_tooltip-container-description-text">{{ text() }}</span>
      </section>
    </section>
  }
</section>
