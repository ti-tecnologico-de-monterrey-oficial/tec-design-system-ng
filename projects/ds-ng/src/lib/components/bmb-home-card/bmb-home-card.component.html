<section class="bmb_home-card">
  <span class="bmb_home-card">
    <bmb-home-card-header
      [title]="title()"
      [subtitle]="subtitle()"
      [dataLocalNav]="dataLocalNav()"
      [leftIcon]="leftIcon()"
      [icon]="icon()"
      [iconSize]="iconSize()"
      [bgIconAppearance]="bgIconAppearance()"
      [actionHeaders]="actionHeaders()"
      [showRightButton]="showRightButton()"
      [isMobile]="isMobile()"
      (onClose)="handleClose()"
      (onBack)="handleBack()"
    />
  </span>
  <section
    class="bmb_home-card-container"
    [ngClass]="'bmb_padding-' + contentPadding()"
  >
    <ng-content />
  </section>
</section>
