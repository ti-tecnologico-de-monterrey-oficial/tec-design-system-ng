<section class="bmb_home-card">
  <div class="bmb_home-card-wrapper">
    <bmb-home-card-header
      [componentTitle]="componentTitle() || title() || ''"
      [subtitle]="subtitle()"
      [dataLocalNav]="dataLocalNav()"
      [leftIcon]="leftIcon()"
      [icon]="icon()"
      [iconSize]="iconSize()"
      [bgIconAppearance]="bgIconAppearance()"
      [isChat]="isChat()"
      [actionsList]="actionsList()"
      [actionHeaders]="actionHeaders()"
      [showRightButton]="showRightButton()"
      [isMobile]="isMobile()"
      [(isExpanded)]="isExpanded"
      [useAutoExpand]="useAutoExpand()"
      (onClose)="handleClose()"
      (onBack)="handleBack()"
      (onExpandClick)="handleExpand()"
    />
    <section
      class="bmb_home-card-container"
      [ngClass]="'bmb_padding-' + contentPadding()"
    >
      <ng-content />
    </section>
  </div>
</section>
