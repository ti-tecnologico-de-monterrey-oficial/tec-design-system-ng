<header class="bmb_home-card-header">
  <bmb-container>
    <span class="bmb_home-card-header-container">
      <bmb-three-cols [expandMainColumn]="true">
        <ng-template #bmbLeftContent>
          @if (isExpanded && !!leftIcon()) {
            <bmb-navigation-icon
              [icon]="leftIcon()!"
              [iconSize]="24"
              (buttonClick)="handleBack()"
            />
          }
        </ng-template>
        <ng-template #bmbMainContent>
          <bmb-title-content
            [title]="title()"
            [subtitle]="subtitle()"
            [icon]="getIconName()"
            [iconSize]="iconSize()!"
            [bgIconAppearance]="bgIconAppearance()"
            [dataLocalNav]="getDataLocalNav()"
          />
        </ng-template>
        <ng-template #bmbRightContent>
          <bmb-navigation-bar [actionHeaders]="actionHeaderList" />
        </ng-template>
      </bmb-three-cols>
    </span>
  </bmb-container>
</header>
