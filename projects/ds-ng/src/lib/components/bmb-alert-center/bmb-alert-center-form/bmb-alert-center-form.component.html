<form
  class="bmb_alert-center-form"
  [formGroup]="alertSelectionForm"
  (ngSubmit)="onSubmit($event)"
>
  <section class="bmb_alert-center-form-content">
    @if (filteredEvents().recent.length) {
      <h3 class="bmb_alert-center-form-title">Recientes</h3>
      <bmb-alert-center-list
        (alertSelected)="alertSelected($event)"
        (selectedAlert)="handleSelection($event)"
        [alerts]="filteredEvents().recent"
        [enableMultipleSelection]="enableMultipleSelection()"
      />
    }
    @if (filteredEvents().sevenDays.length) {
      <h3 class="bmb_alert-center-form-title">Últimos 7 días</h3>
      <bmb-alert-center-list
        (alertSelected)="alertSelected($event)"
        (selectedAlert)="handleSelection($event)"
        [alerts]="filteredEvents().sevenDays"
        [enableMultipleSelection]="enableMultipleSelection()"
      />
    }
    @if (filteredEvents().month.length) {
      <h3 class="bmb_alert-center-form-title">Últimos 30 días</h3>
      <bmb-alert-center-list
        (alertSelected)="alertSelected($event)"
        (selectedAlert)="handleSelection($event)"
        [alerts]="filteredEvents().month"
        [enableMultipleSelection]="enableMultipleSelection()"
      />
    }
    @if (filteredEvents().rest.length) {
      <h3 class="bmb_alert-center-form-title">Restantes</h3>
      <bmb-alert-center-list
        (alertSelected)="alertSelected($event)"
        (selectedAlert)="handleSelection($event)"
        [alerts]="filteredEvents().rest"
        [enableMultipleSelection]="enableMultipleSelection()"
      />
    }
  </section>
  <footer [ngClass]="getFooterClassList()">
    <bmb-bottom-navigation-bar
      class="bmb_alert-center-footer"
      [navigationBarIcons]="navigationBarIcons"
    />
  </footer>
</form>
