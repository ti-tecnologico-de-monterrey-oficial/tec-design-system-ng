<section
  [id]="accordionId()"
  class="bmb_accordion"
  [ngClass]="getClassesAccordion()"
  [class.bmb_accordion-primary]="appearance() === 'primary'"
  [class.bmb_accordion-alternative]="appearance() === 'alternative'"
  [ngStyle]="getStyles()"
>
  @if (disabled()) {
    <section class="bmb_accordion-overlay"></section>
  }
  <header
    [ngClass]="getClassesHeader()"
    (click)="toggle($event)"
    bmbLayout
    margin="none"
    alignItems="center"
    justify="spaceBetween"
  >
    <div bmbLayoutItem margin="none" [isDynamicItem]="true" [colGrow]="1">
      <ng-container [ngTemplateOutlet]="bmbAccordionHeader" />
    </div>
    <div bmbLayoutItem margin="none" [isDynamicItem]="true">
      @if (icon()) {
        <bmb-icon [icon]="icon()" />
      } @else if (!hideToggle()) {
        <bmb-icon [icon]="getIconToggle()" />
      }
    </div>
  </header>
  @if (!disabled()) {
    <section
      [class]="getClassesContent()"
      [ngClass]="{
        'bmb_accordion-content-open': this._expanded(),
      }"
    >
      <ng-container [ngTemplateOutlet]="bmbAccordionContent" />
    </section>
  }
</section>
