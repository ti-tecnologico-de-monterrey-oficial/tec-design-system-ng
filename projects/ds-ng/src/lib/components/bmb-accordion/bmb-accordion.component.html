<section
  [id]="accordionId()"
  class="bmb_accordion"
  [ngClass]="getClassesAccordion()"
  [ngStyle]="getStyles()"
>
  @if (disabled()) {
    <section class="bmb_accordion-overlay"></section>
  }
  <header [ngClass]="getClassesHeader()" (click)="toggle()">
    <ng-container [ngTemplateOutlet]="bmbAccordionHeader" />
    @if (icon()) {
      <bmb-icon [icon]="icon()" />
    } @else if (!hideToggle()) {
      <bmb-icon [icon]="getIconToggle()" />
    }
  </header>
  @if (!disabled()) {
    <section
      [class]="getClassesContent()"
      [ngClass]="{
        'bmb_accordion-content-open': this._expanded(),
      }"
    >
      <ng-container [ngTemplateOutlet]="bmbAccordionContent" />
    </section>
  }
</section>
