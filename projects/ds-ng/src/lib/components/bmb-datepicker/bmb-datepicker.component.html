<div class="bmb_datepicker" clickOutside (clickOutside)="clickOutside()">
  <section class="bmb-datepicker-container">
    <!-- @if (inline()) {
      <bmb-datepicker-modal
        [now]="now"
        [isWindowOpen]="isWindowOpen"
        (closeWindow)="handleWindowOpen($event)"
        (onValueChange)="handleValueChange($event)"
        [value]="control().value"
        [dateFormat]="dateFormat()"
        [stepYearPicker]="stepYearPicker()"
        [disableDatesBefore]="disableDatesBefore()"
        [disableDatesAfter]="disableDatesAfter()"
        [lang]="lang()"
      />
    } @else { -->
    <bmb-input
      [placeholder]="placeholder()"
      [label]="label()"
      [icon]="icon()"
      [isRequired]="isRequired()"
      [disabled]="disabled()"
      [appearance]="appearance()"
      [control]="control()"
      [isRequired]="isRequired()"
      [helperMessage]="helperMessage()"
      [errorMessage]="{
        required: requiredFieldErrorMessage(),
        customValidation: invalidFormatErrorMessage(),
      }"
      [isCustomError]="true"
      [customValidation]="customValidatorDate()"
      [name]="name()"
      [isClearable]="isClearable()"
      [value]="value()"
      (onKeyDown)="handleFocusedEvent($event)"
      (click)="handleFocusedEvent($event)"
    >
      @if (isWindowOpen) {
        <ng-template #customInputContent>
          <bmb-datepicker-modal
            [now]="now"
            [isWindowOpen]="isWindowOpen"
            (closeWindow)="handleWindowOpen($event)"
            (onValueChange)="handleValueChange($event)"
            [value]="control().valid && control().value"
            [dateFormat]="dateFormat()"
            [stepYearPicker]="stepYearPicker()"
            [disableDatesBefore]="convertToDate(disableDatesBefore())"
            [disableDatesAfter]="convertToDate(disableDatesAfter())"
            [lang]="lang()"
          />
        </ng-template>
      }
    </bmb-input>
    <!-- } -->
  </section>
</div>
