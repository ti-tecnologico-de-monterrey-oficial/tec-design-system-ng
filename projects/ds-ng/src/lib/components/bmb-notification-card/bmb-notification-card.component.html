<section class="bmb_home-notification-card">
  <bmb-home-card
    leftIcon="chevron_left"
    icon="notifications"
    bgIconAppearance="red-primary"
    title="Mis Notificaciones"
    [isMobile]="false"
  >
    <bmb-tabs [tabs]="tabs" (selected)="setActiveTab($event)" />
    <div class="bmb_home-notification-card-content">
      @switch (activeTab) {
        @case (1) {
          <bmb-alert-center
            [alerts]="data()"
            [isSmall]="true"
          />
        }
        @case (2) {
          <div>test</div>
        }
      }
    </div>
  </bmb-home-card>
</section>
