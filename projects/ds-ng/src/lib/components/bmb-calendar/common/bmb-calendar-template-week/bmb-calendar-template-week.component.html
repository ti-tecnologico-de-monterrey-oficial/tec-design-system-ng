<div class="bmb_calendar-week-view">
  <bmb-calendar-hour-view [startBusinessHour]="startBusinessHour()" />
  @for (day of dayNames; track $index; let i = $index) {
    <section
      class="bmb_calendar-col"
      [ngClass]="{ 'bmb_calendar-col-today': isNow(weekDays()[i]) }"
    >
      <header class="bmb_calendar-detail-header">
        <h2>{{ day }}</h2>
        <span>{{ weekDays()[i].month }}/{{ weekDays()[i].day }}</span>
      </header>
      <div class="bmb_calendar-body">
        @for (row of rows; track $index) {
          <div class="bmb_calendar-row-body"></div>
        }

        @for (singleEvent of eventsOnWeek()[i]; track $index) {
          <bmb-calendar-schedule-cards
            [event]="singleEvent"
            (onSelectEvent)="handleEventSelection($event)"
          />
        }
      </div>
    </section>
  }
  <bmb-calendar-time-indicator [currentTime]="currentTime()" />
</div>
