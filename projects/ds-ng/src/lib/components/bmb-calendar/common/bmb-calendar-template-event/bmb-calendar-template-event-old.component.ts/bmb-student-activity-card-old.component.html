<div class="bmb_student-activity-card-old">
  <header [ngClass]="getHeaderClasses()">
    <span class="bmb_student-activity-card-old-count">{{
      startDate()?.toFormat("dd/MM")
    }}</span>
    <span class="bmb_student-activity-card-old-title">{{ modalTitle() }}</span>
    <button
      (click)="handleCloseModal()"
      class="bmb_student-activity-card-old-close-button"
    >
      <bmb-icon icon="close" />
    </button>
  </header>
  <section class="bmb_student-activity-card-old-content">
    <div class="bmb_student-activity-card-old-title">{{ title() }}</div>
    <div class="bmb_student-activity-card-old-detail">{{ detail() }}</div>
    <div class="bmb_student-activity-card-old-status">
      <span class="bmb_student-activity-card-old-status-label">{{ status() }}</span>
      <span class="bmb_student-activity-card-old-time-range">{{
        formatDateRange()
      }}</span>
    </div>
  </section>
</div>
