<ul class="bmb-calendar-template-event-list">
  @for (item of monthsWithEvents; track $index) {
    <li class="bmb-calendar-template-event-list-item">
      <bmb-container-button
        [title]="monthsNames[$index]"
        [subtitle]="getSubtitle(item)"
        [iconRight]="'chevron_right'"
        (onButton)="handleDateChange($index)"
      ></bmb-container-button>
    </li>
  }
</ul>
