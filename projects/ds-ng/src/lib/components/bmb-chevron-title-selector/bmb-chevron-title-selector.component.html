<section class="bmb_chevron">
  <bmb-three-cols>
    <ng-template #bmbLeftContent>
      @if (!!leadingIcon()) {
        <span class="bmb_chevron-button">
          <bmb-navigation-icon
            [icon]="leadingIcon()"
            [iconSize]="24"
            (buttonClick)="handleLeadingClick($event)"
          />
        </span>
      }
    </ng-template>
    <ng-template #bmbMainContent>
      <bmb-title-content
        [title]="title()"
        titleSize="4"
        titleFontWeight="300"
        [subtitle]="subtitle()"
        subtitleSize="4"
        subtitleFontWeight="300"
        [subtitleIcon]="iconSubtitle()"
        [transparentBgC]="true"
      />
    </ng-template>
    <ng-template #bmbRightContent>
      @if (trailingIcon()) {
        <span class="bmb_chevron-button">
          <bmb-navigation-icon
            [icon]="trailingIcon()"
            [iconSize]="24"
            (buttonClick)="handleTrailingClick($event)"
          />
        </span>
      }
    </ng-template>
  </bmb-three-cols>
</section>
