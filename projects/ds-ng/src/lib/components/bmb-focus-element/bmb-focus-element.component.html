<section class="bmb_focus-element">
  <section [ngClass]="getCircleClass()">
    @if (icon()) {
      <bmb-icon
        class="bmb_focus-element-icon"
        [ngClass]="{
          'bmb_focus-element-icon-focused': !isNonFocused() && !isNormal(),
        }"
        [icon]="icon()"
        [size]="24"
        alt="Focus element icon"
      />
    } @else if (number()) {
      <span
        class="bmb_focus-element-number"
        [ngClass]="{
          'bmb_focus-element-number-focused': !isNonFocused() && !isNormal(),
        }"
      >
        {{ number() }}
      </span>
    }
  </section>
  @if (title()) {
    <h5 class="bmb_focus-element-title">{{ title() }}</h5>
  }
</section>
