<ng-template #student>
  <section class="bmb_profile-info">
    <bmb-icon-item
      icon="calendar_month"
      label="Semestre"
      [value]="_studentData.period"
    />
    <bmb-divider />
    <bmb-icon-item
      icon="location_on"
      label="Campus"
      [value]="_studentData.campus"
    />
    <bmb-divider />
    <bmb-icon-item
      icon="library_books"
      label="Programa"
      [value]="_studentData.program"
    />
    <bmb-divider />
  </section>
</ng-template>

<ng-template #collaborator>
  <section class="bmb_profile-info">
    <bmb-icon-item
      icon="id_card"
      label="Puesto"
      [value]="collaboratorData()?.position!"
    />
    <bmb-divider />
    <bmb-icon-item
      icon="location_on"
      label="Área"
      [value]="collaboratorData()?.area!"
    />
  </section>
  <section class="bmb_profile-access">
    <h2 class="bmb_profile-title">Mi Líder</h2>
    <bmb-container-button
      [title]="collaboratorData()?.leader?.userData?.name!"
      [subtitle]="collaboratorData()?.leader?.userData?.email!"
      [iconLeft]="collaboratorData()?.leader?.userData?.userImg!"
      [isUserImage]="true"
      [link]="collaboratorData()?.leader?.hierarchyLink!"
      [target]="collaboratorData()?.leader?.hierarchyTarget!"
      (onButton)="handleButtonClick(collaboratorData()?.leader?.userData)"
    />
    <h2 class="bmb_profile-title">Mi Generalista</h2>
    <bmb-container-button
      [title]="collaboratorData()?.generalist?.userData?.name!"
      [subtitle]="collaboratorData()?.generalist?.userData?.email!"
      [iconLeft]="collaboratorData()?.generalist?.userData?.userImg!"
      [isUserImage]="true"
      [link]="collaboratorData()?.generalist?.hierarchyLink!"
      [target]="collaboratorData()?.generalist?.hierarchyTarget!"
      (onButton)="handleButtonClick(collaboratorData()?.generalist?.userData)"
    />
  </section>
</ng-template>

<ng-template #content>
  <section class="bmb_profile">
    <bmb-user-summary-content
      [isProfile]="true"
      [name]="getUserData().name!"
      [userId]="getUserData().registration!"
      [image]="getUserData().userImg"
      [email]="getUserData().email"
      contentLayout="row"
      [isImageBordered]="false"
    />
    @if (!isStandAlone()) {
      @if (isStudent()) {
        <ng-container [ngTemplateOutlet]="student" />
      } @else {
        <ng-container [ngTemplateOutlet]="collaborator" />
      }
    }
    <section class="bmb_profile-info-container theme">
      <div class="bmb_profile-info-container-item">
        <bmb-icon [icon]="'palette'" [size]="24" />
        <span class="bmb_profile-info-container-item-text">Tema</span>
      </div>
      <bmb-theme leftText="Light" rightText="Dark" />
    </section>
    @if (isMobile() && !isStandAlone()) {
      <section class="bmb_profile-access">
        <bmb-container-button
          title="ID Digital"
          iconLeft="person"
          iconRight="chevron_right"
          [link]="idDigitalLink()"
          [target]="targetLinks()!"
        />
        <bmb-container-button
          title="Acceso a Campus"
          iconLeft="qr_code"
          iconRight="chevron_right"
          [link]="campusAcessLink()"
          [target]="targetLinks()!"
        />
        <bmb-container-button
          title="TecServices"
          iconLeft="forum"
          iconRight="chevron_right"
          [link]="tecServicesLink()"
          [target]="targetLinks()!"
        />
      </section>
      <div class="bmb_profile-version">
        {{ versionLabel() }}
      </div>
    }
    <section class="bmb_profile-close">
      <button
        bmbButton
        appearance="destructive"
        icon="logout"
        size="large"
        position="left"
        (click)="closeSession()"
      >
        Cerrar Sesión
      </button>
    </section>
  </section>
</ng-template>

@if (isStandAlone()) {
  <section class="bmb_profile-stand_alone">
    <ng-container [ngTemplateOutlet]="content" />
  </section>
} @else if (isMobile()) {
  <bmb-mobile-templates
    [title]="'Mi Perfil'"
    (externalLinkOnClose)="closeProfile()"
  >
    <ng-template #bmbTemplateMain>
      <ng-container [ngTemplateOutlet]="content" />
    </ng-template>
  </bmb-mobile-templates>
} @else {
  <bmb-home-card
    icon="person"
    bgIconAppearance="green-light"
    title="Mi perfil"
    [showRightButton]="false"
    contentPadding="l"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </bmb-home-card>
}
