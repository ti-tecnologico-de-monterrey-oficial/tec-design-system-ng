<ng-template #elementTemplate let-element="element">
  <section class="bmb_profile-info-container">
    <div class="bmb_profile-info-container-item">
      <bmb-icon [icon]="element.icon" [size]="24" />
      <span class="bmb_profile-info-container-item-text">{{
        element.content
      }}</span>
    </div>
    <span class="bmb_profile-info-container-value">
      {{ element.value }}
    </span>
  </section>
</ng-template>

<bmb-mobile-templates
  [title]="'Mi Perfil'"
  (externalLinkOnClose)="closeProfile()"
>
  <ng-template #bmbTemplateMain>
    <section class="bmb_profile">
      <bmb-user-summary-content
        [isProfile]="true"
        [name]="userData().name"
        [userId]="userData().matricula"
        [image]="userData().userImg"
        [email]="userData().mail"
        contentLayout="row"
        [isImageBordered]="false"
      />
      <section class="bmb_profile-info">
        <ng-container
          *ngTemplateOutlet="
            elementTemplate;
            context: {
              element: {
                icon: 'calendar_month',
                content: 'Semestre',
                value: userData().period,
              },
            }
          "
        />
        <ng-container
          *ngTemplateOutlet="
            elementTemplate;
            context: {
              element: {
                icon: 'location_on',
                content: 'Campus',
                value: userData().campus,
              },
            }
          "
        />
        <ng-container
          *ngTemplateOutlet="
            elementTemplate;
            context: {
              element: {
                icon: 'library_books',
                content: 'Programa',
                value: userData().program,
              },
            }
          "
        />
        <section class="bmb_profile-info-container theme">
          <div class="bmb_profile-info-container-item">
            <bmb-icon [icon]="'palette'" [size]="24" />
            <span class="bmb_profile-info-container-item-text">Tema</span>
          </div>
          <bmb-theme [initialTheme]="'light'" />
        </section>
      </section>
      <section class="bmb_profile-access">
        <bmb-container-button
          [title]="'ID Digital'"
          [iconLeft]="'person'"
          [iconRight]="'chevron_right'"
          [link]="idDigitalLink()"
          [target]="targetLinks()!"
        />
        <bmb-container-button
          [title]="'Acceso a Campus'"
          [iconLeft]="'qr_code'"
          [iconRight]="'chevron_right'"
          [link]="campusAcessLink()"
          [target]="targetLinks()!"
        />
      </section>
      <section class="bmb_profile-close">
        <button
          bmbButton
          appearance="destructive"
          icon="logout"
          size="large"
          position="left"
          (click)="closeSession()"
        >
          Cerrar Sesión
        </button>
      </section>
    </section>
  </ng-template>
</bmb-mobile-templates>
