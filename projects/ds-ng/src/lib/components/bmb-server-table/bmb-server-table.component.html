<div class="table-container">
  <div class="spinner-overlay" *ngIf="loading">
    <mat-spinner></mat-spinner>
  </div>

  <ng-container *ngIf="displayedColumns.length > 0; else noColumns">
    <table mat-table [dataSource]="data" class="mat-elevation-z8">
      <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
        <td mat-cell *matCellDef="let element">{{ element[column.key] }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        [class.selected-row]="isSelected(row)"
        (click)="onRowClick(row)"
      ></tr>
    </table>

    <mat-paginator
      [length]="totalRecords"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions || []"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </ng-container>

  <!-- Sin columnas definidas -->
  <ng-template #noColumns>
    <div class="no-columns-message">
      <p>No se han definido columnas para la tabla.</p>
    </div>
  </ng-template>
</div>
