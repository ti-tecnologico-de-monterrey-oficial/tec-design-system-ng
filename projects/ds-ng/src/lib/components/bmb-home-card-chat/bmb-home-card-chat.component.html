<ng-template #chatContent>
  <section class="bmb_chat-card">
    <bmb-home-card
      [leftIcon]="mode() === 'chat' ? undefined : leftIcon()"
      [componentTitle]="componentTitle() || title() || ('home_card_chat.title' | translate)"
      [subtitle]="subtitle() || ('home_card_chat.subtitle' | translate)"
      [icon]="icon()"
      [isMobile]="isMobile()"
      (onClose)="handleClose()"
      [actionHeaders]="chatActionHeaders()"
      [actionsList]="actionsList()"
      [isChat]="mode() === 'chat'"
      (onBack)="handleBack()"
      [bgIconAppearance]="bgIconAppearance()"
      [contentPadding]="'xs'"
    >
      <div class="bmb_chat-card-container">
        @for (message of messagesHistory(); track $index) {
          <bmb-chat-bubble [message]="message" />
        }
      </div>
      <div class="bmb_chat-card-chatBar">
        <bmb-chat-bar
          [placeholder]="placeholder()"
          [botList]="botList()"
          [(currentBot)]="currentBot"
          [(isLoading)]="isLoading"
          (onSendMessage)="handleSend($event)"
        ></bmb-chat-bar>
      </div>
    </bmb-home-card>
  </section>
</ng-template>

@if (mode() === 'expanded') {
  <ng-container *ngTemplateOutlet="chatContent"></ng-container>
}

<ng-template #contentTemplate>
  <div class="bmb_chat-card-chat-content">
    <ng-container *ngTemplateOutlet="chatContent"></ng-container>
  </div>
</ng-template>

@if (mode() === 'compact') {
  <bmb-action-icon
    class="bmb_chat-card-bot"
    [icon]="currentBot()?.icon!"
    [alt]="currentBot()?.name!"
    [iconSize]="40"
    [isSVGTemplate]="true"
    (buttonClick)="openChatFromCompact()"
  >
    <ng-template #customActionIcon>
      <bmb-bot-icon [iconName]="currentBot()?.icon!" />
    </ng-template>
  </bmb-action-icon>
}
