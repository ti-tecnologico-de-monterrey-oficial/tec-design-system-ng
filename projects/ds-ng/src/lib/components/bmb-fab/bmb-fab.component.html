<section class="bmb_fab" [ngClass]="{ 'bmb_fab-mitec': mitec() }">
  <button
    type="button"
    [class]="className"
    [ngClass]="{
      active: isActive
    }"
    (click)="handleFabClick($event)"
  >
    <bmb-icon
      [ngClass]="{
        'bmb_fab-main-action': !mitec()
      }"
      [icon]="iconName"
      [size]="48"
      alt="FAB icon"
    />
  </button>
  @if (mitec() && !!text()) {
    <span class="bmb_fab-mitec-text">{{ text() }}</span>
  }
</section>
