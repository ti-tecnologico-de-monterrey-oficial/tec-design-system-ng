<bmb-container [appearance]="'primary-home'" class="bmb_frequent_apps">
  <h2 class="bmb_frequent_apps-title">{{ title() }}</h2>
  <section class="bmb_horizontal-scroll">
    <section class="bmb_horizontal-scroll-wrapper">
  <div #container [ngClass]="getClassesFAC()">
    @for (app of apps(); track $index) {
      <bmb-interactive-icon
        [icon]="app.icon"
        [title]="app.title"
        [link]="app.link ?? '#'"
        [target]="app.target ?? '_self'"
        [appearance]="app.appearance"
        [layout]="layout()"
      />
    }
  </div>
  </section>
</section>
</bmb-container>
