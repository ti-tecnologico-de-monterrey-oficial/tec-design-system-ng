<span
  [ngClass]="getClasses(textLinkStyle(), disabled())"
  [class.bmb_text-link--primary]="appearance() === 'primary'"
  [class.bmb_text-link--alternative]="appearance() === 'alternative'"
>
  <bmb-check-external-link-button
    class="bmb_text-link-item"
    [link]="link()"
    [target]="target()"
  >
    <span
      [ngClass]="
        getPositionClass(
          'bmb_text-link-item',
          textLinkStyle() === 'icon',
          iconPosition()
        )
      "
    >
      @if (textLinkStyle() === "icon" && !!icon()) {
        <bmb-icon
          [ngClass]="
            getPositionClass(
              'bmb_text-link-item-icon',
              textLinkStyle() === 'icon',
              iconPosition()
            )
          "
          [icon]="icon()"
        />
      }
      <span>{{ textLink() }}</span>
    </span>
  </bmb-check-external-link-button>
</span>
