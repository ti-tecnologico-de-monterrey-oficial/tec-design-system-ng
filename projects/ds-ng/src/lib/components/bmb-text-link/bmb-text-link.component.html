<span
  class="bmb_text-link"
  [ngClass]="{
    disabled: disabled()
  }"
  [attr.data-automation-id]="testId()"
>
  <bmb-check-external-link-button
    class="bmb_text-link-item"
    [ngClass]="{
      icon: textLinkStyle() === 'icon',
      reverse: textLinkStyle() === 'icon' && iconPosition() === 'right'
    }"
    [link]="link()"
    [target]="target()"
  >
    @if (textLinkStyle() === 'icon' && !!icon()) {
      <bmb-icon
        class="bmb_text-link-icon"
        [icon]="icon()"
        [size]="20"
        [alt]="textLink() || icon()"
        [testId]="testId() + '-icon'"
      />
    }
    <span class="bmb_text-link-text">
      {{ textLink() }}
      <ng-content></ng-content>
    </span>
  </bmb-check-external-link-button>
</span>
