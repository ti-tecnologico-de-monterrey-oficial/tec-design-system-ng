<span
  class="bmb_text-link"
  [ngClass]="{
    disabled: disabled()
  }"
>
  <bmb-check-external-link-button [link]="link()" [target]="target()">
    <span
      class="bmb_text-link-item"
      [ngClass]="{
        'bmb_text-link-item-reverse':
          textLinkStyle() === 'icon' && iconPosition() === 'right'
      }"
    >
      @if (textLinkStyle() === 'icon' && !!icon()) {
        <bmb-icon
          class="bmb_text-link-item-icon"
          [icon]="icon()"
          [size]="20"
          [alt]="textLink()"
        />
      }
      <span
        class="bmb_text-link-item-text"
        [ngClass]="{
          underlined: textLinkStyle() === 'underlined'
        }"
      >
        {{ textLink() }}
      </span>
    </span>
  </bmb-check-external-link-button>
</span>
