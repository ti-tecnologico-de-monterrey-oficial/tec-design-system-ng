<span [ngClass]="getClasses()">
  <bmb-check-external-link-button
    class="bmb_text-link-item"
    [link]="link()"
    [target]="target()"
  >
    <span
      [ngClass]="
        getPositionClass(
          'bmb_text-link-item',
          textLinkStyle() === 'icon',
          iconPosition()
        )
      "
    >
      @if (textLinkStyle() === 'icon' && !!icon()) {
        <bmb-icon
          [ngClass]="
            getPositionClass(
              'bmb_text-link-item-icon',
              textLinkStyle() === 'icon',
              iconPosition()
            )
          "
          [icon]="icon()"
          [alt]="textLink()"
        />
      }
      <span>{{ textLink() }}</span>
    </span>
  </bmb-check-external-link-button>
</span>
