<section class="bmb_totp">
  <form class="bmb_totp-form" [formGroup]="codeForm" (ngSubmit)="onSubmit()">
    <bmb-container
      class="bmb_totp-container"
      [appearance]="'contrast-box-container'"
    >
      <bmb-icon class="bmb_totp-icon" icon="lock" [size]="48" />
      <h2 class="bmb_totp-title">{{ title() }}</h2>
      <h3 class="bmb_totp-subtitle">{{ subtitle() }}</h3>
      <section class="bmb_totp-code">
        <section
          class="bmb_totp-separator"
          *ngFor="let i of [].constructor(maxCode()); let idx = index"
        >
          <bmb-input-content
            class="bmb_totp-input"
            [inputId]="'code_' + instanceId() + '_' + idx"
            [name]="'name_' + instanceId() + '_' + idx"
            [maxLength]="1"
            [isError]="codeError()"
            [control]="getFormControl('name_' + instanceId() + '_' + idx)"
            (keyup)="onKeyUp($event, idx)"
          />
        </section>
      </section>
      @if (codeError()) {
        <p class="bmb_totp-error">{{ errorMessage() }}</p>
      }
      @if (showButton()) {
        <button class="bmb_totp-button" bmbButton size="large" type="submit">
          {{ buttonText() }}
        </button>
      }
      @if (showButton() && helperText()) {
        <p class="bmb_totp-helper">
          {{ helperText() }}
        </p>
      }
    </bmb-container>
  </form>
</section>
