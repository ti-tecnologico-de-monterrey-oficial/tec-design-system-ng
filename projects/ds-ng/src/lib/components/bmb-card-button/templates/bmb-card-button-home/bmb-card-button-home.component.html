<bmb-card-button
  class="home-card-host"
  [isFullInteractive]="isFullInteractive()"
  [componentTitle]="componentTitle()"
  [isTemplate]="true"
  [isDisabled]="isDisabled()"
  [hasMenu]="hasMenu()"
  [menuItems]="menuItems()"
>
  <section class="home-card">
    <header class="home-card__header">
      <h2>{{ componentTitle() }}</h2>
    </header>

    <div class="home-card__content">
      <div class="home-card__summary">
        <span>{{ summaryText() }}</span>
        <span>{{ currentCount() }} / {{ totalCount() }}</span>
      </div>

      <div class="home-card__scroll">
        <bmb-list-group
          borderRadius="m"
          margin="l"
          padding="l"
          [showControls]="false"
          (selectionChange)="selectionChange.emit($event)"
        >
          @for (item of items(); track item.id) {
            <bmb-list-group-item
              [id]="item.id"
              appearanceContrast="alternative"
              [personalizedTemplate]="true"
              [isDisabled]="isDisabled()"
            >
              <article
                class="home-card__item"
                [class.home-card__item--action]="!showBadge()"
              >
                @if (!showBadge()) {
                  <bmb-icon
                    class="home-card__leading-icon"
                    [icon]="item.leadingIcon ?? defaultLeadingIcon()"
                    [size]="20"
                    alt=""
                  />
                }

                <div class="home-card__item-content">
                  <h3>{{ item.title }}</h3>
                  @if (item.subtitle) {
                    <p>
                      @if (showBadge()) {
                        <span aria-hidden="true">•&nbsp;</span>
                      }
                      {{ item.subtitle }}
                    </p>
                  }
                </div>

                @if (showBadge()) {
                  <bmb-badge
                    [text]="item.badgeText ?? defaultBadgeText()"
                    [appearance]="
                      item.badgeAppearance ?? defaultBadgeAppearance()
                    "
                    [container]="true"
                  />
                } @else {
                  <bmb-button-icon
                    class="home-card__action"
                    [icon]="item.actionIcon ?? defaultActionIcon()"
                    [showContainer]="false"
                    [disabled]="isDisabled()"
                    alt="Abrir archivo"
                    (onButtonClick)="
                      actionClick.emit({ event: $event, item: item })
                    "
                  />
                }
              </article>
            </bmb-list-group-item>
          }
        </bmb-list-group>
      </div>
    </div>
  </section>
</bmb-card-button>
