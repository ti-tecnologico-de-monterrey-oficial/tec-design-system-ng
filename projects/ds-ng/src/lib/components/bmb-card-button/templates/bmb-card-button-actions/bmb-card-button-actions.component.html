<bmb-card-button
  class="action-card-host"
  [isFullInteractive]="isFullInteractive()"
  [componentTitle]="componentTitle()"
  [body]="body()"
  [icon]="trailingIcon()"
  [leftContentIcon]="leftContentIcon()"
  [leftContent]="leftContent()"
  [hasMenu]="hasMenu()"
  [menuItems]="menuItems()"
  [isDisabled]="isDisabled()"
  (onAddContentClick)="cardClick.emit($event)"
  (onTitleClick)="titleClick.emit($event)"
>
  <ng-template #customContent>
    <button
      bmbButton
      type="button"
      class="action-card__button"
      appearance="secondary-outlined"
      [isMobile]="true"
      [disabled]="isDisabled()"
      (click)="$event.stopPropagation(); buttonClick.emit($event)"
    >
      {{ buttonText() }}
    </button>
  </ng-template>
</bmb-card-button>
