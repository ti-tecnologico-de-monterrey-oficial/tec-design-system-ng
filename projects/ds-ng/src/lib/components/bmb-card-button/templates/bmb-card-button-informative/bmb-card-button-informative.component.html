@if (!!tooltipTitle() || !!tooltipText()) {
  <bmb-tooltip
    class="informative-card__tooltip"
    [class.informative-card__tooltip--mobile-only]="tooltipMobileOnly()"
    [componentTitle]="tooltipTitle()"
    [text]="tooltipText()"
    [icon]="tooltipIcon()"
    [size]="tooltipSize()"
  />
}

<bmb-card-button
  class="informative-card-host"
  [isFullInteractive]="true"
  [componentTitle]="componentTitle()"
  [body]="body()"
  [badge]="badge()"
  [icon]="icon()"
  [leftContentIcon]="leftContentIcon()"
  [leftContentImage]="leftContentImage()"
  [leftContent]="leftContent()"
  [hasMenu]="hasMenu()"
  [menuItems]="menuItems()"
  [isTemplate]="false"
  [isDisabled]="isDisabled()"
  [textLink]="textLink()"
  [isSmall]="false"
  (onAddContentClick)="cardClick.emit($event)"
  (onTitleClick)="titleClick.emit($event)"
>
  <ng-template #customContent>
    <p class="informative-card__complementary">
      {{ complementaryText() }}
    </p>

    <div class="informative-card__divider"></div>

    <div class="informative-card__actions">
      <button
        bmbButton
        type="button"
        appearance="secondary-outlined"
        [isMobile]="true"
        [disabled]="isDisabled()"
        (click)="$event.stopPropagation(); primaryButtonClick.emit($event)"
      >
        {{ primaryButtonText() }}
      </button>

      <button
        bmbButton
        type="button"
        appearance="secondary-outlined"
        [isMobile]="true"
        [disabled]="isDisabled()"
        (click)="$event.stopPropagation(); secondaryButtonClick.emit($event)"
      >
        {{ secondaryButtonText() }}
      </button>
    </div>
  </ng-template>
</bmb-card-button>
