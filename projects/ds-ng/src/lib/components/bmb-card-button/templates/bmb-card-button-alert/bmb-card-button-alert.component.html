<bmb-card-button
  class="alert-card-host"
  [class.alert-card-host--warning]="appearance() === 'warning'"
  [class.alert-card-host--error]="appearance() === 'error'"
  [class.alert-card-host--success]="appearance() === 'success'"
  [class.alert-card-host--info]="appearance() === 'info'"
  [isFullInteractive]="isFullInteractive()"
  [componentTitle]="componentTitle()"
  [body]="body()"
  [icon]="trailingIcon()"
  [leftContentIcon]="leftContentIcon()"
  [leftContent]="leftContent()"
  [hasMenu]="hasMenu()"
  [menuItems]="menuItems()"
  [isDisabled]="isDisabled()"
  (onAddContentClick)="cardClick.emit($event)"
  (onTitleClick)="titleClick.emit($event)"
/>
