<bmb-card-button
  class="empty-card-host"
  [isFullInteractive]="true"
  [componentTitle]="componentTitle()"
  [isTemplate]="true"
  [isDisabled]="isDisabled()"
  [hasMenu]="hasMenu()"
  [menuItems]="menuItems()"
>
  <section class="empty-card">
    <header class="empty-card__header">
      <h2>{{ componentTitle() }}</h2>
    </header>

    <div class="empty-card__content">
      <div class="empty-card__summary">
        <span>{{ summaryText() }}</span>
        <span>{{ currentCount() }} / {{ totalCount() }}</span>
      </div>

      <div class="empty-card__state">
        <bmb-box-icon
          class="empty-card__icon"
          [iconName]="emptyIcon()"
          [iconImageAlt]="emptyTitle()"
          [isIconFilled]="true"
          boxSize="regular"
          boxShape="circle"
        />

        <h3>{{ emptyTitle() }}</h3>
        <p>{{ emptyDescription() }}</p>

        <button
          bmbButton
          type="button"
          appearance="primary"
          [disabled]="isDisabled()"
          (click)="$event.stopPropagation(); buttonClick.emit($event)"
        >
          {{ buttonText() }}
        </button>
      </div>
    </div>
  </section>
</bmb-card-button>
