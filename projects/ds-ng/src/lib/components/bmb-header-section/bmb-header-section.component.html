<section class="bmb_header-section">
  <bmb-container
    [ngClass]="
      getClassNameByConditional(
        'bmb_header-section',
        transparentBgC()!,
        'transparent_bgc'
      )
    "
  >
    @if (leftIcon()) {
      <bmb-navigation-icon
        class="bmb_header-section-left_icon"
        [icon]="leftIcon()"
        (buttonClick)="handleClickLeft($event)"
      />
    }

    <section class="bmb_header-section-container">
      @if (icon()) {
        <section
          class="bmb_header-section-container-icon"
          [ngStyle]="getStyles()"
        >
          <bmb-icon [icon]="icon()" [size]="iconSize()" />
        </section>
      }
      <section>
        @if (title()) {
          <h1 class="bmb_header-section-container-title">
            {{ title() }}
          </h1>
        }
        @if (showBreadcrumbs()) {
          <section class="bmb_header-section-container-breadcrumb">
            <bmb-breadcrumb [dataLocalNav]="dataLocalNav()" />
          </section>
        } @else {
          <h2 class="bmb_header-section-container-subtitle">
            {{ subtitle() }}
          </h2>
        }
      </section>
    </section>
    <bmb-navigation-bar [actionHeaders]="actionHeaders()" [iconSize]="24" />
  </bmb-container>
</section>
