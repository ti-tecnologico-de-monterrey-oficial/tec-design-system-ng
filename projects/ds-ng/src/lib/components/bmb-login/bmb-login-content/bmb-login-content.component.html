<section class="bmb_login-content">
  <span class="bmb_login-content-input">
    <bmb-input
      placeholder="Usuario"
      icon="account_circle"
      errorMessage="El usuario es requerido"
      appearance="normal"
      [disabled]="false"
      [isRequired]="true"
      [control]="getFormControl('user')"
      [showError]="showErrors['user']"
      (isBlur)="onSubmit()"
    />
  </span>
  <span class="bmb_login-content-input">
    <bmb-input
      type="password"
      placeholder="Contraseña"
      icon="lock"
      errorMessage="La contraseña es requerida"
      appearance="normal"
      [disabled]="false"
      [isRequired]="true"
      [control]="getFormControl('password')"
      [showError]="showErrors['password']"
      (isBlur)="onSubmit()"
    />
  </span>
  <section class="bmb_login-content-sublabel">
    <bmb-text-link
      [textLink]="forgottenPasswordLabel()"
      icon=""
      [link]="forgottenPasswordLink()"
      textLink="another acount"
      [target]="forgottenPasswordTarget()"
    />
  </section>
</section>
