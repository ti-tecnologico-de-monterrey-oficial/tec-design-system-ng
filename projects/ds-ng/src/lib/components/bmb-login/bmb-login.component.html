<bmb-header-mitec [actionHeaders]="actionHeaders()">
  <bmb-login-content
    [forgottenPasswordLabel]="forgottenPasswordLabel()"
    [forgottenPasswordLink]="forgottenPasswordLink()"
    [forgottenPasswordTarget]="forgottenPasswordTarget()"
    [(onContinue)]="isEnabled"
    (onFormGroup)="handleFormGroup($event)"
  />
  <button
    bmbButton
    [disabled]="!isEnabled"
    size="large"
    (click)="handleContinue()"
  >
    {{ buttonLabel() }}
  </button>
</bmb-header-mitec>
