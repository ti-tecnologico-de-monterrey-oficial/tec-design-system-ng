<header class="bmb_inner_header">
  <div class="bmb_inner_header-container">
    @if (!toggleSearch()) {
      @if (showClose() && !showReturn()) {
        <button class="bmb_inner_header-button" (click)="handleBack($event)">
          <bmb-icon icon="close" [size]="24" />
        </button>
      }
      @if (!showClose() && showReturn()) {
        <button class="bmb_inner_header-button" (click)="handleBack($event)">
          <bmb-icon icon="arrow_back" [size]="24" />
        </button>
      }
      <div class="bmb_inner_header-block">
        <span class="bmb_inner_header-title">{{ title() }}</span>
        @if (subTitle()) {
          <span class="bmb_inner_header-subtitle">
            <bmb-icon icon="lock" />
            {{ subTitle() }}
          </span>
        }
      </div>

      <div class="bmb_inner_header-actions">
        @if (trailingIconSecondary()) {
          <button
            class="bmb_inner_header-button"
            (click)="handleTrailingIconSecondary($event)"
          >
            <bmb-icon [icon]="trailingIconSecondary()" [size]="24" />
          </button>
        }
        @if (!showSearch()) {
          <button
            class="bmb_inner_header-button"
            (click)="handleTrailingIconPrimary($event)"
          >
            <bmb-icon [icon]="trailingIconPrimary()" [size]="24" />
          </button>
        }
        @if (showSearch()) {
          <button class="bmb_inner_header-button" (click)="handleShowSearch()">
            <bmb-icon icon="search" [size]="24" />
          </button>
        }
      </div>
    }
    @if (toggleSearch()) {
      <form class="bmb_inner_header-form" (ngSubmit)="onSubmit($event)">
        <button
          type="button"
          class="bmb_inner_header-form-button"
          (click)="handleCloseSearch()"
        >
          <bmb-icon icon="close" [size]="24" />
        </button>
        <bmb-input
          type="text"
          name="search"
          icon="search"
          [placeholder]="placeholderSearch()"
          appearance="normal"
          (onBlur)="onSubmit()"
        />
      </form>
    }
  </div>
  <section class="bmb_inner_header-content">
    <ng-content></ng-content>
  </section>
</header>
