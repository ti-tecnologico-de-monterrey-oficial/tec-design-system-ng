<bmb-check-external-link-button
  [link]="link()!"
  [target]="target()!"
  (buttonClick)="handleClick()"
>
  <section [ngClass]="getClasses()">
    <span class="bmb_interactive_icon-box">
      <bmb-icon
        [icon]="icon()"
        [size]="32"
        [dotNotification]="dotNotification()"
      />
    </span>
    @if (title() || description()) {
      <span class="bmb_interactive_icon-text">
        @if (title()) {
          <h4 class="bmb_interactive_icon-title">{{ title() }}</h4>
        }
        @if (description() && horizontal()) {
          <span class="bmb_interactive_icon-description">
            {{ description() }}
          </span>
        }
      </span>
    }
  </section>
</bmb-check-external-link-button>
