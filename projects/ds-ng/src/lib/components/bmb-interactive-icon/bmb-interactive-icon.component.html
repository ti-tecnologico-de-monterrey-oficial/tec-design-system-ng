<bmb-check-external-link-button
  [link]="link()!"
  [target]="target()!"
  (buttonClick)="handleClick($event)"
>
  <section [ngClass]="getClasses()">
    <span class="bmb_interactive_icon-box">
      <bmb-icon
        [icon]="icon()"
        [size]="32"
        [dotNotification]="dotNotification()"
        [alt]="componentTitle() || title() || 'icon'"
      />
    </span>
    @if (componentTitle() || title() || description()) {
      <span class="bmb_interactive_icon-text">
        @if (componentTitle() || title()) {
          <h4 class="bmb_interactive_icon-title">
            {{ componentTitle() || title() }}
          </h4>
        }
        @if (description() && horizontal()) {
          <span class="bmb_interactive_icon-description">
            {{ description() }}
          </span>
        }
      </span>
    }
  </section>
</bmb-check-external-link-button>
