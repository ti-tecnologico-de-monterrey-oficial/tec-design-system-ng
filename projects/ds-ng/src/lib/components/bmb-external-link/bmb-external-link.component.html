<section class="bmb_external-link">
  <header>
    <bmb-container class="bmb_external-link-container">
      <bmb-three-cols>
        <ng-template #bmbLeftContent>
          <bmb-action-icon
            icon="close"
            [iconSize]="24"
            (buttonClick)="handleClose($event)"
          />
        </ng-template>
        <ng-template #bmbMainContent>
          <bmb-title-content
            class="bmb_external-link-title"
            [componentTitle]="componentTitle() || title() || ''"
            titleSize="6"
            [subtitle]="subtitle()"
            subtitleSize="3"
            subtitleFontWeight="300"
            [subtitleIcon]="getSubtitleIcon()"
            [subtitleIconSize]="12"
            [isCenterContent]="true"
            [transparentBgC]="true"
          />
        </ng-template>
        <ng-template #bmbRightContent>
          <section class="bmb_external-link-menu" #contentDiv>
            <bmb-action-icon
              class="bmb_external-link-menu-button"
              icon="more_horiz"
              [iconSize]="24"
              (buttonClick)="handleOpenMenu()"
            />
          </section>
        </ng-template>
      </bmb-three-cols>
    </bmb-container>
  </header>
  <section class="bmb_external-link-content">
    <ng-content />
  </section>
  <span class="bmb_external-link-footer">
    <bmb-bottom-navigation-bar
      [navigationBarIcons]="navigationBarIcons()"
      (navigationBarEvents)="onFooterOptionClick($event)"
    />
  </span>
</section>
