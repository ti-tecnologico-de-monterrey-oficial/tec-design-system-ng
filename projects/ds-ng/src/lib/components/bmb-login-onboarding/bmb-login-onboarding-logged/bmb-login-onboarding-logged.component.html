<section class="bmb_login-onboarding-logged">
  <section class="bmb_login-onboarding-logged-tec_logo">
    <img alt="Tecnológico de Monterrey" [src]="tecLogoImage" />
  </section>
  <section class="bmb_login-onboarding-logged-mitec_logo">
    <img alt="mitec" [src]="mitecImage" />
  </section>
  <section class="bmb_login-onboarding-logged-content">
    <bmb-user-profile-content
      [anotherAccountLabel]="getAnotherAccount().label"
      [anotherAccountLink]="getAnotherAccount().link"
      [anotherAccountTarget]="getAnotherAccount().target!"
      [userInfo]="getUserInfo()"
    />
  </section>
  <section>
    <button bmbButton size="large" (click)="_handleContinue()">Ingresar</button>
  </section>
</section>
