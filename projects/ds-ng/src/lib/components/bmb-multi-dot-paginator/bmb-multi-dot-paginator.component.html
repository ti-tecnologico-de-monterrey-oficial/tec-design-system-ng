<div class="bmb_multi-dot-paginator">
  <header class="bmb_multi-dot-paginator-header">
    <h2 class="bmb_multi-dot-paginator-title">
      {{ componentTitle() || title() }}
    </h2>
    @if (subtitle()) {
      <h4 class="bmb_multi-dot-paginator-subtitle">{{ subtitle() }}</h4>
    }
  </header>
  <section class="bmb_multi-dot-paginator-content">
    <div
      class="bmb_multi-dot-paginator-content-list"
      [style]="
        '--numberOfElements: ' +
        numberOfElements.length +
        '; --selected-child: ' +
        selectedIndex() +
        ';'
      "
    >
      <ng-content />
      <div class="bmb_multi-dot-paginator-return">
        <bmb-fab
          icon="keyboard_return"
          size="large"
          type="normal"
          text="Regresar al inicio"
          [mitec]="true"
          (click)="selectItem(0)"
        />
      </div>
    </div>
    <button
      class="bmb_multi-dot-paginator-next"
      (click)="setNextItem()"
      title="Siguiente"
    >
      Siguiente
    </button>
  </section>
  <footer class="bmb_multi-dot-paginator-footer">
    <ul
      class="bmb_multi-dot-paginator-list"
      [style]="'--selected-child: ' + selectedIndex() + ';'"
    >
      @if (numberOfElements.length > 0) {
        <li class="bmb_multi-dot-paginator-list-item">
          <bmb-action-icon
            [disabled]="selectedIndex() === 0"
            [icon]="'chevron_left'"
            [iconSize]="24"
            (buttonClick)="prevItem()"
          ></bmb-action-icon>
        </li>
      }
      @for (dot of numberOfElements; track $index) {
        <li
          class="bmb_multi-dot-paginator-list-item"
          [ngClass]="{
            'bmb_multi-dot-paginator-list-item-active':
              selectedIndex() === $index
          }"
        >
          <button
            class="bmb_multi-dot-paginator-dot"
            (click)="selectItem($index)"
            [title]="$index"
            [ngClass]="{
              'bmb_multi-dot-paginator-dot-active': selectedIndex() === $index
            }"
          ></button>
        </li>
      }
      <li
        class="bmb_multi-dot-paginator-list-item"
        [ngClass]="{
          'bmb_multi-dot-paginator-list-item-active':
            selectedIndex() === numberOfElements.length
        }"
      >
        <button
          class="bmb_multi-dot-paginator-dot"
          (click)="selectItem(numberOfElements.length)"
          [title]="numberOfElements.length"
          [ngClass]="{
            'bmb_multi-dot-paginator-dot-active':
              selectedIndex() === numberOfElements.length
          }"
        ></button>
      </li>
      @if (numberOfElements.length > 0) {
        <li class="bmb_multi-dot-paginator-list-item">
          <bmb-action-icon
            [disabled]="selectedIndex() === numberOfElements.length"
            [icon]="'chevron_right'"
            [iconSize]="24"
            (buttonClick)="nextItem()"
          ></bmb-action-icon>
        </li>
      }
    </ul>
  </footer>
</div>
