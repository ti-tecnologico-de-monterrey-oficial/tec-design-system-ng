<section
  class="bmb_image"
  [ngStyle]="{ width: width(), 'aspect-ratio': ratio() }"
>
  @if (isBlurredBackdrop()) {
    <figure
      class="bmb_image-figure bmb_image-figure-backdrop"
      [ngClass]="getClasses()"
      [ngStyle]="{ 'aspect-ratio': ratio() }"
    >
      <picture>
        <source media="(min-width: 1000px)" [srcset]="src()" />
        @if (mobileSrc()) {
          <source [srcset]="mobileSrc()" />
        }
        <img
          [srcset]="src()"
          [alt]="alt()"
          [loading]="loading()"
          class="bmb_image-figure-image"
        />
      </picture>
    </figure>
  }
  <figure
    class="bmb_image-figure"
    [ngClass]="getClasses()"
    [ngStyle]="{ 'aspect-ratio': ratio() }"
  >
    <picture>
      <source media="(min-width: 1000px)" [srcset]="src()" />
      @if (mobileSrc()) {
        <source [srcset]="mobileSrc()" />
      }
      <img
        [srcset]="src()"
        [alt]="alt()"
        [loading]="loading()"
        class="bmb_image-figure-image"
      />
    </picture>
  </figure>
</section>
