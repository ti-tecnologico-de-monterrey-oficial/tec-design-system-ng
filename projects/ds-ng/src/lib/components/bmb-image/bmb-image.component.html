<section
  class="bmb_image"
  [ngClass]="{ 'bmb_image-carousel': isCarousel() }"
  [ngStyle]="{ width: width(), 'aspect-ratio': ratio() }"
>
  @if (isBlurredBackdrop()) {
    <figure
      class="bmb_image-figure bmb_image-figure-backdrop"
      [ngClass]="getClasses()"
      [ngStyle]="{ 'aspect-ratio': ratio() }"
    >
      <picture>
        <source media="(min-width: 1000px)" [srcset]="encodedURL()" />
        @if (encodedMobileURL()) {
          <source [srcset]="encodedMobileURL()" />
        }
        <img
          [srcset]="encodedURL()"
          [alt]="alt()"
          [loading]="loading()"
          class="bmb_image-figure-image"
        />
      </picture>
    </figure>
  }
  <figure
    class="bmb_image-figure"
    [ngClass]="getClasses()"
    [ngStyle]="{ 'aspect-ratio': ratio() }"
  >
    <picture>
      <source media="(min-width: 1000px)" [srcset]="encodedURL()" />
      @if (encodedMobileURL()) {
        <source [srcset]="encodedMobileURL()" />
      }
      <img
        [srcset]="encodedURL()"
        [alt]="alt()"
        [loading]="loading()"
        class="bmb_image-figure-image"
      />
    </picture>
  </figure>

  @if (isCarousel()) {
    <div class="bmb_image-arrow bmb_image-arrow--left">
      <bmb-button-icon
        icon="chevron_left"
        [showContainer]="true"
        (onButtonClick)="prev()"
        appearanceContrast="solid"
      />
    </div>

    <div class="bmb_image-arrow bmb_image-arrow--right">
      <bmb-button-icon
        icon="chevron_right"
        [showContainer]="true"
        (onButtonClick)="next()"
        appearanceContrast="solid"
      />
    </div>

    @for (img of images(); track $index) {
      <figure
        class="bmb_image-figure bmb_image-figure-images"
        [ngClass]="getClasses()"
        [ngStyle]="{
          'aspect-ratio': ratio(),
          transform: 'translateX(' + ($index - currentIndex()) * 100 + '%)'
        }"
      >
        <picture>
          <source media="(min-width: 1000px)" [srcset]="img.src" />
          @if (img.mobileSrc) {
            <source [srcset]="img.mobileSrc" />
          }
          <img
            [src]="img.src"
            [alt]="img.alt || alt()"
            [loading]="loading()"
            class="bmb_image-figure-image"
            role="button"
            tabindex="0"
            (click)="handleImageClick(img, $index)"
            (keydown)="handleImageKeyDown($event, img, $index)"
          />
        </picture>
      </figure>
    }
  }
</section>
