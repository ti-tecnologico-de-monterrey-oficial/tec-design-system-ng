<span class="bmb_navigation_icon">
  <bmb-check-external-link-button
    [idElement]="idElement()"
    [link]="link()!"
    [target]="target()!"
    (buttonClick)="handleClick()"
  >
    <span
      class="bmb_navigation_icon-icon"
      [ngClass]="{
        'bmb_navigation_icon-icon-toggle_icon':
          !!toggleIconActive() && isAccentColor(),
      }"
    >
      <bmb-icon
        [icon]="getIcon()"
        [size]="iconSize()"
        [dotNotification]="dotNotification()"
      />
    </span>
  </bmb-check-external-link-button>
</span>
