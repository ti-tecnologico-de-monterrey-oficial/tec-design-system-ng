<section class="bmb_search-input">
  <section
    class="bmb_search-input-container"
    clickOutside
    (clickOutside)="closeList()"
  >
    <bmb-input-content
      class="bmb_search-input-field"
      [inputId]="inputId()"
      [name]="name()"
      icon="search"
      [isDisabled]="isLoading()"
      [control]="filterControl"
      [placeholder]="placeholder()"
      [isClearable]="true"
      (keydown)="handleKeyDown($event)"
      (click)="handleItemClick()"
    />
    <bmb-dropdown-content
      class="bmb_search-input-dialog"
      name="list"
      [selectedOption]="filterControl.value"
      [(items)]="filteredData"
      [(isOpen)]="isDialogOpen"
    />
  </section>
</section>
