<ng-template #commonTemplate>
  <ng-content />
</ng-template>
<span class="bmb_check-external-link-button">
  @if (isButton(!!link())) {
    <button
      type="button"
      class="bmb_check-external-link-button-element"
      [id]="idElement()"
      (click)="handleClick($event)"
      (mousedown)="handlePress($event)"
      [ngClass]="{
        'bmb_check-external-link-button-element-disabled': disabled(),
      }"
      [disabled]="disabled()"
      type="button"
    >
      <ng-container [ngTemplateOutlet]="commonTemplate" />
    </button>
  } @else if (isExternalLink(link())) {
    <a
      class="bmb_check-external-link-button-element"
      [id]="idElement()"
      [href]="link()"
      [target]="target()"
      rel="noopener noreferrer"
    >
      <ng-container [ngTemplateOutlet]="commonTemplate" />
    </a>
  } @else {
    <a
      class="bmb_check-external-link-button-element"
      [id]="idElement()"
      [routerLink]="link()"
      routerLinkActive="bmb-active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <ng-container [ngTemplateOutlet]="commonTemplate" />
    </a>
  }
</span>
