<dialog open [ngClass]="getModalClassList()">
  <section class="bmb_modal-container" [ngClass]="getModalSize()">
    <bmb-header-section
      [title]="title()"
      [subtitle]="subtitle()"
      [icon]="getIcon()"
      [transparentBgC]="true"
      class="bmb_modal-header"
      [actionHeaders]="getHeaderActions()"
    />
    <div class="bmb_modal-content">
      @if (getContentType()) {
        <p class="bmb_modal-content-paragraph">{{ content() }}</p>
      } @else {
        <ng-container *ngTemplateOutlet="getContent()" />
      }
    </div>
    @if (!hideFooter()) {
      <bmb-modal-footer
        [actions]="actions()"
        [id]="id()"
        [disableCloseButtonFooter]="disableCloseButtonFooter()"
      />
    }
  </section>
</dialog>
