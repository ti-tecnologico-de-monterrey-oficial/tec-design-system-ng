<section [ngClass]="getModalClasses()">
  <section class="bmb_modal-container">
    <header>
      <bmb-three-cols
        [expandMainColumn]="true"
        gapSize="none"
        alignItems="start"
      >
        <ng-template #bmbMainContent>
          <bmb-title-content
            [title]="getTitle()"
            titleSize="9"
            [subtitle]="getSubtitle()"
            [icon]="getImage()"
            [transparentBgC]="true"
          />
        </ng-template>
        <ng-template #bmbRightContent>
          <bmb-navigation-icon
            icon="close"
            [iconSize]="24"
            (buttonClick)="closeModal('close', true)"
          />
        </ng-template>
      </bmb-three-cols>
    </header>
    <section class="bmb_modal-content">
      @if (isModalTemplate()) {
        <section [ngClass]="getDescriptionClasses('template')">
          <ng-container *ngTemplateOutlet="getContent()" />
        </section>
      } @else {
        <section [ngClass]="getDescriptionClasses('description')">
          <p>
            {{ getContent() }}
          </p>
        </section>
      }
    </section>
    @if (showFooter()) {
      <footer id="modal-footer" class="bmb_modal-footer">
        @if (showSecondaryButton()) {
          <button
            bmbButton
            appearance="secondary-outlined"
            [ngClass]="getButtonClass(true)"
            (click)="closeModal('secondary', false)"
          >
            {{ getSecondaryBtnLabel() }}
          </button>
        }
        @if (showPrimaryButton()) {
          <button
            bmbButton
            [ngClass]="getButtonClass(false)"
            (click)="closeModal('primary', true)"
          >
            {{ getPrimaryBtnLabel() }}
          </button>
        }
      </footer>
    }
  </section>
</section>
