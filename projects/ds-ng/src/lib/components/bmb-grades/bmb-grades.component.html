<ng-template #detailContent>
  @for (partial of partials; track $index) {
    <section
      bmbLayout
      margin="none"
      justify="spaceBetween"
      [dynamicCols]="true"
    >
      <span class="bmb_grades-title" bmbLayoutItem>{{ partial.title }}</span>
      <bmb-grade-value
        [score]="partial.score"
        type="partial-grade"
        bmbLayoutItem
      />
    </section>
    @if ($index < partials.length - 1) {
      <bmb-divider [type]="'simple'" />
    }
  }
</ng-template>

<section class="bmb_grades">
  <bmb-inner-header
    [title]="getGradesTitle()"
    [showClose]="true"
    [trailingIconSecondary]="getCalendarIcon()"
    (onHandleClose)="handleLeftGradesClick($event)"
    (onHandleTrailingSecondary)="handleRightGradesClick()"
  >
    <bmb-chevron-title-selector
      [title]="getTitle()"
      leadingIcon="chevron_left"
      trailingIcon="chevron_right"
      (onLeadingClick)="handleLeftPeriodClick()"
      (onTrailingClick)="handleRightPeriodClick()"
    />
    @if (showPrincipalDetail) {
      <bmb-academic-progress
        [accredited]="{
          name: 'Materias Acreditadas',
          value: getAccreditedClasses(),
        }"
        [average]="{ name: 'Promedio Semestre', value: getPeriodAverage() }"
        [summary]="{ name: 'Horas Servicio', value: getServiceHours() }"
      />
    }
  </bmb-inner-header>
  @for (element of getElements(); track $index) {
    <bmb-container-button
      [title]="getDetailTitle(element)"
      [subtitle]="getDetailSubtitle(element)"
      [score]="getDetailScore(element)"
      iconLeft="chevron_left"
      iconRight="chevron_right"
      [setButtonTemplate]="true"
      (onButton)="handleDetails(element)"
    />
  }
</section>
