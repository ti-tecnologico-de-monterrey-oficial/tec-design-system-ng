<section class="bmb_filter_card">
  <ng-template #modalTemplate>
    <section class="bmb_filter_card-modal">
      <bmb-form-validation (formGroupState)="onSubmitVal($event)">
        <bmb-input
          name="search"
          [placeholder]="placeholderSearch()"
          [icon]="'search'"
          [appearance]="'normal'"
        />
        @for (controlType of controlTypes(); track $index) {
          <section class="bmb_filter_card-title">
            {{ controlType.title }}
          </section>
          <section class="bmb_filter_card-control">
            @for (control of controlType.control; track $index) {
              @switch (control.type) {
                @case ("radial") {
                  <bmb-radial
                    [name]="control.name"
                    [value]="control.value!"
                    [checked]="control.checked"
                    [label]="control.label"
                  />
                }
                @case ("checkbox") {
                  <bmb-checkbox
                    [name]="control.name"
                    [label]="control.label"
                    [checked]="control.checked"
                  />
                }
                @case ("switch") {
                  <bmb-switch
                    [name]="control.name"
                    [leftIcon]="control.leftText!"
                    [rightText]="control.rightText!"
                    [isChecked]="control.checked"
                  />
                }
              }
            }
          </section>
        }
        <footer class="bmb_filter_card-footer">
          <button bmbButton appearance="secondary-outlined" type="reset">
            {{ secondaryBtnLabel() }}
          </button>
          <button bmbButton type="submit">
            {{ primaryBtnLabel() }}
          </button>
        </footer>
      </bmb-form-validation>
    </section>
  </ng-template>

  @if (inLine()) {
    <ng-container [ngTemplateOutlet]="modalTemplate" />
  } @else {
    <button
      type="button"
      class="bmb_filter_card-button"
      (click)="openModalComponent()"
    >
      <bmb-icon [icon]="icon()" />
    </button>
  }
</section>
