<section [ngClass]="getTabsClasses()">
  <div class="bmb_tabs-container">
    @if (hasScroll()) {
      <bmb-action-icon
        class="bmb_tabs-scroll bmb_tabs-scroll-left"
        icon="arrow_back_ios"
        (buttonClick)="scrollTo(true)"
        [disabled]="scrollLeft() === 0"
      />
    }
    <ul
      role="tablist"
      class="bmb_tabs-tab"
      #tabsItems
      (scroll)="scrollEvent($event)"
    >
      @for (tab of tabs(); track $index) {
        <li role="none" class="bmb_tabs-item-li">
          <button
            role="tab"
            [attr.aria-selected]="$index === selectedTabId() - 1"
            [attr.tabindex]="$index === selectedTabId() - 1 ? 0 : -1"
            class="bmb_tabs-item"
            (click)="selectTab(tab.id)"
            [ngClass]="{
              'bmb_tabs-item-active': $index === selectedTabId() - 1,
              'bmb_tabs-item-uppercase': format() === 'uppercase',
              'bmb_tabs-item-mobile': tab.isMobile,
              'bmb_tabs-item-desktop': tab.isDesktop,
            }"
          >
            <span class="bmb_tabs-content">
              {{ tab.title }}
            </span>
            @if (!!tab.badge) {
              <span class="bmb_tabs-badge">{{ tab.badge }}</span>
            }
          </button>
        </li>
      }
    </ul>
    @if (hasScroll()) {
      <bmb-action-icon
        class="bmb_tabs-scroll bmb_tabs-scroll-left"
        icon="arrow_forward_ios"
        (buttonClick)="scrollTo(false)"
        [disabled]="scrollRight() === 0"
      />
    }
  </div>
  <section class="bmb_tabs-content-container">
    <ng-content></ng-content>
  </section>
</section>
