<section class="bmb_tabs">
  <div class="bmb_tab-container">
    <section class="bmb_tabs-tab" #tabsItems>
      @for (tab of tabs(); track $index) {
        <button
          role="tab"
          [attr.aria-selected]="tab.isActive"
          [attr.tabindex]="tab.isActive ? 0 : -1"
          class="bmb_tabs-item"
          (click)="selectTab(tab.id)"
          [ngClass]="{
            'bmb_tabs-item-active': tab.isActive,
            'bmb_tabs-item-uppercase': format() === 'uppercase',
            'bmb_tabs-item-mobile': tab.isMobile,
            'bmb_tabs-item-desktop': tab.isDesktop,
          }"
        >
          <span>
            {{ tab.title }}
          </span>
          @if (!!tab.badge) {
            <span class="bmb_tabs-badge"> ({{ tab.badge }}) </span>
          }
        </button>
      }
    </section>
  </div>
  <ng-content></ng-content>
</section>
