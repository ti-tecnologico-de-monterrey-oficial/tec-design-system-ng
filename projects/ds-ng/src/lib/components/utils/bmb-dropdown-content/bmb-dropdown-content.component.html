<div class="bmb_dropdown-content-modal" [tabindex]="1">
  <ul class="bmb_dropdown-content-container" [tabindex]="-1">
    @if (enableFilter()) {
      <li class="bmb_dropdown-content-item bmb_dropdown-content-item-filter">
        <input
          type="text"
          class="bmb_dropdown-content-item-filter-input"
          placeholder="Filter..."
          (input)="filterList($event)"
        />
        <bmb-icon
          class="bmb_dropdown-content-item-filter-icon"
          icon="search"
          [size]="24"
        />
      </li>
    }
    @for (item of filteredItems(); track $index) {
      <li
        class="bmb_dropdown-content-item"
        [ngClass]="{
          'bmb_dropdown-content-item-selected': isSelected(item.value!)
        }"
        [id]="item.idItem"
      >
        <bmb-check-external-link-button
          [link]="item.url!"
          [target]="item.target!"
          (buttonClick)="handleDropdown(item)"
        >
          @if (!!item.icon) {
            <bmb-icon
              class="bmb_dropdown-content-item-icon"
              [icon]="item.icon"
              [size]="24"
              [dotNotification]="item.dotNotification"
            />
          }
          <span class="bmb_dropdown-content-item-text">
            {{ item.text }}
          </span>
        </bmb-check-external-link-button>
      </li>
    }
  </ul>
</div>
