<section class="bmb_portal">
  <div class="bmb_portal-top-left" [class.has-toast]="hasToast()">
    <ng-container
      [ngTemplateOutlet]="commonTemplate"
      [ngTemplateOutletContext]="{
        notifications: notificationsList(),
        position: 'top-left'
      }"
    />
  </div>
  <div class="bmb_portal-top-center" [class.has-toast]="hasToast()">
    <ng-container
      [ngTemplateOutlet]="commonTemplate"
      [ngTemplateOutletContext]="{
        notifications: notificationsList(),
        position: 'top-center'
      }"
    />
  </div>
  <div class="bmb_portal-top-right" [class.has-toast]="hasToast()">
    <ng-container
      [ngTemplateOutlet]="commonTemplate"
      [ngTemplateOutletContext]="{
        notifications: notificationsList(),
        position: 'top-right'
      }"
    />
  </div>
  <div class="bmb_portal-bottom-left" [class.has-toast]="hasToast()">
    <ng-container
      [ngTemplateOutlet]="commonTemplate"
      [ngTemplateOutletContext]="{
        notifications: notificationsList(),
        position: 'bottom-left'
      }"
    />
  </div>
  <div class="bmb_portal-bottom-center" [class.has-toast]="hasToast()">
    <ng-container
      [ngTemplateOutlet]="commonTemplate"
      [ngTemplateOutletContext]="{
        notifications: notificationsList(),
        position: 'bottom-center'
      }"
    />
  </div>
  <div class="bmb_portal-bottom-right" [class.has-toast]="hasToast()">
    <ng-container
      [ngTemplateOutlet]="commonTemplate"
      [ngTemplateOutletContext]="{
        notifications: notificationsList(),
        position: 'bottom-right'
      }"
    />
  </div>
</section>

@for (item of modalSignal(); track $index) {
  <bmb-native-modal
    [componentTitle]="item.title || ''"
    [content]="item.content || ''"
    [modalId]="item.modalId || ''"
    [subtitle]="item.subtitle || ''"
    [size]="item.size || 'medium'"
    [iconStyle]="item.iconStyle"
    [actions]="item.actions || []"
    [inputContext]="item.inputContext || {}"
    [outputContext]="item.outputContext || {}"
    (closeModalClicked)="handleModalClick(item, $event)"
  />
}

<ng-container
  *ngFor="let dialog of projectedContents(); trackBy: trackByDialogId"
>
  <bmb-projected-content
    [id]="dialog.id ?? null"
    [content]="dialog.content ?? null"
    [htmlRef]="dialog.targetRef ?? null"
    [mode]="dialog.mode ?? 'outside'"
    [fixSizeToRef]="dialog.fixSizeToRef ?? false"
    [inputContext]="dialog.inputContext ?? {}"
    [showBackdrop]="dialog.showBackdrop ?? true"
    [outputContext]="dialog.outputContext ?? {}"
    [focusOnOpen]="dialog.focusOnOpen ?? true"
    [dialogClass]="dialog.dialogClass ?? ''"
    [forceMobileCenter]="dialog.forceMobileCenter ?? false"
    (removeContent)="handleRemoveProjectedContent(dialog.id)"
  ></bmb-projected-content>
</ng-container>

<ng-template
  #commonTemplate
  let-notifications="notifications"
  let-position="position"
>
  @for (notification of notifications; track $index) {
    @if (notification.position === position) {
      @if (notification.component === 'toast') {
        <bmb-toast
          [class.is-closing]="notification.closing"
          [componentTitle]="notification.title"
          [description]="notification.content"
          [appearance]="notification.appearance || 'neutral'"
          [isClosable]="true"
          [id]="notification.id || $index"
          (onClose)="closeNotification(notification)"
        />
      } @else if (notification.component === 'notice-card') {
        <bmb-notice-card
          [src]="notification.media"
          [componentTitle]="notification.title"
          [description]="notification.content"
          [buttonText]="notification.buttonText"
          [link]="notification.link"
          (onClose)="closeNotification(notification)"
        />
      } @else {
        <bmb-push-notification-item
          [notification]="notification"
          (onClose)="closeNotification(notification)"
        />
      }
    }
  }
</ng-template>
