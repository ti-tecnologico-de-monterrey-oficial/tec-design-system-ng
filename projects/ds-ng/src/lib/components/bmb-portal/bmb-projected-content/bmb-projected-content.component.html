@if (content() !== null && !showBackdrop()) {
  <div class="bmb_projected-backdrop" (click)="removeContent.emit(contentId())"></div>
} @else {
  <bmb-overlay
    [active]="content() !== null && showBackdrop()"
    (click)="removeContent.emit(contentId())"
  />
}
<dialog
  class="bmb_projected-content"
  [ngClass]="dialogNgClass()"
  [ngStyle]="getPosition()"
  [open]="content() !== null"
  #projectedContentDialogRef
>
  <ng-container #container></ng-container>
</dialog>
