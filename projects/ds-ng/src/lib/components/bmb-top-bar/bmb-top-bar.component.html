<header
  class="bmb_top-bar bmb_top-bar-animated"
  [ngClass]="{
    'bmb_top-bar-animated': showAnimation,
    'bmb_top-bar-sidebar': allowSidebarForMobile()
  }"
>
  <bmb-check-external-link-button
    class="bmb_sidebar-element"
    [link]="getLogoLink()"
    [target]="getLogoTarget() || '_blank'"
    (buttonClick)="handleLogoClick()"
    (buttonPress)="handleLogoClick()"
  >
    <figure class="bmb_top-bar-logo-section">
      <picture>
        <source [media]="getNoMobileResolutionSize()" [srcset]="image()" />
        <source [srcset]="mobileImage()" />
        <img [src]="image()" alt="TEC de Monterrey" loading="lazy" />
      </picture>
    </figure>
  </bmb-check-external-link-button>
  <nav class="bmb_top-bar-nav">
    <section class="bmb_top-bar-app-name">
      @if (appName() && !mitec()) {
        <h1 class="bmb_top-bar-mb-app-name-title">{{ appName() }}</h1>
      }
      <span class="bmb_top-bar-app-name-powered">{{ appPowered() }}</span>
    </section>
    @if (userInformation()) {
      <bmb-top-bar-user-section
        [mitec]="mitec()"
        [userInformation]="userInformation()!"
        [notificationNotification]="alertNotification()!"
        [showHelpButton]="showHelpButton() || mitec()"
        (helpButtonClick)="handleHelpButtonClick($event)"
        (userClick)="handleUserClick($event)"
        (alertClick)="handleAlertClick($event)"
        (roleButtonClick)="handleRoleChange($event)"
        [showRoleButton]="showRoleButton()"
        [showSearchButton]="showSearchButton()"
        (searchButtonClick)="handleSearchChange($event)"
        [showNotifications]="!!alertNotification()"
      />
    }
  </nav>
</header>
