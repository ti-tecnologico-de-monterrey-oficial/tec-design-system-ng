<header
  class="bmb_top-bar bmb_top-bar-animated"
  [ngClass]="{
    'bmb_top-bar-animated': showAnimation,
  }"
>
  <figure class="bmb_top-bar-logo-section">
    <picture>
      <source media="(min-width: 1000px)" [srcset]="image" />
      <source [srcset]="mobileImage" />
      <img [src]="image" alt="TEC de Monterrey" loading="lazy" />
    </picture>
  </figure>
  <nav class="bmb_top-bar-nav">
    <section class="bmb_top-bar-app-name">
      @if (appName && !mitec) {
        <h1>{{ appName }}</h1>
      }
      <span class="bmb_top-bar-app-name-powered">Powered x Bamboo Design</span>
    </section>
    @if (userInformation) {
      <section>
        <bmb-top-bar-user-section
          [mitec]="mitec"
          [userInformation]="userInformation"
          [assignmentNotification]="assignmentNotification"
          [notificationNotification]="alertNotification"
          (helpButtonClick)="handleHelpButtonClick()"
          (userClick)="handleUserClick()"
          (alertClick)="handleAlertClick()"
          (roleButtonClick)="handleRoleChange()"
          [showRoleButton]="showRoleButton"
        />
      </section>
    }
  </nav>
  <!-- @if (windowWidth < 1000) {
    <div class="bmb_top-bar-button-section" style="display: inline-flex">
      @if (windowWidth < 1000) {
        <button (click)="handleUserClick()">
          <bmb-user-image
            [image]="userInformation!.image"
            size="mobile-small"
            [altImage]="userInformation!.name"
          />
        </button>
      }
    </div>
  } -->
</header>
