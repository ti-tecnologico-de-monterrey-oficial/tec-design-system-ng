<section
  class="bmb_top-bar-user-section"
  [ngClass]="{ 'bmb_top-bar-user-section-mitec': mitec }"
>
  @if (mitec && showRoleButton) {
    <bmb-action-icon
      class="bmb_top-bar-user-section-no-mobile"
      icon="compare_arrows"
      [iconSize]="32"
      (buttonClick)="handleRoleChange()"
    />
  }
  @if (showNotifications && mitec) {
    <span class="bmb_top-bar-user-section-notification">
      <bmb-action-icon
        icon="notifications"
        [iconSize]="32"
        (buttonClick)="openNotifications()"
        [dotNotification]="totalNotifications()"
      />
      <!-- <dialog
        id="notificationDialog"
        class="bmb_top-bar-user-section-dialog"
        [ngClass]="{
          'bmb_top-bar-user-section-dialog-open': isOpenNotifications,
        }"
        [ngStyle]="{ top: dialogPosition!.top, left: dialogPosition!.left }"
      >
        <bmb-notification-card
          [data]="notificationNotification"
          [hideExpandBtn]="true"
        ></bmb-notification-card>
      </dialog> -->
    </span>
  }
  <bmb-action-icon
    [ngClass]="{'bmb_top-bar-user-section-no-mobile': mitec}"
    icon="help"
    [iconSize]="32"
    (buttonClick)="handleHelpButtonClick()"
  />
  <button
    class="bmb_top-bar-user-section-user-image"
    (click)="handleUserClick()"
  >
    <bmb-user-image
      [image]="userInformation.image"
      size="mobile-small"
      [altImage]="userInformation.name"
    />
  </button>
  @if (mitec && (userInformation.name || userInformation.role)) {
    <div class="bmb_top-bar-user-section-name bmb_top-bar-user-section-no-mobile">
      <h3 class="bmb_top-bar-user-section-title">{{ userInformation.name }}</h3>
      <h4 class="bmb_top-bar-user-section-role">
        {{ userInformation.role }}
      </h4>
    </div>
  }
</section>
