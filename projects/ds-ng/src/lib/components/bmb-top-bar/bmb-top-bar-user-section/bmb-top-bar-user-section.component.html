<section
  bmbLayout
  margin="none"
  gapSize="m"
  justify="center"
  alignItems="center"
  [dynamicCols]="true"
  class="bmb_top-bar-user-section"
  [ngClass]="{ 'bmb_top-bar-user-section-mitec': mitec() }"
>
  <bmb-dropdown-menu
    bmbLayoutItem
    class="bmb_top-bar-user-section bmb_top-bar-user-section-menu bmb_top-bar-user-section-mobile"
    [items]="menu"
  />
  @if (mitec()) {
    @if (showRoleButton()) {
      <bmb-action-icon
        bmbLayoutItem
        class="bmb_top-bar-user-section-no-mobile"
        icon="compare_arrows"
        [iconSize]="32"
        (buttonClick)="handleRoleChange($event)"
      />
    }
    @if (showNotifications()) {
      <bmb-action-icon
        bmbLayoutItem
        class="bmb_top-bar-user-section-no-mobile"
        icon="notifications"
        [iconSize]="32"
        (buttonClick)="openNotifications($event)"
        [dotNotification]="totalNotifications()"
      />
    }
  }
  @if (showHelpButton() || mitec()) {
    <bmb-action-icon
      bmbLayoutItem
      [ngClass]="{ 'bmb_top-bar-user-section-no-mobile': mitec() }"
      icon="help"
      [iconSize]="32"
      (buttonClick)="handleHelpButtonClick($event)"
    />
  }
  <bmb-user-summary-content
    bmbLayoutItem
    [image]="userInformation().image"
    [altImage]="userInformation.name"
    [name]="userInformation().name"
    imageSize="mobile-small"
    [isImageBordered]="false"
    [role]="userInformation().role"
    contentLayout="row"
    salutation=""
  />
</section>
