@if (overlay() && !errorState()) {
  <div class="bmb_loader-overlay"></div>
}
<div
  class="bmb_loader"
  [ngClass]="{
    'bmb_loader-modal': overlay() && !errorState(),
    'bmb_loader-error': errorState(),
  }"
>
  @if (!errorState()) {
    <div class="bmb_loader-loading">
      <bmb-icon icon="progress_activity" class="bmb_loader-icon" />
    </div>
  }
  @if (errorState()) {
    <div
      class="bmb_loader-error-icon"
      [ngClass]="'bmb_loader-error-icon-' + appearance()"
    >
      <bmb-icon [icon]="icon()" class="bmb_loader-icon" />
    </div>
  }
  @if (title()) {
    <h2 class="bmb_loader-title">{{ title() }}</h2>
  }
  @if (subtitle()) {
    <h3 class="bmb_loader-subtitle">{{ subtitle() }}</h3>
  }

  @if (errorState() && actions()) {
    <div class="bmb_loader-error-actions">
      <button
        bmbButton
        appearance="primary"
        size="large"
        (click)="handleButtonPrimary()"
        type="button"
      >
        {{ buttonPrimary() }}
      </button>
      <button
        bmbButton
        appearance="secondary-outlined"
        size="large"
        (click)="handleButtonSecondary()"
        type="button"
      >
        {{ buttonSecondary() }}
      </button>
    </div>
  }
</div>
