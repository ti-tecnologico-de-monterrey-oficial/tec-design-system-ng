<ng-template #commonIcon>
  <span [innerHTML]="iconSvg()" class="bmb_icon-svg" [ngClass]="{ 'bmb_icon-svg-auto-size': !!size() }" [ngStyle]="{
    'width': !!size() ? size() + 'px' : '1em',
    'height': !!size() ? size() + 'px' : '1em'
  }"></span>
</ng-template>
@if (isImage(icon())) {
  <figure class="bmb_icon-figure">
    <img
      class="bmb_icon-figure-image"
      [src]="icon()"
      [alt]="alt()"
      [ngStyle]="getImageStyles()"
    />
  </figure>
} @else if (!!dotNotification()) {
  <bmb-notification-counter [counter]="dotNotification()">
    <ng-container [ngTemplateOutlet]="commonIcon" />
  </bmb-notification-counter>
} @else {
  <ng-container [ngTemplateOutlet]="commonIcon" />
}
