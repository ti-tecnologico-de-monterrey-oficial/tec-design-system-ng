<ng-template #commonIcon>
  <i
    [ngClass]="styleIcon()"
    [ngStyle]="{
      'font-size': !!size() ? size() + 'px' : 'inherit',
      'font-variation-settings': getFontVariationSettings(),
    }"
  >
    {{ icon() }}
  </i>
</ng-template>
@if (isImage(icon())) {
  <figure class="bmb_icon-figure">
    <img
      class="bmb_icon-figure-image"
      [src]="icon()"
      [alt]="alt()"
      [ngStyle]="getImageStyles()"
    />
  </figure>
} @else if (dotNotification()) {
  <section class="bmb_icon-container">
    <ng-container [ngTemplateOutlet]="commonIcon" />
    <span class="bmb_icon-container-number">{{ dotNotification() }}</span>
  </section>
} @else {
  <ng-container [ngTemplateOutlet]="commonIcon" />
}
