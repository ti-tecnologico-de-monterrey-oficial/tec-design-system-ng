<ng-template #commonIcon>
  @if (icon()) {
    <span
      [innerHTML]="iconSvg()"
      class="bmb_icon-svg"
      [ngClass]="{ 'bmb_icon-svg-auto-size': !!size() }"
      [ngStyle]="{
        width: !!size() ? size() + 'px' : '1em',
        height: !!size() ? size() + 'px' : '1em'
      }"
    ></span>
  }
</ng-template>

@if (isSVGTemplate() && !!safeSVG) {
  <figure
    class="bmb_icon-figure"
    [ngStyle]="getImageStyles()"
    [attr.aria-label]="alt() || icon()"
  >
    <ng-container [ngTemplateOutlet]="customIcon() ?? null" />
  </figure>
} @else if (isSVGPath(icon())) {
  <div [innerHTML]="svgHtml()"></div>
} @else if (isImage(icon())) {
  <figure class="bmb_icon-figure" [ngStyle]="getImageStyles()">
    <img
      class="bmb_icon-figure-image"
      [src]="icon()"
      [alt]="alt()"
      [ngStyle]="getImageStyles()"
    />
  </figure>
} @else if (!!dotNotification()) {
  <bmb-notification-counter [counter]="dotNotification()">
    <ng-container [ngTemplateOutlet]="commonIcon" />
  </bmb-notification-counter>
} @else {
  <ng-container [ngTemplateOutlet]="commonIcon" />
}
