<bmb-container
  class="bmb_title-content"
  [ngClass]="{ 'bmb_title-content-transparent_bgc': transparentBgC() }"
>
  <section class="bmb_title-content-container">
    @if (!!icon() && !isAvatarIcon()) {
      <span class="bmb_title-content-container-icon" [ngStyle]="getStyles()">
        <bmb-icon [icon]="icon()" [size]="iconSize()" [alt]="title()" />
      </span>
    }
    @if (isAvatarIcon()) {
      <span class="bmb_title-content-container-avatar">
        <bmb-user-image [image]="icon()" [size]="avatarSize()"></bmb-user-image>
      </span>
    }
    <section class="bmb_title-content-container-wrapper">
      @if (!!title()) {
        <h2
          class="bmb_title-content-container-wrapper-title"
          [ngClass]="
            getClassNames(
              'bmb_title-content-container-wrapper-title',
              titleSize(),
              titleFontWeight()
            )
          "
        >
          {{ title() }}
        </h2>
      }
      @if (showBreadcrumbs()) {
        <span class="bmb_title-content-container-wrapper-breadcrumb">
          <bmb-breadcrumb [dataLocalNav]="dataLocalNav()" />
        </span>
      } @else if (!!subtitle()) {
        <h3
          class="bmb_title-content-container-wrapper-subtitle"
          [ngClass]="
            getClassNames(
              'bmb_title-content-container-wrapper-subtitle',
              subtitleSize(),
              subtitleFontWeight()
            )
          "
        >
          @if (!!subtitleIcon()) {
            <bmb-icon
              [icon]="subtitleIcon()"
              [size]="subtitleIconSize()"
              [alt]="subtitle() || 'Icono de subtítulo'"
            />
          }
          {{ subtitle() }}
        </h3>
      }
    </section>
  </section>
</bmb-container>
