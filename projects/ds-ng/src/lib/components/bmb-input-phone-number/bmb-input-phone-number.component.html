<section
  class="bmb_input_number"
  [ngClass]="{ 'bmb_input_number-disabled': disabled }"
>
<ngx-mat-intl-tel-input
  [required]="isRequired()"
  [disabled]="disabled()"
  [formControl]="getControl()"
  (ngModelChange)="handlePhoneChange($event)"
/>
  <p class="bmb_input_number-error" *ngIf="shouldShowError">
    {{ errorMessage() }}
  </p>
</section>
