<bmb-input-validation
  [type]="'text'"
  [name]="name()"
  [label]="label()"
  [value]="!!defaultCountryCode() ? value() : ''"
  [errorMessage]="getErrorMessage()"
  [helperMessage]="helperMessage()"
  [isRequired]="isRequired()"
  [idDisabled]="disabled()"
  [control]="control()"
  [showError]="shouldShowError || showError()"
  [tooltip]="tooltip()"
  [tooltipPosition]="tooltipPosition()"
  [isCustomError]="true"
  [customValidation]="customValidatorPhone()"
>
  <section class="bmb_input-phone">
    <section
      class="bmb_input-phone-container"
      [ngClass]="{
        'bmb_input-phone-container-error': shouldShowError || showError(),
        'bmb_input-phone-container-focus': isFocused(),
      }"
    >
      <bmb-dropdown
        class="bmb_input-phone-lada"
        [name]="getUUID('lada')"
        [value]="ladaControl.value"
        [required]="true"
        [disabled]="disabled()"
        [showIcon]="false"
        [options]="countryFiltering"
        [preferredOptions]="preferredCountries()"
        [control]="ladaControl"
        (onValueChange)="onValueChange($event)"
        (onFocus)="handleFocus($event)"
      />
      <bmb-input-content
        class="bmb_input-phone-number"
        [name]="getUUID('phone')"
        pattern="^\d+$"
        [isDisabled]="disabled()"
        [control]="phoneControl"
        [id]="inputId()"
        [maxlength]="getSelectedCountryLength(ladaControl.value)"
        [minlength]="getSelectedCountryLength(ladaControl.value)"
        [isRequired]="isRequired()"
        (onFocus)="handleFocus($event)"
        (onBlur)="handleValidity()"
      />
    </section>
    <input
      hidden
      type="text"
      [name]="name()"
      [required]="isRequired()"
      [formControl]="getFormControl()"
      [tabindex]="-1"
    />
  </section>
</bmb-input-validation>
