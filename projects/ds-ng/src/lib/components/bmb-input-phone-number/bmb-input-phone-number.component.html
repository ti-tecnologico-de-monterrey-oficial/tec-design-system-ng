<bmb-input-validation
  [type]="'text'"
  [name]="name()"
  [label]="label()!"
  [errorMessage]="getErrorMessage()"
  [helperMessage]="helperMessage()"
  [isRequired]="isRequired()"
  [disabled]="disabled()"
  [control]="control()"
  [showError]="shouldShowError"
  [tooltip]="tooltip()"
  [appearance]="appearance()"
  [isCustomError]="true"
  [customValidation]="customValidatorPhone()"
>
  <section class="bmb_input-number">
    <section
      class="bmb_input-number-container"
      [ngClass]="{ 'bmb_input-number-container-error': shouldShowError }"
    >
      <bmb-dropdown
        [required]="true"
        [showIcon]="false"
        [options]="getOptions()"
        (onValueChange)="onValueChange($event)"
        [control]="getControl('select')"
      />
      <bmb-input
        class="bmb_input-number-input"
        name="input"
        pattern="^\d+$"
        [value]="getNumberValue()"
        [appearance]="appearance()"
        [disabled]="disabled()"
        [control]="getControl('input')"
        [id]="inputId()"
        [maxlength]="selectedCountry?.length"
        [minlength]="selectedCountry?.length"
        [isRequired]="isRequired()"
      />
    </section>
    <input
      hidden
      type="text"
      name="name"
      [required]="isRequired()"
      [formControl]="getFormControl(name())"
      [name]="name()"
      [tabindex]="-1"
    />
  </section>
</bmb-input-validation>
