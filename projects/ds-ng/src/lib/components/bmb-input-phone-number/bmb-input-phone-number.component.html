<span class="bmb_input-number">
  <label class="bmb_input-validation-label" for="#bmbInputPhoneNumber">
    {{ label() }}
    @if (isRequired()) {
      <small class="bmb_input-validation-label-required">*</small>
    }
    @if (!!tooltip()) {
      <bmb-tooltip
        class="bmb_input-validation-label-tooltip"
        [text]="tooltip()"
        align="below"
        justify="before"
        icon="help"
        [size]="15"
      />
    }
  </label>
  <span class="bmb_input-number-container">
    <bmb-dropdown
      [required]="true"
      [showIcon]="false"
      [options]="getOptions()"
      (onValueChange)="onValueChange($event)"
      [control]="getControl('select')"
    />
    <bmb-input
      [placeholder]="placeholder()"
      [appearance]="appearance()"
      [errorMessage]="errorMessage()"
      [disabled]="disabled()"
      [tooltip]="tooltip()"
      [control]="getControl('input')"
      [id]="inputId()"
      type="text"
      class="bmb_input-number-input"
    />
  </span>
  <bmb-input
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [isRequired]="isRequired()"
    [tooltip]="tooltip()"
    [control]="control()"
    hidden
  />
  @if (helperMessage()) {
    <span class="bmb_input-validation-helper">{{ helperMessage() }}</span>
  }
  @if (getErrors()) {
    <p class="bmb_input-validation-error">
      {{ getErrorMessage() }}
    </p>
  }
</span>
