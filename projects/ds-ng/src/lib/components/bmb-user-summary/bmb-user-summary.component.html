<section
  class="bmb_user-summary"
  [ngClass]="{
    'bmb_user-summary-is_profile': isProfile(),
    'bmb_user-summary-is_profile-no_box': isProfile() && noBox(),
  }"
>
  <bmb-user-summary-content
    [isProfile]="isProfile()"
    [name]="name()"
    [userId]="userId()"
    [image]="image()"
    [infoCareer]="infoCareer()"
    [salutation]="salutation()"
  />
  @if (isProfile()) {
    <button
      class="bmb_user-summary-button"
      bmbButton
      appearance="secondary-outlined"
      (click)="handleClick()"
    >
      ID Digital
    </button>
  }
</section>
