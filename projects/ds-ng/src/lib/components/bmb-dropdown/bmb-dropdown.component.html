<bmb-input-validation
  class="bmb_dropdown"
  type="text"
  [name]="name()"
  [value]="getValidInitialValues()"
  [label]="label()!"
  [errorMessage]="errorMessage()"
  [helperMessage]="helperText()"
  [isRequired]="required()"
  [idDisabled]="disabled()"
  [control]="control()"
  [showError]="shouldShowError"
  [tooltip]="tooltip()"
  [tooltipPosition]="tooltipPosition()"
  clickOutside
  (clickOutside)="closeList()"
>
  <bmb-input-content
    type="text"
    [id]="'selection' + getUUID()"
    name="selection"
    [icon]="getIcon()"
    [isReadOnly]="true"
    [control]="selectionControl"
    [placeholder]="placeholder()"
    [isError]="shouldShowError"
    [isDisabled]="disabled()"
    (click)="openList()"
    (onKeyDown)="onKeyDown($event)"
    (onBlur)="handleValidity()"
    (onFocus)="handleFocus($event)"
  >
    <ng-template #customContent>
      <bmb-icon
        class="bmb_field-actions"
        icon="keyboard_arrow_down"
        [size]="24"
        (click)="openList()"
      />
    </ng-template>
  </bmb-input-content>
  <bmb-dropdown-content
    name="list"
    [selectedOption]="getFormControl().value"
    [(items)]="items"
    [(isOpen)]="isOpen"
  />
  <input
    hidden
    type="text"
    [id]="name() + getUUID()"
    [name]="name()"
    [formControl]="getFormControl()"
  />
</bmb-input-validation>
