<bmb-input-validator
  class="bmb_dropdown"
  [inputId]="inputId()"
  [name]="name()"
  [value]="getValidInitialValues()"
  [label]="label()!"
  [errorMessage]="errorMessage()"
  [helperMessage]="helperText()"
  [isRequired]="required()"
  [isDisabled]="disabled()"
  [control]="control()"
  [showError]="shouldShowError"
  [tooltip]="tooltip()"
  [tooltipPosition]="tooltipPosition()"
  [customValidation]="customValidation()"
>
  <div #contentDiv>
    <bmb-input-content
      class="bmb_dropdown-field"
      type="text"
      [inputId]="inputId()"
      [name]="name()"
      [icon]="getIcon()"
      [control]="selectionControl"
      [isReadOnly]="true"
      [placeholder]="placeholder()"
      [isError]="shouldShowError"
      (click)="openList()"
      (onKeyDown)="onKeyDown($event)"
      (onBlur)="handleValidity()"
      (onFocus)="handleFocus($event)"
    >
      <ng-template #customContent>
        <label [htmlFor]="inputId()">
          <bmb-icon
            class="bmb_field-actions"
            icon="keyboard_arrow_down"
            (click)="openList()"
            [size]="24"
          />
        </label>
      </ng-template>
    </bmb-input-content>
  </div>
  <input
    hidden
    type="text"
    [id]="getUUID('id')"
    [name]="name()"
    [formControl]="control()"
  />
</bmb-input-validator>
