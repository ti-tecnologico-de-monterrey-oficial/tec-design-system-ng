<bmb-input-validator
  class="bmb_dropdown"
  [name]="name()"
  [value]="getValidInitialValues()"
  [label]="label()!"
  [errorMessage]="errorMessage()"
  [helperMessage]="helperText()"
  [isRequired]="required()"
  [isDisabled]="disabled()"
  [control]="control()"
  [showError]="shouldShowError"
  [tooltip]="tooltip()"
  [tooltipPosition]="tooltipPosition()"
  clickOutside
  (clickOutside)="closeList()"
  [inputId]="inputId()"
>
  <bmb-input-content
    class="bmb_dropdown-field"
    type="text"
    [inputId]="inputId()"
    [name]="name()"
    [icon]="getIcon()"
    [isReadOnly]="!isFilterable()"
    [control]="selectionControl"
    [placeholder]="placeholder()"
    [isError]="shouldShowError"
    [isDisabled]="disabled()"
    (click)="openList()"
    (onKeyDown)="onKeyDown($event)"
    (onBlur)="handleValidity()"
    (onFocus)="handleFocus($event)"
  >
    <ng-template #customContent>
      <label [htmlFor]="inputId()">
        <bmb-icon
          class="bmb_field-actions"
          icon="keyboard_arrow_down"
          (click)="openList()"
          [size]="24"
        />
      </label>
    </ng-template>
  </bmb-input-content>
  <bmb-dropdown-content
    class="bmb_dropdown-list"
    [selectedOption]="control().value"
    [isKeyboardEvent]="isKeyboardEvent"
    [(items)]="filteredOptions"
    [(isOpen)]="isOpen"
  />
  <input
    hidden
    type="text"
    [id]="getUUID('id')"
    [name]="name()"
    [formControl]="control()"
  />
</bmb-input-validator>
