<bmb-input-validator
  class="bmb_dropdown"
  [inputId]="inputId()"
  [name]="name()"
  [value]="getValidInitialValues()"
  [label]="label()!"
  [errorMessage]="errorMessage()"
  [helperMessage]="helperText()"
  [isRequired]="required()"
  [isDisabled]="disabled()"
  [control]="control()"
  [showError]="shouldShowError"
  [tooltip]="tooltip()"
  [customValidation]="customValidation()"
>
  <div #contentDiv>
    <bmb-input-content
      class="bmb_dropdown-field"
      type="text"
      [inputId]="inputId()"
      [name]="name()"
      [icon]="getIcon()"
      [control]="selectionControl"
      [isReadOnly]="true"
      [placeholder]="placeholder()"
      [isError]="shouldShowError"
      (click)="openList()"
      (onKeyDown)="onKeyDown($event)"
      (onBlur)="handleValidity()"
      (onFocus)="handleFocus($event)"
    >
      <ng-template #customContent>
        <label [htmlFor]="inputId()">
          <section
            bmbLayout
            margin="none"
            [gapSize]="isMultiSelect() ? 's' : 'none'"
          >
            @if (isMultiSelect()) {
              <bmb-tag
                [text]="'+1'"
                [dismissible]="true"
                [isDisabled]="false"
                (closedTag)="handleClearSelectedOptions()"
                bmbLayoutItem
              />
            }
            <bmb-icon
              class="bmb_field-actions"
              icon="keyboard_arrow_down"
              (click)="openList()"
              [size]="24"
              bmbLayoutItem
            />
          </section>
        </label>
      </ng-template>
    </bmb-input-content>
  </div>
  <input
    hidden
    type="text"
    [id]="getUUID('id')"
    [name]="name()"
    [formControl]="control()"
  />
</bmb-input-validator>
