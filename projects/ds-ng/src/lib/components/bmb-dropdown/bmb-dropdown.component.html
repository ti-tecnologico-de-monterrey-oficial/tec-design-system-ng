<section
  class="bmb_dropdown"
  [ngClass]="{ 'bmb_dropdown-disabled': disabled() }"
  clickOutside
  (clickOutside)="closeDialog()"
  (click)="openDialog($event)"
>
  <div class="bmb_dropdown-wrapper">
    @if (label()) {
      <div class="bmb_dropdown-label">
        <label class="bmb_dropdown-label-text"
          >{{ label() }}
          @if (required()) {
            <span class="bmb_dropdown-label-asterisk"> *</span>
          }
        </label>
      </div>
    }
    <div
      class="bmb_dropdown-input-wrapper"
      onkeypress=""
      #inputWrapper
      [ngClass]="{ 'bmb_dropdown-focus': isFocus }"
    >
      @if (showIcon()) {
        <label class="bmb_dropdown-label-icon" [for]="'dropdown-'">
          <bmb-icon [icon]="icon()!" />
        </label>
      }
      <input
        class="bmb_dropdown-field-input"
        type="text"
        readonly
        [id]="'bmb-dropdown' + uid"
        [name]="'bmb-dropdown' + uid"
        [formControl]="inputControl"
        [placeholder]="placeholder()"
        (keydown)="onKeyDown($event)"
      />
      <button
        (click)="handleChevronClick()"
        class="bmb_dropdown-field-open"
        [disabled]="disabled()"
        bmbButton
      >
        <bmb-icon icon="keyboard_arrow_down" />
      </button>
      <dialog
        class="bmb_dropdown-dialog"
        [ngClass]="{ 'bmb_dropdown-dialog-open': openSelect }"
        [open]="getDialogStatus()"
      >
        <ul class="bmb_dropdown-dialog-list">
          @if (preferredOptions().length) {
            <li class="bmb_dropdown-dialog-list-item-preferred-options">
              <ul class="bmb_dropdown-dialog-list-item-preferred-list">
                @for (item of getPreferredOptions(); track $index) {
                  <li class="bmb_dropdown-dialog-list-item">
                    <button
                      class="bmb_dropdown-dialog-list-item-button"
                      (click)="handleItemClick(item)"
                    >
                      @if (showIcon()) {
                        <bmb-icon
                          class="bmb_dropdown-dialog-list-item-button-icon"
                          [icon]="item.icon"
                        />
                      }
                      {{ item.name }}
                    </button>
                  </li>
                }
              </ul>
            </li>
          }
          @for (item of parsedOptions; track $index) {
            <li class="bmb_dropdown-dialog-list-item">
              <button
                class="bmb_dropdown-dialog-list-item-button"
                [ngClass]="{
                  'bmb_dropdown-dialog-list-item-button-selected':
                    item.value == selectedIndexOption,
                }"
                (click)="handleItemClick(item)"
              >
                @if (showIcon()) {
                  <bmb-icon
                    class="bmb_dropdown-dialog-list-item-button-icon"
                    [icon]="item.icon"
                  />
                }
                {{ item.name }}
              </button>
            </li>
          }
        </ul>
      </dialog>
    </div>
    @if (helperText()) {
      <div class="bmb_dropdown-helper">
        <span class="bmb_dropdown-helper-text">
          {{ helperText() }}
        </span>
      </div>
    }
  </div>
</section>
