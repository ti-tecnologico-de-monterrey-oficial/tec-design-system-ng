<bmb-input-validator
  class="bmb_dropdown"
  [inputId]="inputId()"
  [name]="name()"
  [value]="getValidInitialValues()"
  [label]="label()!"
  [errorMessage]="errorMessage()"
  [helperMessage]="helperText()"
  [isRequired]="required()"
  [isDisabled]="disabled()"
  [control]="control()"
  [showError]="shouldShowError"
  [tooltip]="tooltip()"
  [customValidation]="customValidation()"
>
  <div #contentDiv>
    <bmb-input-content
      class="bmb_dropdown-field"
      type="text"
      [inputId]="inputId()"
      [name]="name()"
      [icon]="getIcon()"
      [control]="selectionControl"
      [isReadOnly]="true"
      [placeholder]="placeholder()"
      [isError]="shouldShowError"
      [isClearable]="
        isMultiSelect() && isSelectedLengthAtLeastOne && !selectedOptionCounter
      "
      (onKeyDown)="onKeyDown($event)"
      (onBlur)="handleValidity()"
      (onFocus)="handleFocus($event)"
      (onChange)="handleChangeValue($event)"
    >
      <ng-template #customContent>
        <label [htmlFor]="inputId()">
          <section
            bmbLayout
            margin="none"
            [gapSize]="isMultiSelect() ? 's' : 'none'"
          >
            @if (isMultiSelect() && !!selectedOptionCounter) {
              <bmb-tag
                [text]="tagValue"
                [dismissible]="true"
                [enableClick]="true"
                [isDisabled]="false"
                (closedTag)="handleClearSelectedOptions()"
                (clickedTag)="handleClearSelectedOptions()"
                bmbLayoutItem
              />
            }
            <bmb-action-icon
              [icon]="isOpenList ? 'keyboard_arrow_up' : 'keyboard_arrow_down'"
              [iconSize]="24"
              (buttonClick)="openList()"
              bmbLayoutItem
              [alt]="
                (isOpenList
                  ? 'dropdown.close_options'
                  : 'dropdown.open_options'
                ) | translate
              "
            />
          </section>
        </label>
      </ng-template>
    </bmb-input-content>
  </div>
  <input
    hidden
    type="text"
    [id]="getUUID('id')"
    [name]="name()"
    [formControl]="control()"
  />
</bmb-input-validator>
