<section
  class="bmb_dropdown"
  [ngClass]="{ 'bmb_dropdown-disabled': disabled() }"
>
  <div class="bmb_dropdown-wrapper">
    <div class="bmb_dropdown-label">
      @if (label()) {
        <label class="bmb_dropdown-label-text"
          >{{ label() }}
          @if (required()) {
            <span class="bmb_dropdown-label-asterisk"> *</span>
          }
        </label>
      }
    </div>
    <div
      class="bmb_dropdown-input-wrapper"
      onkeypress=""
      #inputWrapper
      [ngClass]="{ 'bmb_dropdown-focus': isFocus }"
    >
      @if (showIcon()) {
        <label class="bmb_dropdown-label-icon" [for]="'dropdown-'">
          <bmb-icon [icon]="icon()!" />
        </label>
      }
      <input
        class="bmb_dropdown-field-input"
        type="text"
        readonly
        [id]="'bmb-dropdown' + uid"
        [name]="'bmb-dropdown' + uid"
        [formControl]="control()"
        [placeholder]="placeholder()"
        (keydown)="onKeyDown($event)"
        (click)="openDialog()"
      />
      <button
        class="bmb_dropdown-field-open"
        [disabled]="disabled()"
        bmbButton
        (click)="openDialog()"
      >
        <bmb-icon icon="keyboard_arrow_down" />
      </button>
      <dialog
        class="bmb_dropdown-dialog"
        [ngClass]="{ 'bmb_dropdown-dialog-open': openSelect }"
      >
        <ul class="bmb_dropdown-dialog-list">
          @for (item of options(); track $index) {
            <li class="bmb_dropdown-dialog-list-item">
              <button
                class="bmb_dropdown-dialog-list-item-button"
                [ngClass]="{
                  'bmb_dropdown-dialog-list-item-button-selected':
                    $index == selectedIndexOption,
                }"
                (click)="handleItemClick(getItem(item), $index)"
              >
                @if (showIcon()) {
                  <bmb-icon
                    class="bmb_dropdown-dialog-list-item-button-icon"
                    [icon]="getItem(item).icon"
                  />
                }
                {{ getItem(item).name }}
              </button>
            </li>
          }
        </ul>
      </dialog>
    </div>
    @if (helperText() !== undefined) {
      <div class="bmb_dropdown-helper">
        <span class="bmb_dropdown-helper-text">
          {{ helperText() }}
        </span>
      </div>
    }
  </div>
</section>
