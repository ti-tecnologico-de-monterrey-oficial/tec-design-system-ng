<div class="bmb_pull_wedge" [style.height.px]="contentHeight">
  <div class="bmb_pull_wedge-wrapper">
    <div #content class="bmb_pull_wedge-content" [class.visible]="isVisible">
      <ng-content select="[collapsible]"></ng-content>
    </div>
    <div
      class="bmb_pull_wedge-drag"
      cdkDrag
      (cdkDragStarted)="onDragStarted($event)"
      (cdkDragMoved)="onDragMoved($event)"
      (cdkDragEnded)="onDragEnded($event)"
    >
      <button type="button" class="bmb_pull_wedge-button"></button>
    </div>
  </div>
</div>
