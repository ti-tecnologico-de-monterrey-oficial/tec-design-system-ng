<bmb-input-validator
  type="radio"
  [inputId]="id()"
  [name]="name()"
  [label]="label()"
  [labelPosition]="labelPosition()"
  [checked]="checked()"
  [value]="value()"
  [errorMessage]="errorMessage()"
  [helperMessage]="helperMessage()"
  [isRequired]="required()"
  [idDisabled]="disabled()"
  [control]="control()"
  [showError]="shouldShowError"
>
  <span class="bmb_radio">
    <input
      class="bmb_radio-input"
      type="radio"
      [id]="id()"
      [formControl]="control()"
      [name]="name()"
      [attr.aria-describedby]="ariaDescribedby()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-labelledby]="ariaLabelledby()"
      [attr.value]="value()"
      [value]="value()"
      [checked]="checked()"
      [required]="required()"
      (change)="handleRadioChange($event)"
      (keydown)="handleRadioKeyDown($event)"
      (keypress)="handleKeyPress($event)"
      [tabindex]="disabled() ? -1 : 0"
    />
    <span
      class="bmb_radio-mark"
      [ngClass]="{ 'bmb_radio-mark-error': shouldShowError }"
    ></span>
  </span>
</bmb-input-validator>
