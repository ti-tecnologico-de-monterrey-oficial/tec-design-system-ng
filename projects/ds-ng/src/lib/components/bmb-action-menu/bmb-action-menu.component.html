<section class="bmb_action-menu">
  @if (showHeader()) {
    <bmb-home-card-header
      [title]="title()"
      [subtitle]="subtitle()"
      [icon]="icon()"
      [iconSize]="iconSize()!"
      [bgIconAppearance]="bgIconAppearance()"
      [showRightButton]="false"
    />
  }
  <ul class="bmb_action-menu-list" [ngClass]="{ action: !showHeader() }">
    @for (element of projectedContent; track $index) {
      <li class="bmb_action-menu-item">
        <ng-container *ngTemplateOutlet="element" />
      </li>
    }
  </ul>
  <ng-content />
</section>
